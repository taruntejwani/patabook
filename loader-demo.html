<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Loader Demo — PataBook</title>
<link rel="icon" href="pin.png">
<style>
:root{--navy:#0b2f73;--blue:#1a73e8;--line:#e4eaf5;--muted:#5b6475}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f7fc;color:#12141c;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:21px;color:var(--navy)}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px;line-height:1.5}
.tiers{display:flex;gap:8px;margin:16px 0 6px}
.tiers button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
.tiers button.on[data-t=silver]{background:linear-gradient(135deg,#f3f5f8,#c3cbd6);border-color:#8f9aa8}
.tiers button.on[data-t=gold]{background:linear-gradient(135deg,#fdf0c4,#e7c36a);border-color:#b8860b}
.tiers button.on[data-t=platinum]{background:linear-gradient(135deg,#ede4ff,#a78bfa);border-color:#6d28d9;color:#2e0f66}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.it{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;width:100%;box-shadow:0 4px 14px rgba(26,115,232,.06)}
.it .no{flex:none;width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px}
.it b{display:block;font-size:15.5px;color:var(--navy)}
.it small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.it .pl{margin-left:auto;flex:none;font-size:22px;color:var(--blue)}
.note{margin-top:16px;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---------- सबके लिए ---------- */
.ov{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;
 --c1:#4c1d95;--c2:#14052c;--ink:#f5f0ff;--acc:#c4b5fd;--gold:#e9c46a;--cf1:#fff;--cf2:#efe7ff;--dk:#1b1033}
.ov.t-gold{--c1:#5a3d07;--c2:#120b01;--ink:#fff6dc;--acc:#f3d27a;--gold:#f3c64b;--cf1:#fffdf6;--cf2:#f6e7bd;--dk:#2b1d02}
.ov.t-silver{--c1:#4b5563;--c2:#0f141b;--ink:#f8fafc;--acc:#cbd5e1;--gold:#e2e8f0;--cf1:#ffffff;--cf2:#e7ebf0;--dk:#1f2833}
.ov.out{opacity:0;transition:opacity .55s ease;pointer-events:none}
.ov .skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:9;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.3);color:#fff;border-radius:999px;padding:6px 12px;font:700 12px system-ui;cursor:pointer}
.ov .tg{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));font:700 clamp(10px,2.8vw,12px)/1 Georgia,serif;letter-spacing:.3em;color:color-mix(in srgb,var(--ink) 70%,transparent);opacity:0;animation:fa .6s ease 1.2s forwards}
.lgc{border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
.lgc img{width:100%;height:100%;object-fit:cover}
.lgc b{font:900 46px/1 "Inter",system-ui,sans-serif;color:var(--c1)}
@keyframes fa{from{opacity:0}to{opacity:1}}

/* ---------- 1. Royal Entry ---------- */
.L1{background:radial-gradient(120% 85% at 50% 38%,var(--c1),var(--c2) 72%)}
.L1 .rays{position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:.1;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000,transparent 55%);mask:radial-gradient(circle,#000,transparent 55%);animation:spin 14s linear infinite}
.L1 .st{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 20px;margin-top:-6vh}
.L1 .emb{width:86px;margin-bottom:-14px;position:relative;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));opacity:0;animation:drop .8s cubic-bezier(.3,1.5,.5,1) .55s forwards}
.L1 .lo{position:relative;width:124px;height:124px}
.L1 .lo i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0;animation:ring 1.6s ease-out .2s infinite}.L1 .lo i+i{animation-delay:.75s}
.L1 .lgc{position:absolute;inset:0;box-shadow:0 0 0 4px var(--gold),0 0 0 9px rgba(255,255,255,.12),0 18px 40px rgba(0,0,0,.45);transform:scale(0);animation:pop .7s cubic-bezier(.3,1.6,.5,1) .2s forwards}
.L1 .nm{margin-top:22px;font:800 clamp(26px,8vw,42px)/1.18 "Noto Sans Devanagari","Inter",system-ui,sans-serif;color:var(--ink);text-shadow:0 4px 18px rgba(0,0,0,.45)}
.L1 .nm .w{display:inline-block;white-space:nowrap;opacity:1;transform:none;animation:none}.L1 .nm .w span,.L1 .nm>span:not(.w){display:inline-block;}
.L1 .nm .w span{opacity:0;transform:translateY(.7em) rotateX(70deg);animation:ch .55s cubic-bezier(.2,.9,.3,1.3) forwards}.L1 .nm .sp{width:.28em;opacity:1;transform:none;animation:none}
.L1 .ln{display:block;height:2px;width:0;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:line .6s ease forwards}
.L1 .mt{margin-top:10px;font:700 13px/1.4 Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);opacity:0;animation:fa .5s ease forwards}
.L1 .mt span{color:var(--gold);letter-spacing:.1em;margin-left:10px;font-family:system-ui}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes drop{0%{opacity:0;transform:translateY(-60px) scale(.6)}100%{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.9);opacity:0}}@keyframes pop{to{transform:scale(1)}}
@keyframes ch{to{opacity:1;transform:none}}@keyframes line{to{width:min(66vw,300px)}}

/* ---------- 2. Business Card ---------- */
.L2{background:radial-gradient(110% 80% at 50% 45%,var(--c1),var(--c2) 75%)}
.L2 .scn{perspective:1100px}
.L2 .cd{position:relative;width:min(86vw,390px);aspect-ratio:1.72/1;transform-style:preserve-3d;animation:flip 1.5s cubic-bezier(.25,.8,.25,1) .25s both}
.L2 .fc{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.L2 .bk{transform:rotateY(180deg);background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;border:1px solid rgba(255,255,255,.25)}
.L2 .bk .lgc{width:70px;height:70px;box-shadow:0 0 0 3px var(--gold)}
.L2 .bk small{font:700 10px/1 Georgia,serif;letter-spacing:.28em;opacity:.85}
.L2 .fr{background:linear-gradient(135deg,var(--cf1),var(--cf2));color:var(--dk);display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:1fr auto;column-gap:14px;padding:18px 18px 12px;border:2px solid var(--gold);text-align:left}
.L2 .fr .em{position:absolute;top:8px;right:8px;width:58px}
.L2 .fr .lgc{width:74px;height:74px;border-radius:18px;align-self:center;box-shadow:0 0 0 3px var(--gold)}
.L2 .fr .tx{align-self:center;min-width:0;padding-right:54px}
.L2 .fr .n{font:800 clamp(17px,5vw,21px)/1.2 "Noto Sans Devanagari","Inter",system-ui,sans-serif}
.L2 .fr .c{margin-top:4px;font:700 11px/1.3 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.L2 .fr .s{margin-top:4px;color:#e2a400;font-size:14px;letter-spacing:.1em}
.L2 .fr .ft{grid-column:1/3;display:flex;justify-content:space-between;border-top:1px dashed var(--gold);padding-top:8px;font:600 11.5px system-ui;opacity:.8}
.L2 .fr .sh{position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:shine 1s ease 1.9s both}
.L2.out .cd{animation:zoom .65s cubic-bezier(.6,.05,.3,1) forwards}
@keyframes flip{0%{transform:translateY(60px) rotateY(-220deg) rotateX(16deg) scale(.4)}35%{transform:translateY(10px) rotateY(-150deg) rotateX(8deg) scale(.8)}62%{transform:rotateY(-10deg) rotateX(3deg) scale(1.04)}80%{transform:rotateY(5deg)}100%{transform:none}}
@keyframes shine{from{left:-60%}to{left:130%}}@keyframes zoom{to{transform:scale(2.6)}}

/* ---------- 3. Shutter (दुकान का शटर खुले) ---------- */
.L3{background:radial-gradient(110% 80% at 50% 50%,var(--c1),var(--c2) 75%);flex-direction:column}
.L3 .shop{position:relative;width:min(88vw,380px)}
.L3 .awn{height:44px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,var(--gold) 0 34px,#fff 34px 68px);box-shadow:0 8px 16px rgba(0,0,0,.35);position:relative;z-index:3;transform-origin:top;animation:awn .6s cubic-bezier(.3,1.5,.5,1) .1s both}
.L3 .awn:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:14px;background:radial-gradient(circle at 17px 0,var(--gold) 16px,transparent 17px) 0 0/68px 14px repeat-x,radial-gradient(circle at 51px 0,#fff 16px,transparent 17px) 0 0/68px 14px repeat-x}
.L3 .win{position:relative;height:250px;background:linear-gradient(180deg,var(--cf1),var(--cf2));border-radius:0 0 14px 14px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;box-shadow:0 26px 50px rgba(0,0,0,.45);border:3px solid var(--gold);border-top:0}
.L3 .win .lgc{width:86px;height:86px;box-shadow:0 0 0 3px var(--gold);transform:scale(.6);opacity:0;animation:pop2 .6s cubic-bezier(.3,1.6,.5,1) 1.55s forwards}
.L3 .win .n{font:800 clamp(19px,5.6vw,24px)/1.2 "Noto Sans Devanagari","Inter",system-ui,sans-serif;color:var(--dk);opacity:0;animation:up .5s ease 1.75s forwards}
.L3 .win .c{font:700 11px Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:var(--dk);opacity:0;animation:fa .5s ease 1.95s forwards}
.L3 .sht{position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(180deg,#9aa3ad 0 10px,#c7ced6 10px 12px,#8a929b 12px 14px);transform-origin:top;animation:roll 1s cubic-bezier(.6,0,.3,1) .7s forwards}
.L3 .sht:after{content:"";position:absolute;left:50%;bottom:10px;width:46px;height:8px;margin-left:-23px;border-radius:4px;background:#5b636c}
.L3 .open{position:absolute;top:58px;left:50%;transform:translateX(-50%) rotate(-6deg) scale(0);z-index:4;background:#16a34a;color:#fff;font:900 14px/1 system-ui;letter-spacing:.12em;padding:7px 14px;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.3);animation:sign .5s cubic-bezier(.3,1.7,.5,1) 2.25s forwards}
@keyframes awn{from{transform:scaleY(0)}to{transform:none}}@keyframes roll{to{transform:translateY(-102%)}}
@keyframes pop2{to{transform:none;opacity:1}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sign{to{transform:translateX(-50%) rotate(-6deg) scale(1)}}

/* ---------- 4. Spotlight / Neon ---------- */
.L4{background:#05060a}
.L4 .spot{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--acc) 40%,transparent) 0,rgba(255,255,255,.07) 11%,transparent 19%);animation:sweep 1.6s cubic-bezier(.4,0,.2,1) .1s both}
.L4 .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 18px}
.L4 .lgc{width:104px;height:104px;box-shadow:0 0 0 3px var(--acc),0 0 30px var(--acc),0 0 70px color-mix(in srgb,var(--acc) 60%,transparent);opacity:0;animation:fa .4s ease 1.5s forwards}
.L4 .nm{font:800 clamp(26px,8vw,42px)/1.15 "Noto Sans Devanagari","Inter",system-ui,sans-serif;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--acc),0 0 32px var(--acc),0 0 60px var(--acc);opacity:0;animation:neon 1.2s steps(1,end) 1.55s forwards}
.L4 .mt{font:700 12px Georgia,serif;letter-spacing:.3em;color:var(--acc);text-transform:uppercase;opacity:0;animation:fa .6s ease 2.6s forwards}
.L4 .sp{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);opacity:0;animation:spark 1.6s ease-out forwards}
@keyframes sweep{0%{transform:translate(-42%,-30%)}45%{transform:translate(30%,18%)}100%{transform:translate(0,-6%)}}
@keyframes neon{0%{opacity:0}8%{opacity:1}12%{opacity:.15}18%{opacity:1}26%{opacity:.3}32%,100%{opacity:1}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}

/* ---------- 5. Map Pin Drop (PataBook वाला) ---------- */
.L5{background:#e8eef7}
.L5 .map{position:absolute;inset:-10%;background:
  linear-gradient(90deg,transparent 46%,#fff 46% 49%,transparent 49%) 0 0/120px 120px,
  linear-gradient(0deg,transparent 46%,#fff 46% 49%,transparent 49%) 0 0/120px 120px,
  radial-gradient(circle at 30% 40%,#cfe8d4 0 60px,transparent 61px) 0 0/260px 260px,
  radial-gradient(circle at 70% 75%,#d6e4fa 0 50px,transparent 51px) 0 0/300px 300px,#eef2ea;
  transform:scale(2.2);animation:mapz 1.6s cubic-bezier(.3,.7,.3,1) forwards}
.L5 .map:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 47%,var(--gold) 47% 49%,transparent 49%)}
.L5 .pin{position:absolute;left:50%;top:50%;width:64px;margin:-82px 0 0 -32px;z-index:3;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:pdrop 1s cubic-bezier(.3,.6,.4,1) 1.05s both;transform-origin:50% 100%}
.L5 .rip{position:absolute;left:50%;top:50%;width:30px;height:12px;margin:-6px 0 0 -15px;border-radius:50%;border:3px solid var(--c1);opacity:0;z-index:2;animation:rip 1.2s ease-out 1.7s 2}
.L5 .card{position:absolute;left:50%;top:50%;z-index:4;width:min(84vw,340px);transform:translate(-50%,24px) scale(.6);opacity:0;background:#fff;border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;animation:cardup .55s cubic-bezier(.3,1.5,.5,1) 2.25s forwards;border-top:4px solid var(--c1)}
.L5 .card .lgc{width:56px;height:56px;flex:none;border-radius:14px;box-shadow:0 0 0 2px var(--gold)}
.L5 .card b{display:block;font:800 16px/1.25 "Noto Sans Devanagari","Inter",system-ui,sans-serif;color:#12141c}
.L5 .card small{display:block;font-size:12.5px;color:#5b6475;margin-top:2px}
.L5 .card .s{color:#e2a400;letter-spacing:.08em}
.L5 .card .em{position:absolute;top:-22px;right:-8px;width:56px}
.L5 .tg{color:#5b6475}
@keyframes mapz{to{transform:scale(1)}}
@keyframes pdrop{0%{opacity:0;transform:translateY(-70vh)}55%{opacity:1;transform:translateY(0) scaleY(.86)}68%{transform:translateY(-18%)}82%{transform:translateY(0) scaleY(.94)}100%{opacity:1;transform:none}}
@keyframes rip{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(3.2)}}
@keyframes cardup{to{opacity:1;transform:translate(-50%,-150%) scale(1)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 दुकान के 5 Loader — Demo</h1>
  <p class="sub">Tejwani Detergent And Chemical के लिए। ऊपर plan चुनें, फिर किसी loader पर दबाएँ — पूरी screen पर चलेगा। देखते समय कहीं भी दबाने से बंद।</p>
  <div class="tiers" id="tiers"><button type="button" data-t="silver">🥈 Silver</button><button type="button" data-t="gold">👑 Gold</button><button type="button" data-t="platinum" class="on">💎 Platinum</button></div>
  <div class="list">
    <button type="button" class="it" data-l="1"><span class="no">1</span><span><b>👑 Royal Entry</b><small>शाही परदा, logo अँगूठी में, अक्षर एक-एक उठें, logo उड़कर पेज पर</small></span><span class="pl">▶</span></button>
    <button type="button" class="it" data-l="2"><span class="no">2</span><span><b>💳 Business Card</b><small>3D visiting card घूमकर पलटे, चमक, फिर बड़ा होकर पेज</small></span><span class="pl">▶</span></button>
    <button type="button" class="it" data-l="3"><span class="no">3</span><span><b>🏪 दुकान का शटर</b><small>छतरी खुले, शटर ऊपर उठे, अंदर दुकान का नाम और "OPEN" बोर्ड</small></span><span class="pl">▶</span></button>
    <button type="button" class="it" data-l="4"><span class="no">4</span><span><b>🎤 Spotlight Neon</b><small>अँधेरे में spotlight घूमे, नाम neon board की तरह झिलमिलाकर जले, चिंगारियाँ</small></span><span class="pl">▶</span></button>
    <button type="button" class="it" data-l="5"><span class="no">5</span><span><b>📍 Map Pin Drop</b><small>नक्शा पास आए, PataBook pin दुकान पर गिरे, ऊपर दुकान का card उठे</small></span><span class="pl">▶</span></button>
  </div>
  <p class="note">यह सिर्फ़ देखने के लिए demo पेज है (Google में नहीं दिखेगा)। पसंद बताइए — किस plan पर कौन-सा loader लगाना है।</p>
</div>
<script>
(function(){
const SHOP={name:"Tejwani Detergent And Chemical",cat:"Automobile",rating:5,area:"BharatNagar, Gandhidham",
  logo:"https://kkvbpzysktozghnxplxv.supabase.co/storage/v1/object/public/shop-logos/tejwani-detergent-and-chemical-gandhidham-31oyn/logo-1793432240425-0.webp"};
let T="platinum";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LG=()=>'<span class="lgc"><img src="'+SHOP.logo+'" alt="" onerror="this.parentNode.innerHTML=\'<b>T</b>\'"></span>';
const stars=()=>"★".repeat(SHOP.rating)+"☆".repeat(5-SHOP.rating);
document.getElementById("tiers").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;T=b.dataset.t;document.querySelectorAll("#tiers button").forEach(x=>x.classList.toggle("on",x===b));};
function play(n){
  const ov=document.createElement("div");ov.className="ov L"+n+" t-"+T;let h="",dur=4600;
  if(n===1){const ch=[...SHOP.name],st=Math.min(45,900/ch.length),te=.95+ch.length*st/1000;
    h='<div class="rays"></div><div class="st"><img class="emb" src="pb-member-'+T+'.webp" alt=""><div class="lo"><i></i><i></i>'+LG()+'</div><div class="nm">'+(()=>{let k=0;return SHOP.name.split(" ").map(w=>'<span class="w">'+[...w].map(c=>'<span style="animation-delay:'+(.95+(k++)*st/1000).toFixed(3)+'s">'+esc(c)+'</span>').join("")+'</span>').join('<span class="sp"> </span>');})()+'</div><i class="ln" style="animation-delay:'+(te+.05)+'s"></i><div class="mt" style="animation-delay:'+(te+.2)+'s">'+esc(SHOP.cat)+'<span>'+stars()+'</span></div></div><small class="tg">'+T.toUpperCase()+' MEMBER · PATABOOK</small>';dur=Math.round((te+2.4)*1000);}
  if(n===2){h='<div class="scn"><div class="cd"><div class="fc bk">'+LG()+'<small>'+T.toUpperCase()+' BUSINESS CARD</small></div><div class="fc fr"><img class="em" src="pb-member-'+T+'.webp" alt="">'+LG()+'<div class="tx"><div class="n">'+esc(SHOP.name)+'</div><div class="c">'+esc(SHOP.cat)+'</div><div class="s">'+stars()+'</div></div><div class="ft"><span>📍 '+esc(SHOP.area)+'</span><b>PataBook</b></div><i class="sh"></i></div></div></div>';}
  if(n===3){h='<div class="shop"><div class="awn"></div><div class="win">'+LG()+'<div class="n">'+esc(SHOP.name)+'</div><div class="c">'+esc(SHOP.cat)+' · '+stars()+'</div><div class="sht"></div></div><span class="open">OPEN</span></div><small class="tg">'+T.toUpperCase()+' MEMBER · PATABOOK</small>';}
  if(n===4){let sp="";for(let k=0;k<26;k++){const a=Math.random()*Math.PI*2,d=80+Math.random()*140;sp+='<i class="sp" style="left:50%;top:44%;--x:'+Math.cos(a)*d+'px;--y:'+Math.sin(a)*d+'px;animation-delay:'+(1.55+Math.random()*.5).toFixed(2)+'s"></i>';}
    h='<div class="spot"></div>'+sp+'<div class="st">'+LG()+'<div class="nm">'+esc(SHOP.name)+'</div><div class="mt">'+esc(SHOP.cat)+' · '+T.toUpperCase()+' MEMBER</div></div>';}
  if(n===5){h='<div class="map"></div><i class="rip"></i><img class="pin" src="pin.png" alt=""><div class="card"><img class="em" src="pb-member-'+T+'.webp" alt="">'+LG()+'<div><b>'+esc(SHOP.name)+'</b><small>'+esc(SHOP.cat)+' · <span class="s">'+stars()+'</span></small><small>📍 '+esc(SHOP.area)+'</small></div></div><small class="tg">PATABOOK · '+T.toUpperCase()+' MEMBER</small>';}
  ov.innerHTML=h+'<button type="button" class="skip">✕</button>';document.body.appendChild(ov);
  let gone=false;const end=()=>{if(gone)return;gone=true;ov.classList.add("out");setTimeout(()=>ov.remove(),650);};
  const tm=setTimeout(end,dur);ov.onclick=()=>{clearTimeout(tm);end();};
}
document.querySelector(".list").onclick=e=>{const b=e.target.closest("[data-l]");if(b)play(+b.dataset.l);};
})();
</script>
