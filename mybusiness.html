function packImg(file,W,H,limit,steps,fit){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);let best=null;const sc=steps||[1,.8,.64];let si=0,q=0.8;
    const go=()=>{const w=Math.round(W*sc[si]),h=Math.round(H*sc[si]),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);
      const ra=img.width/img.height,rt=W/H;
      if(fit&&Math.abs(ra/rt-1)>0.08){/* नाप अलग: फ़ोटो पूरी रखो (कटे नहीं), किनारों में उसी का धुँधला रूप भरो */
        const kb=Math.max(w/img.width,h/img.height),bw=img.width*kb,bh=img.height*kb,t=document.createElement("canvas");t.width=Math.max(8,Math.round(w/28));t.height=Math.max(8,Math.round(h/28));
        const tx=t.getContext("2d");tx.drawImage(img,(t.width-bw/28)/2,(t.height-bh/28)/2,bw/28,bh/28);x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(t,0,0,w,h);
        x.fillStyle="rgba(255,255,255,.12)";x.fillRect(0,0,w,h);
        const k=Math.min(w/img.width,h/img.height),dw=img.width*k,dh=img.height*k;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
      }else{const k=Math.max(w/img.width,h/img.height),dw=img.width*k,dh=img.height*k;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);}
      c.toBlob(bl=>{if(!bl)return best?res(best):rej(new Error("img"));if(!best||bl.size<best.size)best=bl;
        if(bl.size<=limit||bl.type!=="image/webp"&&q<=0.5)return res(bl.size<=limit?bl:best);
        if(q>0.35){q=Math.round((q-0.1)*100)/100;return go();}
        if(si<sc.length-1){si++;q=0.7;return go();}
        res(best);},"image/webp",q);};
    go();};

const SD_TYPES=[["Retailer","रिटेलर (दुकान)"],["Wholesaler","थोक व्यापारी"],["Manufacturer","निर्माता"],["Distributor","डिस्ट्रीब्यूटर"],["Showroom","शोरूम"],["Service Provider","सेवा प्रदाता"],["Repair & Service Centre","मरम्मत और सेवा केंद्र"],["Trader / Commission Agent","व्यापारी / कमीशन एजेंट"]];
const SD_DAYS=[["Sunday","रविवार"],["Monday","सोमवार"],["Tuesday","मंगलवार"],["Wednesday","बुधवार"],["Thursday","गुरुवार"],["Friday","शुक्रवार"],["Saturday","शनिवार"]];
function sdGet(b,k){const d=((PROF&&PROF[b.slug])||{}).d||"";return ((d.match(new RegExp("^"+k+":[ \\t]*(.*)$","mi"))||[])[1]||"").trim();}
function sdTm(t,en){const m=/^(\d{1,2}):(\d{2})$/.exec(t);if(!m)return t;const h=+m[1],mm=m[2];
  if(en)return (h%12||12)+":"+mm+" "+(h<12?"AM":"PM");return (h<12?"सुबह ":h<16?"दोपहर ":h<19?"शाम ":"रात ")+(h%12||12)+":"+mm;}
function sdErr(m,en){m=String(m||"");const H=[
  [/rate limit/i,"Too many changes. Please try again after some time.","बहुत बार बदलाव हुए। थोड़ी देर बाद फिर कोशिश करें।"],
  [/name locked|not found/i,"The name can't be changed after approval. Contact PataBook.","मंज़ूरी के बाद नाम नहीं बदल सकते। PataBook से संपर्क करें।"],
  [/bad Website/i,"Write a correct website link.","वेबसाइट का सही लिंक लिखें।"],[/bad Email/i,"Write a correct email.","सही ईमेल लिखें।"],
  [/bad PIN/i,"PIN code must be 6 digits.","पिन कोड 6 अंकों का होना चाहिए।"],[/bad Hours/i,"Choose both opening and closing time.","खुलने और बंद होने, दोनों का समय चुनें।"],
  [/bad GST/i,"This GST number is not correct.","यह GST नंबर सही नहीं है।"],[/bad Udyam/i,"Udyam number looks like UDYAM-GJ-01-1234567.","उद्यम नंबर ऐसा होता है: UDYAM-GJ-01-1234567"],
  [/bad Instagram/i,"Write a correct Instagram link or username (like instagram.com/yourshop).","Instagram का सही लिंक या यूज़रनेम लिखें (जैसे instagram.com/yourshop)।"],
  [/bad Facebook/i,"Write a correct Facebook page link (like facebook.com/yourshop).","Facebook पेज का सही लिंक लिखें (जैसे facebook.com/yourshop)।"],
  [/gst in use|udyam in use/i,"This number is already on another shop.","यह नंबर पहले से किसी दूसरी दुकान पर है।"],
  [/short|long|bad/i,"Please check what you wrote.","जो लिखा है उसे एक बार देख लें।"]];
  const f=H.find(x=>x[0].test(m));return f?(en?f[1]:f[2]):(en?"Could not save. Check internet and try again.":"सेव नहीं हुआ। इंटरनेट देखकर फिर कोशिश करें।");}
function numPanel(b,i,en){const sl=encodeURIComponent(b.slug);return phoneBlock(b,i)+numsBlock(b,i)+
    (PREQ[b.slug]?'<div class="err" style="background:#e8f0fe;color:#0b2f73;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px">⏳ '+esc(en?"New number +91 "+PREQ[b.slug].phone+" is waiting for Admin approval. Until then the old number shows.":"नया नंबर +91 "+PREQ[b.slug].phone+" एडमिन की मंज़ूरी के इंतज़ार में है। तब तक पुराना नंबर ही दिखेगा।")+'</div>':'')+
    (PBA.mobile&&PBA.mobile.enabled()?(phoneLocked(b)?'<div class="nlock">🔒 '+(en?"This number is used by "+ROWS.filter(r=>d10(r.phone)===d10(b.phone)).length+" shops, so it cannot be changed now. To change it, first delete the other shops (Settings → Account).":"इस नंबर पर "+ROWS.filter(r=>d10(r.phone)===d10(b.phone)).length+" दुकानें हैं, इसलिए नंबर अभी नहीं बदल सकते। नंबर बदलने के लिए पहले बाक़ी दुकानें हटाएँ (सेटिंग → खाता)।")+'</div>':'<a class="stl" href="phone-update.html?slug='+sl+'">📱 '+(en?(b.phone_update_pending?"Verify number":"Change number"):(b.phone_update_pending?"नंबर जाँच करें":"नंबर बदलें"))+'</a>'):'');}
/* 📞 दुकान की जानकारी में मोबाइल नंबर — छोटा: हर नंबर एक लाइन, उसके सामने दिखे / छुपे का स्विच */
function numMini(b,i,en){
  const sl=encodeURIComponent(b.slug),M=(NUMS_OK&&NUMS[b.slug])||{},d10x=x=>String(x||"").replace(/\D/g,"").slice(-10);
  const st=on=>'<em class="'+(on?"y":"n")+'">'+(on?(en?"Visible":"दिख रहा"):(en?"Hidden":"छुपा"))+'</em>';
  const main=b.show_phone!==false;
  let h='<div class="nm"><div class="nmr"><div class="nmt"><small>'+(en?"Main number":"मुख्य नंबर")+'</small><b>+91 '+esc(d10x(b.phone))+'</b>'+st(main)+'</div>'+
    '<button type="button" class="sw" role="switch" aria-checked="'+main+'" aria-label="'+(en?"Show main number to customers":"मुख्य नंबर ग्राहकों को दिखाएँ")+'" data-i="'+i+'"></button></div><div class="err" id="er'+i+'"></div>';
  if(NUMS_OK)[2,3].forEach(k=>{const x=M[k],on=!!(x&&x.show),lb=(en?"Extra number ":"अतिरिक्त नंबर ")+(k-1);
    h+=x?'<div class="nmr"><div class="nmt"><small>'+lb+'</small><b>+91 '+esc(d10x(x.phone))+'</b>'+st(on)+'</div>'+
        '<button type="button" class="nmx" data-nrm="'+k+'" data-ni="'+i+'" aria-label="'+(en?"Remove":"हटाएँ")+'" title="'+(en?"Remove":"हटाएँ")+'">🗑️</button>'+
        '<button type="button" class="sw" role="switch" aria-checked="'+on+'" aria-label="'+(en?"Show this number to customers":"यह नंबर ग्राहकों को दिखाएँ")+'" data-nslot="'+k+'" data-ni="'+i+'"></button></div>'
      :'<div class="nmr add"><input id="nin'+i+'_'+k+'" type="tel" inputmode="numeric" maxlength="14" placeholder="'+lb+' (98XXXXXXXX)" aria-label="'+lb+'"><button type="button" data-nsave="'+k+'" data-ni="'+i+'">'+(en?"Add":"जोड़ें")+'</button></div>';});
  h+='<div class="err" id="nerr'+i+'"></div><p class="nmh">'+(en?"Switch ON = customers can see that number (Call + WhatsApp). Extra numbers need no OTP.":"स्विच चालू = ग्राहकों को वह नंबर दिखेगा (कॉल + WhatsApp)। अतिरिक्त नंबर में OTP नहीं लगता।")+'</p>';
  if(PREQ[b.slug])h+='<p class="nmh" style="color:#0b2f73;font-weight:700">⏳ '+esc(en?"New number +91 "+PREQ[b.slug].phone+" is waiting for approval. Until then the old number shows.":"नया नंबर +91 "+PREQ[b.slug].phone+" मंज़ूरी के इंतज़ार में है। तब तक पुराना नंबर ही दिखेगा।")+'</p>';
  const chg=PBA.mobile&&PBA.mobile.enabled()?(phoneLocked(b)?'<span class="nmh">🔒 '+(en?"Main number can't be changed while other shops use it.":"दूसरी दुकानें इसी नंबर पर हैं, इसलिए मुख्य नंबर अभी नहीं बदल सकते।")+'</span>':'<a class="nmc" href="phone-update.html?slug='+sl+'">📱 '+(en?(b.phone_update_pending?"Verify number":"Change main number"):(b.phone_update_pending?"नंबर जाँच करें":"मुख्य नंबर बदलें"))+'</a>'):'';
  return h+'<div class="nmf">'+chg+'<button type="button" data-sdc="1">'+(en?"Close":"बंद करें")+'</button></div></div>';
}
function shopDetails(b,i,en){
  const p=(PROF&&PROF[b.slug])||{},d=p.d||"",g=k=>sdGet(b,k),NO=en?"Not added":"नहीं भरा";
  const hr=g("Hours"),hp=hr.split("-"),cl=g("Closed"),dayN=x=>{const f=SD_DAYS.find(y=>y[0]===x);return f?(en?f[0]:f[1]):x;};
  let hours=hp.length===2?sdTm(hp[0].trim(),en)+" – "+sdTm(hp[1].trim(),en):hr;
  if(hours)hours+="\n"+(cl?(en?"Closed: ":"बंद: ")+dayN(cl):(en?"Open all 7 days":"सातों दिन खुला"));
  const ty=g("Type"),tyN=(SD_TYPES.find(x=>x[0]===ty)||[ty,ty])[en?0:1];
  const gv=/^GST-Verified:\s*yes/mi.test(d),uv=/^Udyam-Verified:\s*yes/mi.test(d),hasLoc=p.lat!=null&&p.lng!=null;
  const E=en?"✏️ Edit":"✏️ बदलें",AD=en?"➕ Add":"➕ जोड़ें",LK='<i class="sdl" title="'+(en?"Locked":"बंद")+'">🔒</i>';
  const ed=(k,has)=>'<button type="button" data-sde="'+k+'">'+(has?E:AD)+'</button>';
  const opt=(v,cur,lab)=>'<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(lab)+'</option>';
  const tOpt=cur=>{let o=opt("",cur,en?"— Choose —":"— चुनें —");for(let h=0;h<48;h++){const v=String(Math.floor(h/2)).padStart(2,"0")+":"+(h%2?"30":"00");o+=opt(v,cur,sdTm(v,en));}return o;};
  function editor(k){
    let f="";const v=k==="name"?b.name:k==="addr"?String(b.address||"").split("\n")[0]:"";
    if(k==="name")f='<input id="sdIn" type="text" maxlength="80" value="'+esc(v)+'">';
    else if(k==="addr")f='<textarea id="sdIn" rows="3" maxlength="250">'+esc(v)+'</textarea>';
    else if(k==="pin")f='<input id="sdIn" type="text" inputmode="numeric" maxlength="6" value="'+esc(g("PIN"))+'" placeholder="'+(en?"6 digits, e.g. 370201":"6 अंक, जैसे 370201")+'">';
    else if(k==="lmk")f='<input id="sdIn" type="text" maxlength="80" value="'+esc(g("Landmark"))+'" placeholder="'+(en?"e.g. Near Apnanagar Circle":"जैसे: अपनानगर सर्कल के पास")+'">';
    else if(k==="type")f='<select id="sdIn">'+opt("",ty,en?"— Choose —":"— चुनें —")+SD_TYPES.map(x=>opt(x[0],ty,en?x[0]:x[1])).join("")+'</select>';
    else if(k==="hours")f='<div class="sd2"><label><small>'+(en?"Opens at":"खुलने का समय")+'</small><select id="sdIn">'+tOpt((hp[0]||"").trim())+'</select></label><label><small>'+(en?"Closes at":"बंद होने का समय")+'</small><select id="sdIn2">'+tOpt((hp[1]||"").trim())+'</select></label></div>'+
      '<label><small>'+(en?"Weekly off":"हफ़्ते की छुट्टी")+'</small><select id="sdIn3">'+opt("",cl,en?"No weekly off (open all 7 days)":"कोई छुट्टी नहीं (सातों दिन खुला)")+SD_DAYS.map(x=>opt(x[0],cl,en?x[0]:x[1])).join("")+'</select></label>';
    else if(k==="svc")f='<textarea id="sdIn" rows="3" maxlength="500" placeholder="'+(en?"e.g. Hair cut, shaving, facial":"जैसे: हेयर कट, शेविंग, फेशियल")+'">'+esc(g("Services"))+'</textarea>';
    else if(k==="web")f='<input id="sdIn" type="url" inputmode="url" maxlength="200" value="'+esc(g("Website"))+'" placeholder="https://…">';
    else if(k==="email")f='<input id="sdIn" type="email" inputmode="email" maxlength="100" value="'+esc(g("Email"))+'" placeholder="name@gmail.com">';
    else if(k==="ig")f='<input id="sdIn" type="text" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="200" value="'+esc(g("Instagram"))+'" placeholder="instagram.com/yourshop">';
    else if(k==="fb")f='<input id="sdIn" type="text" inputmode="url" autocapitalize="off" spellcheck="false" maxlength="200" value="'+esc(g("Facebook"))+'" placeholder="facebook.com/yourshop">';
    else if(k==="gst")f='<input id="sdIn" type="text" maxlength="15" style="text-transform:uppercase" value="'+esc(g("GST"))+'" placeholder="24ABCDE1234F1Z5">';
    else if(k==="udyam")f='<input id="sdIn" type="text" maxlength="19" style="text-transform:uppercase" value="'+esc(g("Udyam"))+'" placeholder="UDYAM-GJ-01-1234567">';
    return '<div class="sde">'+f+'<div class="sdb"><button type="button" class="ok" data-sds="'+k+'"'+(SDBUSY?' disabled':'')+'>'+(SDBUSY?(en?"Saving…":"सेव हो रहा है…"):(en?"✔ Save":"✔ सेव करें"))+'</button><button type="button" data-sdc="1">'+(en?"Cancel":"रद्द करें")+'</button></div>'+
      (SDMSG&&SDMSG.k===k&&!SDMSG.ok?'<p class="sder">'+esc(SDMSG.t)+'</p>':'')+'</div>';
  }
  const row=(k,ic,lb,val,act)=>{const on=SDE&&SDE.slug===b.slug&&SDE.k===k;
    return '<div class="sd'+(on?' on':'')+'" id="sd_'+k+'"><i>'+ic+'</i><div><small>'+lb+'</small>'+(on?editor(k):'<span'+(val?'':' class="no"')+'>'+esc(val||NO)+'</span>'+(SDMSG&&SDMSG.k===k&&SDMSG.ok?'<em class="sdok">✅ '+(en?"Saved":"सेव हो गया")+'</em>':''))+'</div>'+(on?'':(act||""))+'</div>';};
  return '<div class="sdh"><b>📋 '+(en?"Your shop details":"आपकी दुकान की जानकारी")+'</b><em>✅ '+(en?"Profile complete":"प्रोफ़ाइल पूरी")+'</em></div>'+
    row("name","🏪",en?"Shop name":"दुकान का नाम",b.name,b.is_active?LK:ed("name",1))+
    (b.is_active&&!(SDE&&SDE.k==="name")?'<p class="sdn">🔒 '+(en?"After approval, only PataBook can change the shop name.":"मंज़ूरी के बाद दुकान का नाम सिर्फ़ PataBook बदल सकता है।")+'</p>':'')+
    row("addr","📍",en?"Address":"पता",String(b.address||"").split("\n")[0],ed("addr",!!b.address))+
    row("pin","📮",en?"PIN code":"पिन कोड",g("PIN"),ed("pin",!!g("PIN")))+
    row("lmk","🏁",en?"Landmark (known place nearby)":"पहचान (पास की जानी-मानी जगह)",g("Landmark"),ed("lmk",!!g("Landmark")))+
    row("loc","🗺️",en?"Location on map":"नक्शे पर लोकेशन",hasLoc?(en?"✅ Set":"✅ लगी हुई है"):"",'<a href="location.html?slug='+encodeURIComponent(b.slug)+'">'+(hasLoc?E:AD)+'</a>')+
    (b.phone?(SDE&&SDE.slug===b.slug&&SDE.k==="ph"?'<div class="sd on" id="sd_ph" style="display:block"><div><small>📞 '+(en?"Mobile number":"मोबाइल नंबर")+'</small><div class="sdnum">'+numMini(b,i,en)+'</div></div></div>':row("ph","📞",en?"Mobile number":"मोबाइल नंबर","+91 "+String(b.phone).replace(/\D/g,"").slice(-10)+(PREQ&&PREQ[b.slug]?"\n⏳ "+(en?"New number +91 "+PREQ[b.slug].phone+" waiting for approval":"नया नंबर +91 "+PREQ[b.slug].phone+" मंज़ूरी के इंतज़ार में"):""),ed("ph",1))):"")+
    row("type","🏷️",en?"Business type":"बिज़नेस का प्रकार",tyN,ed("type",!!ty))+
    row("hours","🕘",en?"Timings":"खुलने-बंद होने का समय",hours,ed("hours",!!hr))+
    row("svc","🛠️",en?"What you sell / services":"क्या बेचते हैं / सेवाएँ",g("Services"),ed("svc",!!g("Services")))+
    row("web","🌐",en?"Website":"वेबसाइट",g("Website"),ed("web",!!g("Website")))+
    row("email","✉️",en?"Email":"ईमेल",g("Email"),ed("email",!!g("Email")))+
    row("ig","📸","Instagram",g("Instagram"),ed("ig",!!g("Instagram")))+
    row("fb","👍","Facebook",g("Facebook"),ed("fb",!!g("Facebook")))+
    ((g("Instagram")&&g("Facebook"))?'':'<p class="sdn">'+(en?"Instagram / Facebook show on your shop page only if you add them.":"Instagram / Facebook सिर्फ़ जोड़ने पर ही आपकी दुकान के पेज पर दिखेंगे।")+'</p>')+
    row("gst","🧾",en?"GST number (optional)":"GST नंबर (वैकल्पिक)",g("GST")+(g("GST")&&gv?(en?"  ✅ Verified":"  ✅ जाँचा हुआ"):""),gv?LK:ed("gst",!!g("GST")))+
    row("udyam","🧾",en?"Udyam (MSME) number (optional)":"उद्यम (MSME) नंबर (वैकल्पिक)",g("Udyam")+(g("Udyam")&&uv?(en?"  ✅ Verified":"  ✅ जाँचा हुआ"):""),uv?LK:ed("udyam",!!g("Udyam")))+
    '<a class="sdpv" href="'+esc(pvUrl(b))+'">👁️ '+(en?"See your shop page":"अपनी दुकान का पेज देखें")+' ›</a>';
}
function sdFocus(){setTimeout(()=>{const x=document.getElementById("sdIn");if(x){x.focus();try{if(x.setSelectionRange&&x.type!=="email"&&x.type!=="url")x.setSelectionRange(x.value.length,x.value.length);}catch(_){}const r=x.closest(".sd");if(r)r.scrollIntoView({block:"center",behavior:"smooth"});}},30);}
async function sdSave(k){
  const b=ROWS[SET.shop],en=L()==="en";if(!b||SDBUSY)return;
  const v1=(document.getElementById("sdIn")||{}).value||"",v2=(document.getElementById("sdIn2")||{}).value||"",v3=(document.getElementById("sdIn3")||{}).value||"";
  const clean=x=>String(x).replace(/\s+/g," ").trim(),fail=t=>{SDMSG={k,ok:false,t};SDBUSY=false;draw();sdFocus();};
  let call=null;
  if(k==="ig"||k==="fb"){const x=clean(v1),ig=k==="ig"?x:sdGet(b,"Instagram"),fb=k==="fb"?x:sdGet(b,"Facebook");call=async()=>{await rpc("pb_owner_set_social",{p_slug:b.slug,p_instagram:ig,p_facebook:fb});await loadProf();};}
  else if(k==="name"){const n=clean(v1);if(n.length<2||n.length>80)return fail(en?"Write the shop name (2–80 letters).":"दुकान का नाम लिखें (2 से 80 अक्षर)।");call=async()=>{await rpc("pb_owner_set_name",{p_slug:b.slug,p_name:n});b.name=n;};}
  else if(k==="addr"){const a=clean(v1);if(a.length<8||a.length>250)return fail(en?"Write the full address (shop no., area, city).":"पूरा पता लिखें (दुकान नंबर, इलाका, शहर)।");call=async()=>{await rpc("pb_owner_set_address",{p_slug:b.slug,p_address:a});b.address=a;};}
  else{
    let P=null;
    if(k==="pin"){const x=v1.replace(/\D/g,"");if(x&&!/^[1-9]\d{5}$/.test(x))return fail(sdErr("bad PIN",en));P={PIN:x};}
    else if(k==="lmk")P={Landmark:clean(v1)};
    else if(k==="type")P={Type:v1};
    else if(k==="hours"){if(!v1||!v2)return fail(sdErr("bad Hours",en));P={Hours:v1+"-"+v2,Closed:v3};}
    else if(k==="svc")P={Services:String(v1).trim()};
    else if(k==="web"){let w=clean(v1);if(w&&!/^https?:\/\//i.test(w))w="https://"+w;P={Website:w};}
    else if(k==="email"){const m=clean(v1);if(m&&!/^[^\s@<>]+@[^\s@<>]+\.[a-z]{2,}$/i.test(m))return fail(sdErr("bad Email",en));P={Email:m};}
    else if(k==="gst")P={GST:v1.replace(/\s/g,"").toUpperCase()};
    else if(k==="udyam")P={Udyam:v1.replace(/\s/g,"").toUpperCase()};
    if(!P)return;call=async()=>{await rpc("pb_owner_set_details",{p_slug:b.slug,p:P});await loadProf();};
  }
  SDBUSY=true;SDMSG=null;draw();
  try{await call();SDBUSY=false;SDE=null;SDMSG={k,ok:true};draw();setTimeout(()=>{if(SDMSG&&SDMSG.k===k&&SDMSG.ok){SDMSG=null;draw();}},2500);}
  catch(x){fail(sdErr(k==="name"&&/not found/i.test(x.message||"")?"name locked":x.message,en));}

function mErr(e){
  const c=(e&&e.code)||"";
  if(c==="invalid_otp")return tx("m_wrong")+(e.attempts_left?" ("+e.attempts_left+")":"");
  if(c==="otp_expired"||c==="otp_expired_or_missing")return tx("m_exp");
  if(c==="too_many_attempts"||c==="rate_limited_ip"||c==="rate_limited_mobile")return tx("m_many");
  if(c==="resend_too_soon")return tx("m_soon")+(e.retry_after?" ("+e.retry_after+"s)":"");
  if(c==="shop_not_found"||c==="owner_missing")return tx("m_noshop");
  if(c==="admin_owned")return tx("m_admin");
  if(c==="captcha_required"||c==="captcha_failed")return tx("m_cap");
  const en=L()==="en";
  if(c==="wrong_pin")return (en?"Wrong password, or password not created yet. First time? Tap “Log in with OTP”.":"पासवर्ड गलत है, या अभी पासवर्ड बना ही नहीं। पहली बार हैं तो \"OTP से लॉगिन\" दबाएँ।")+(e.attempts_left?(en?" ("+e.attempts_left+" tries left)":" ("+e.attempts_left+" कोशिश बाकी)"):"");
  if(c==="pin_locked")return en?"Too many wrong passwords. Log in with OTP now (password works again after 30 minutes).":"बहुत बार गलत पासवर्ड। अभी OTP से लॉगिन करें (पासवर्ड 30 मिनट बाद फिर चलेगा)।";
  if(c==="bad_pin")return en?"Enter your password (at least 4 letters/numbers).":"अपना पासवर्ड डालें (कम से कम 4 अक्षर/अंक)।";
