function resizeImage(file,maxSide){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);

    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    /* 📉 हर फ़ोटो छोटी करो (WebP, ~150 KB तक) ताकि ज़्यादा फ़ोटो रखी जा सकें और page जल्दी खुले */
    const tryQ=q=>c.toBlob(bl=>{if(bl&&bl.size<150000)return res(bl);if(q>0.4)return tryQ(Math.round((q-0.1)*100)/100);bl?res(bl):rej(new Error("img"));},"image/webp",q);tryQ(0.78);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}

function phoneOf(s){const m=/^m([6-9]\d{9})@phone\.patabook\.in$/.exec((s&&s.email)||"");return m?m[1]:"";}
function mErr(e){
  const c=(e&&e.code)||"";
  if(c==="invalid_otp")return tx("m_wrong")+(e.attempts_left?" ("+e.attempts_left+")":"");
  if(c==="otp_expired"||c==="otp_expired_or_missing")return tx("m_exp");
  if(c==="too_many_attempts"||c==="rate_limited_ip"||c==="rate_limited_mobile")return tx("m_many");
  if(c==="resend_too_soon")return tx("m_soon")+(e.retry_after?" ("+e.retry_after+"s)":"");
  if(c==="shop_not_found"||c==="owner_missing")return tx("m_noshop");
  if(c==="admin_owned")return tx("m_admin");
  if(c==="captcha_required"||c==="captcha_failed")return tx("m_cap");
  const en=L()==="en";
  if(c==="wrong_pin")return (en?"Wrong password, or password not created yet. First time? Tap “Log in with OTP”.":"पासवर्ड गलत है, या अभी पासवर्ड बना ही नहीं। पहली बार हैं तो \"OTP से लॉगिन\" दबाएँ।")+(e.attempts_left?(en?" ("+e.attempts_left+" tries left)":" ("+e.attempts_left+" कोशिश बाकी)"):"");
  if(c==="pin_locked")return en?"Too many wrong passwords. Log in with OTP now (password works again after 30 minutes).":"बहुत बार गलत पासवर्ड। अभी OTP से लॉगिन करें (पासवर्ड 30 मिनट बाद फिर चलेगा)।";
  if(c==="bad_pin")return en?"Enter your password (at least 4 letters/numbers).":"अपना पासवर्ड डालें (कम से कम 4 अक्षर/अंक)।";
  return tx("m_fail");
}

  const en=L()==="en",names=(ROWS||[]).map(r=>r.name).join(", ");
  if(!confirm(en?"Delete your shop(s) ("+names+") and your account?\n\n• Your shop will be removed from PataBook\n• Timings, email, GST, logo, location will be erased\n• You will be logged out\n\nThis cannot be undone.":"आपकी दुकान ("+names+") और खाता हटाएँ?\n\n• दुकान PataBook से हट जाएगी\n• समय, ईमेल, GST, logo, location मिट जाएँगे\n• आप logout हो जाएँगे\n\nयह वापस नहीं होगा।"))return;
  const t=prompt(en?"To confirm, type DELETE":"पक्का करने के लिए अंग्रेज़ी में DELETE लिखें","");
  if(t===null)return;
  if(t.trim().toUpperCase()!=="DELETE"){alert(en?"Not deleted (DELETE was not typed).":"नहीं हटाया (DELETE नहीं लिखा)।");return;}
  b.disabled=true;b.textContent="…";
  try{
    ME=await PBA.session();
    const r=await fetch(otpBase()+"/owner/delete-account",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ME.access_token},body:JSON.stringify({confirm:"DELETE"})});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||"HTTP "+r.status);
    try{localStorage.removeItem("pb-has-pin");localStorage.removeItem("pb-own-bell");localStorage.removeItem("pb-reg");}catch(x){}
    try{localStorage.removeItem("pb-my-shops");localStorage.removeItem("pb-my-shop-st");}catch(e){}await PBA.logout();ME=null;ROWS=null;draw();
    $("kick").textContent=en?"✅ Your shop and account have been deleted. Thank you for using PataBook.":"✅ आपकी दुकान और खाता हटा दिए गए। PataBook इस्तेमाल करने के लिए धन्यवाद।";
    $("kick").style.background="#e6f4ea";$("kick").style.color="#137333";$("kick").style.borderColor="#b7e1c1";$("kick").hidden=false;window.scrollTo(0,0);
  }catch(x){b.disabled=false;b.textContent="🗑️ "+(en?"Delete my shop and account":"मेरी दुकान और खाता हटाएँ");
    alert(x.message==="admin_cannot"?(en?"Admin account cannot be deleted from here.":"Admin खाता यहाँ से नहीं हटता।"):(en?"Could not delete. Try again or contact PataBook.":"नहीं हटा पाए। दोबारा कोशिश करें या PataBook से संपर्क करें।"));}
});
$("who").addEventListener("click",async e=>{
  if(e.target.closest("#pinOpen")){PINOPEN=true;PINMSG="";draw();const i=$("pinNew");if(i)i.focus();return;}
  if(e.target.closest("#pinClose")){PINOPEN=false;draw();return;}
  const b=e.target.closest("#pinSave");if(!b)return;
  const en=L()==="en",v=$("pinNew").value.trim(),msg=t=>{$("pinMsg").textContent=t;};
  if([...v].length<4){msg(en?"At least 4 letters or numbers.":"कम से कम 4 अक्षर या अंक।");return;}
  b.disabled=true;msg("…");
  try{await PBA.mobile.pinSet(v);PINST={has_pin:true};PINOPEN=false;try{localStorage.setItem("pb-has-pin","1");}catch(x){}M.mode="pin";
    PINMSG=en?"✅ Password saved. Next time: mobile number + password.":"✅ पासवर्ड सेव हो गया। अगली बार: मोबाइल नंबर + पासवर्ड।";draw();
    setTimeout(()=>{PINMSG="";draw();},6000);}
  catch(x){b.disabled=false;msg(en?"Could not save. Try again.":"सेव नहीं हुआ। दोबारा कोशिश करें।");}
});
$("dv").addEventListener("click",async e=>{
  const b=e.target.closest("[data-kick]");if(!b)return;
  if(!confirm(L()==="en"?"Log out your shop from that phone/PC?":"उस फ़ोन/PC से दुकान का login बंद करें?"))return;
  b.disabled=true;
  try{await PBA.deviceKick(b.dataset.kick);DEV=await PBA.deviceCheck();draw();}catch(x){b.disabled=false;}
});
const bellH=async e=>{
  const b=e.target.closest("#bellBtn");if(!b)return;
  const en=L()==="en",note=t=>{const n=$("bellNote");if(n){n.textContent=t||"";n.style.color="";}};
  b.disabled=true;note("…");
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){note(en?"Permission was not given. In Chrome tap 🔒 in the address bar → Permissions → Notifications → Allow, then tap again.":"अनुमति नहीं मिली। Chrome में ऊपर 🔒 → Permissions → Notifications → Allow करें, फिर दोबारा दबाएँ।");b.disabled=false;return;}
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const kj=await (await fetch(otpBase()+"/push/key")).json();if(!kj.ok)throw new Error("key");
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(kj.key)});
    ME=await PBA.session();
    const post=async(p,body)=>{const r=await fetch(otpBase()+p,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ME.access_token},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>null);if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||"HTTP "+r.status);return j;};
    await post("/push/owner/subscribe",{sub:sub.toJSON()});await post("/push/owner/test",{});
    try{localStorage.setItem("pb-own-bell","1");}catch(x){}
    BELL="on";draw();note(en?"✅ Turned on! A test notification should arrive now.":"✅ चालू हो गया! अभी एक test घंटी आनी चाहिए।");
  }catch(x){b.disabled=false;note(en?"Could not turn on. Try again in a while.":"चालू नहीं हो पाया। थोड़ी देर बाद दोबारा कोशिश करें।");}
};
$("ntPanel").addEventListener("click",bellH);$("list").addEventListener("click",bellH);
$("out").onclick=async()=>{try{localStorage.removeItem("pb-my-shops");localStorage.removeItem("pb-my-shop-st");}catch(e){}await PBA.logout();ME=null;ROWS=null;draw();};
async function start(){
  ME=await PBA.session();
  if(ME&&PBA.deviceCheck){DEV=await PBA.deviceCheck().catch(()=>null);if(DEV&&DEV.ok===false){ME=null;DEV=null;}}
  if(!ME)kickMsg();else $("kick").hidden=true;
  draw();
  if(!ME)return;
  try{ROWS=await rpc("pb_my_businesses")||[];ERR="";try{localStorage.setItem("pb-my-shops",JSON.stringify(ROWS.map(r=>r&&r.slug).filter(Boolean)));}catch(e){}await loadLogos();await loadCovers();await loadVac();await loadPrem();await loadVer();await loadHome();await loadPreq();await loadEvents();await loadProf();await loadStates();await bellState();
    try{PINST=(PBA.mobile&&PBA.mobile.enabled()&&PBA.mobile.pinStatus)?await PBA.mobile.pinStatus():null;}catch(e){PINST=null;}}   /* admin / पुराना Worker → PIN box नहीं */
  catch(e){
    if(e.status===401||/JWT|expired/i.test(e.message)){await PBA.logout();ME=null;}
    else ERR=(e.status===404||/function|schema cache/i.test(e.message))?"e_setup":"e_net";
  }
  draw();
  /* होम पेज की "Offline: प्रोफ़ाइल पूरी करो" पट्टी से सीधे Settings → प्रोफ़ाइल */
  if(ME&&ROWS&&ROWS.length&&location.hash==="#prof"){try{history.replaceState(history.state,"",location.pathname+location.search);}catch(e){}setGo("prof");}
}
/* मोबाइल का Back बटन: Settings की हर स्क्रीन browser-history का एक कदम है (मुख्य पेज → सूची → वर्ग) */
let SD=0;
function setGo(cat){const d=cat===""?1:2;try{history.pushState({pbd:d,cat:cat},"");}catch(e){}SD=d;SET.cat=cat;draw();window.scrollTo(0,0);
  if(cat==="rep")(async()=>{try{for(const b of ROWS){if(PH(b,"report")&&!REPORT[b.slug]){REPORT[b.slug]=await rpc("pb_my_report",{p_slug:b.slug});if(SET.cat==="rep")draw();}}}catch(x){}})();}
function setBack(){if(SD>0)history.back();else{SET.cat=null;draw();}}
window.addEventListener("popstate",e=>{const st=e.state||{};SD=st.pbd||0;SET.cat=SD===0?null:(SD===1?"":(st.cat||""));ntOpen(false);if(ME&&ROWS)draw();window.scrollTo(0,0);});
$("stBtn").addEventListener("click",()=>{ntOpen(false);if(SET.cat===null)setGo("");else if(SD>0)history.go(-SD);else{SET.cat=null;draw();}});
$("list").addEventListener("click",e=>{
  if(e.target.closest("[data-setopen]")){ntOpen(false);setGo("");return;}
  if(e.target.closest("[data-setprof]")){setGo("prof");return;}
  const sbt=e.target.closest("[data-submit]");if(sbt){submitApproval(+sbt.dataset.submit,sbt);return;}
  const c=e.target.closest("[data-setcat]");if(c){setGo(c.dataset.setcat);return;}
  if(e.target.closest("[data-setback]"))setBack();
});
PB.mount($("pbLang"));
PB.onChange(draw);
start();
</script>
