<style>
:root{--blue:#1a73e8;--navy:#0b2f73;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5;--green:#1e9e57}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#e8f1ff 0%,#fff 42%);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--navy)}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;color:var(--navy)}
.brand img{width:22px}
#pbLang{margin-inline-start:auto}
h1{font-size:22px;color:var(--navy);margin:4px 2px 4px}
.sub{color:var(--muted);font-size:14px;margin:0 2px 14px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#e8f5e9;color:#1b5e20;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:14px}
.who button{margin-inline-start:auto;color:var(--blue);font-weight:600;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(26,115,232,.07)}
.card h2{font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px}
.st.live{background:#e6f4ea;color:#137333}.st.pend{background:#fff4e5;color:#b54708}
.addr{color:var(--muted);font-size:13.5px;margin-top:4px;overflow-wrap:anywhere}

/* नंबर स्विच: ON = रंगीन, OFF = ब्लैक एंड व्हाइट */
.phone{margin-top:14px;display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px;background:linear-gradient(135deg,#e7f8ee,#e8f1ff);border:1px solid #cfe8da;transition:filter .25s,background .25s}
.phone.off{filter:grayscale(1);background:#f2f2f2;border-color:#ddd}
.phone .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#25d366,#1a73e8);color:#fff;flex:none}
.phone .tx{flex:1;min-width:0}
.phone .tx b{display:block;font-size:15px}
.phone .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sw{position:relative;width:58px;height:32px;border-radius:999px;background:linear-gradient(90deg,#25d366,#1a73e8);flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="false"]{background:#9a9a9a}
.sw[aria-checked="false"]::after{left:3px}
.sw:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.sw:disabled{opacity:.6;cursor:wait}
.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row2 a{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700;font-size:14px;color:var(--blue);background:#fff}
.err{color:#b42318;font-size:13px;margin-top:8px;min-height:1px}
.lg{display:flex;align-items:center;gap:12px;margin-top:12px;border:1px dashed #c8d6ee;border-radius:14px;padding:10px}
.lg .pv{flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#eef3fc;font-size:22px;font-weight:800;color:var(--navy)}
.lg .pv img{width:100%;height:100%;object-fit:cover;background:#fff}
.lg .lt{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.4}
.lg .lt b{display:block;color:var(--ink);font-size:14px}
.lg .lb{display:flex;flex-direction:column;gap:6px;flex:none}
.lg .lb button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--blue)}
.lg .lb button.rm{color:#b42318}
.lg .lb button:disabled{opacity:.6}

.gate,.empty{text-align:center;padding:26px 18px}
.gate .big,.empty .big{font-size:42px}
.gate h2,.empty h2{justify-content:center;margin:6px 0 8px;font-size:19px}

.btn{display:block;background:var(--blue);color:#fff;font-weight:800;border-radius:14px;padding:14px;font-size:16px}
.btn.y{background:#ffd21f;color:var(--ink)}

.mf .mrow{display:flex;align-items:center;border:2px solid #d5dbe6;border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.mf .mrow:focus-within,.mf #mOtp:focus{border-color:var(--blue)}

.mf input{width:100%;border:0;outline:0;font-size:19px;font-weight:700;padding:13px 12px;letter-spacing:.5px;background:transparent;color:var(--ink)}
.mf #mOtp{border:2px solid #d5dbe6;border-radius:14px;background:#fff;text-align:center;letter-spacing:8px;font-size:22px;margin-bottom:6px}

.mf .err{color:#b42318;font-weight:700;font-size:14px;min-height:0;margin-bottom:8px;text-align:center}
.mf .err:empty{display:none}
.mf .btn{width:100%;border:0;cursor:pointer}.mf .btn:disabled{opacity:.6}
.lnk{display:block;margin:14px auto 0;background:none;border:0;color:var(--blue);font-weight:700;font-size:14.5px;cursor:pointer;text-align:center}
.note{color:var(--muted);text-align:center;padding:20px}

function squareImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const S=320,c=document.createElement("canvas");c.width=S;c.height=S;
      const x=c.getContext("2d"),m=Math.min(img.width,img.height);
      x.fillStyle="#fff";x.fillRect(0,0,S,S);
      x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url);
      c.toBlob(bl=>{
        if(bl&&bl.type==="image/webp")return res(bl);
        c.toBlob(b2=>b2?res(b2):rej(new Error("img")),"image/jpeg",0.85);
      },"image/webp",0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}

    const path=encodeURIComponent(b.slug)+"/logo-"+Date.now()+"."+ext;
    const up=await fetch(SB+"/storage/v1/object/shop-logos/"+path,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+ME.access_token,"Content-Type":blob.type,"x-upsert":"false"},body:blob});
    if(!up.ok)throw new Error("upload "+up.status);
    const pub=SB+"/storage/v1/object/public/shop-logos/"+path;
    await rpc("pb_set_logo",{p_slug:b.slug,p_url:pub});
    LOGOS[b.slug]=pub;draw();
  }catch(x){er.style.color="";er.textContent=en?"Could not upload the logo. Try again.":"Logo upload नहीं हो सका। दोबारा कोशिश करें।";}
}
function draw(){
  PB.apply();
  ["h1","sub","gH","gB","pbT","pbS"].forEach(k=>{const e=$(k);if(e)e.textContent=tx(k);});
  const mOn=!!(PBA.mobile&&PBA.mobile.enabled&&PBA.mobile.enabled());
  $("mF").hidden=!mOn;$("gP").textContent=tx(mOn?"gP":"gPe");$("gB").className=mOn?"lnk":"btn";
  $("mGo").textContent=tx(M.sent?"m_go":"m_send");$("mBack").textContent=tx("m_back");
  if(M.sent)$("mHint").textContent=tx("m_hint","+91 "+M.phone);$("backT").textContent=tx("back");
  document.title=tx("h1")+" — PataBook";
  $("gate").hidden=!!ME;$("who").hidden=!ME;
  if(!ME){$("list").innerHTML="";return;}
  const ph=phoneOf(ME);
  $("whoT").textContent=ph?tx("who_ph",ph):tx("who",ME.email);$("out").textContent=tx("out");
  const list=$("list");
  if(ERR){list.innerHTML='<p class="note">'+esc(tx(ERR))+'</p>';return;}
  if(!ROWS){list.innerHTML='<p class="note">…</p>';return;}
  if(!ROWS.length){
    list.innerHTML='<div class="card empty"><div class="big">🏪</div><h2>'+esc(tx(phoneOf(ME)?"ph_none_h":"e_none_h"))+'</h2><p>'+esc(tx("e_none_p"))+'</p><a class="btn y" href="list.html">'+esc(tx("add"))+' ›</a></div>';return;
  }
  list.innerHTML=ROWS.map((b,i)=>'<div class="card"><h2>'+esc(b.name)+' <span class="st '+(b.is_active?"live":"pend")+'">'+esc(tx(b.is_active?"live":"pend"))+'</span></h2>'+
    (b.address?'<div class="addr">📍 '+esc(b.address)+'</div>':'')+
    (b.phone_update_pending?'<div class="err" style="background:#fff4e5;color:#7a3b00;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:12px">'+(L()==="en"?"Complete OTP verification to update your mobile number.":"अपना मोबाइल नंबर अपडेट करने के लिए OTP verification पूरा करें।")+'</div>':'')+
    phoneBlock(b,i)+(PREQ[b.slug]?'<div class="err" style="background:#e8f0fe;color:#0b2f73;border-radius:12px;padding:10px 12px;font-weight:700;margin-top:10px">⏳ '+esc(L()==="en"?"New number +91 "+PREQ[b.slug].phone+" is waiting for Admin approval. Until then the old number shows.":"नया नंबर +91 "+PREQ[b.slug].phone+" Admin की मंज़ूरी के इंतज़ार में है। तब तक पुराना नंबर ही दिखेगा।")+'</div>':'')+vacBlock(b,i)+logoBlock(b,i)+
    '<div class="row2"><a href="business.html?slug='+encodeURIComponent(b.slug)+'">'+esc(tx("view"))+' ›</a>'+
    (PBA.mobile&&PBA.mobile.enabled()?'<a href="phone-update.html?slug='+encodeURIComponent(b.slug)+'">📱 '+(L()==="en"?(b.phone_update_pending?"Verify number":"Change number"):(b.phone_update_pending?"नंबर Verify करें":"नंबर बदलें"))+' ›</a>':'')+
    '</div></div>').join("")+
    '<a class="btn y" href="list.html" style="text-align:center;margin-top:6px">'+esc(tx("add"))+' ›</a>';
}
$("list").addEventListener("click",async e=>{
  const vs=e.target.closest(".sw.vac");
  if(vs){
    const i=+vs.dataset.v,b=ROWS[i],want=!VAC[b.slug];vs.disabled=true;$("ve"+i).textContent="";
    try{ME=await PBA.session();const v=await rpc("pb_set_vacancy",{p_slug:b.slug,p_on:want});if(v&&v.open)VAC[b.slug]=v.until;else delete VAC[b.slug];draw();}
    catch(x){vs.disabled=false;$("ve"+i).textContent=tx("e_sw");}
    return;
  }
  const sw=e.target.closest(".sw");if(!sw)return;
  const i=+sw.dataset.i,b=ROWS[i],want=!(b.show_phone!==false);
  sw.disabled=true;$("er"+i).textContent="";
  try{const v=await rpc("pb_set_show_phone",{p_slug:b.slug,p_on:want});b.show_phone=(v===false)?false:want;draw();}
  catch(x){sw.disabled=false;$("er"+i).textContent=tx("e_sw");}
});
$("list").addEventListener("click",async e=>{
  const bt=e.target.closest("[data-lg]");if(!bt)return;
  const i=+bt.dataset.i,b=ROWS[i];
  if(bt.dataset.lg==="up"){const f=$("lf"+i);f.onchange=()=>{if(f.files&&f.files[0])uploadLogo(i,f.files[0]);};f.click();return;}
  if(bt.dataset.lg==="rm"){
    if(!confirm(L()==="en"?"Remove this logo?":"यह Logo हटाएँ?"))return;
    bt.disabled=true;
    try{await rpc("pb_set_logo",{p_slug:b.slug,p_url:null});LOGOS[b.slug]="";draw();}
    catch(x){bt.disabled=false;$("le"+i).textContent=L()==="en"?"Could not remove. Try again.":"हटाया नहीं जा सका।";}
  }
});
/* ---- मोबाइल नंबर + OTP से login ---- */
const M={sent:false,phone:""};
function phoneOf(s){const m=/^m([6-9]\d{9})@phone\.patabook\.in$/.exec((s&&s.email)||"");return m?m[1]:"";}
function mErr(e){
  const c=(e&&e.code)||"";
  if(c==="invalid_otp")return tx("m_wrong")+(e.attempts_left?" ("+e.attempts_left+")":"");
  if(c==="otp_expired"||c==="otp_expired_or_missing")return tx("m_exp");
  if(c==="too_many_attempts"||c==="rate_limited_ip"||c==="rate_limited_mobile")return tx("m_many");
  if(c==="resend_too_soon")return tx("m_soon")+(e.retry_after?" ("+e.retry_after+"s)":"");
  if(c==="shop_not_found"||c==="owner_missing")return tx("m_noshop");
  if(c==="admin_owned")return tx("m_admin");
  if(c==="captcha_required"||c==="captcha_failed")return tx("m_cap");
  return tx("m_fail");
}
function mShow(){$("mOtpW").hidden=!M.sent;$("mBack").hidden=!M.sent;$("mPh").readOnly=M.sent;draw();}
$("mBack").onclick=()=>{M.sent=false;$("mOtp").value="";$("mErr").textContent="";mShow();$("mPh").focus();};
$("mPh").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").replace(/^(91|0)(?=[6-9]\d{9}$)/,"").slice(0,10);});
$("mOtp").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);if(e.target.value.length===6)$("mF").requestSubmit();});
$("mF").addEventListener("submit",async e=>{
  e.preventDefault();const go=$("mGo");if(go.disabled)return;$("mErr").textContent="";
  if(!M.sent){
    const ph=$("mPh").value.replace(/\D/g,"");
    if(!/^[6-9]\d{9}$/.test(ph)){$("mErr").textContent=tx("m_bad_ph");return;}
    go.disabled=true;
    try{await PBA.mobile.ownerSend(ph);M.sent=true;M.phone=ph;mShow();$("mOtp").focus();}
    catch(x){$("mErr").textContent=mErr(x);}
    go.disabled=false;return;
  }
  const code=$("mOtp").value.replace(/\D/g,"");
  if(!/^\d{6}$/.test(code)){$("mErr").textContent=tx("m_bad_otp");return;}
  go.disabled=true;
  try{await PBA.mobile.ownerVerify(M.phone,code);M.sent=false;$("mOtp").value="";$("mOtpW").hidden=true;$("mBack").hidden=true;$("mPh").readOnly=false;go.disabled=false;await start();}
  catch(x){go.disabled=false;$("mErr").textContent=mErr(x);}
});
$("out").onclick=async()=>{await PBA.logout();ME=null;ROWS=null;draw();};
async function start(){
  ME=await PBA.session();draw();
  if(!ME)return;
  try{ROWS=await rpc("pb_my_businesses")||[];ERR="";await loadLogos();await loadVac();await loadPreq();}
  catch(e){
    if(e.status===401||/JWT|expired/i.test(e.message)){await PBA.logout();ME=null;}
    else ERR=(e.status===404||/function|schema cache/i.test(e.message))?"e_setup":"e_net";
  }
  draw();
}
PB.mount($("pbLang"));
PB.onChange(draw);
start();
</script>
