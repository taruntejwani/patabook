function squareImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const S=320,c=document.createElement("canvas");c.width=S;c.height=S;
      const x=c.getContext("2d"),m=Math.min(img.width,img.height);
      x.fillStyle="#fff";x.fillRect(0,0,S,S);
      x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      URL.revokeObjectURL(url);
      c.toBlob(bl=>{
        if(bl&&bl.type==="image/webp")return res(bl);
        c.toBlob(b2=>b2?res(b2):rej(new Error("img")),"image/jpeg",0.85);
      },"image/webp",0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}

    '<a class="addsm" href="list.html">➕ '+(L()==="en"?"Have another shop? Add it with a different mobile number ›":"दूसरी दुकान भी है? दूसरे मोबाइल नंबर से जोड़ें ›")+'</a>';
}
$("list").addEventListener("click",async e=>{
  const vs=e.target.closest(".sw.vac");
  if(vs){
    const i=+vs.dataset.v,b=ROWS[i],want=!VAC[b.slug];vs.disabled=true;$("ve"+i).textContent="";
    try{ME=await PBA.session();const v=await rpc("pb_set_vacancy",{p_slug:b.slug,p_on:want});if(v&&v.open)VAC[b.slug]=v.until;else delete VAC[b.slug];draw();}
    catch(x){vs.disabled=false;$("ve"+i).textContent=tx("e_sw");}
    return;
  }
  const sw=e.target.closest(".sw");if(!sw)return;
  const i=+sw.dataset.i,b=ROWS[i],want=!(b.show_phone!==false);
  sw.disabled=true;$("er"+i).textContent="";
  try{const v=await rpc("pb_set_show_phone",{p_slug:b.slug,p_on:want});b.show_phone=(v===false)?false:want;draw();}
  catch(x){sw.disabled=false;$("er"+i).textContent=tx("e_sw");}
});
$("list").addEventListener("click",async e=>{
  const bt=e.target.closest("[data-lg]");if(!bt)return;
  const i=+bt.dataset.i,b=ROWS[i];
  if(bt.dataset.lg==="up"){const f=$("lf"+i);f.onchange=()=>{if(f.files&&f.files[0])uploadLogo(i,f.files[0]);};f.click();return;}
  if(bt.dataset.lg==="rm"){
    if(!confirm(L()==="en"?"Remove this logo?":"यह Logo हटाएँ?"))return;
    bt.disabled=true;
    try{await rpc("pb_set_logo",{p_slug:b.slug,p_url:null});LOGOS[b.slug]="";draw();}
    catch(x){bt.disabled=false;$("le"+i).textContent=L()==="en"?"Could not remove. Try again.":"हटाया नहीं जा सका।";}
  }
});
/* ---- मोबाइल नंबर + OTP से login ---- */
let PINMODE=false;try{PINMODE=localStorage.getItem("pb-has-pin")==="1";}catch(e){}
const M={sent:false,phone:"",mode:PINMODE?"pin":"otp"};
let PINST=null;   /* {has_pin} — login के बाद */
function phoneOf(s){const m=/^m([6-9]\d{9})@phone\.patabook\.in$/.exec((s&&s.email)||"");return m?m[1]:"";}
function mErr(e){
  const c=(e&&e.code)||"";
  if(c==="invalid_otp")return tx("m_wrong")+(e.attempts_left?" ("+e.attempts_left+")":"");
  if(c==="otp_expired"||c==="otp_expired_or_missing")return tx("m_exp");
  if(c==="too_many_attempts"||c==="rate_limited_ip"||c==="rate_limited_mobile")return tx("m_many");
  if(c==="resend_too_soon")return tx("m_soon")+(e.retry_after?" ("+e.retry_after+"s)":"");
  if(c==="shop_not_found"||c==="owner_missing")return tx("m_noshop");
  if(c==="admin_owned")return tx("m_admin");
  if(c==="captcha_required"||c==="captcha_failed")return tx("m_cap");
  const en=L()==="en";
  if(c==="wrong_pin")return (en?"Wrong password, or password not created yet. First time? Tap “Log in with OTP”.":"पासवर्ड गलत है, या अभी पासवर्ड बना ही नहीं। पहली बार हैं तो \"OTP से लॉगिन\" दबाएँ।")+(e.attempts_left?(en?" ("+e.attempts_left+" tries left)":" ("+e.attempts_left+" कोशिश बाकी)"):"");
  if(c==="pin_locked")return en?"Too many wrong passwords. Log in with OTP now (password works again after 30 minutes).":"बहुत बार गलत पासवर्ड। अभी OTP से लॉगिन करें (पासवर्ड 30 मिनट बाद फिर चलेगा)।";
  if(c==="bad_pin")return en?"Enter your password (at least 4 letters/numbers).":"अपना पासवर्ड डालें (कम से कम 4 अक्षर/अंक)।";
  return tx("m_fail");
}
function mShow(){draw();}
function mVis(){   /* पासवर्ड वाला / OTP वाला हिस्सा — हर draw में */
  const pin=M.mode==="pin";
  $("mPinW").hidden=!pin;$("mOtpW").hidden=pin||!M.sent;$("mBack").hidden=pin||!M.sent;$("mPh").readOnly=!pin&&M.sent;
  const cap=$("pbCaptcha");if(cap)cap.style.display=pin?"none":"flex";
}
$("mMode").onclick=()=>{M.mode=M.mode==="pin"?"otp":"pin";M.sent=false;$("mOtp").value="";$("mPin").value="";$("mErr").textContent="";mShow();(M.mode==="pin"&&$("mPh").value.length===10?$("mPin"):$("mPh")).focus();};
/* पासवर्ड पर कोई नियम नहीं — अंक, शब्द, कुछ भी */
$("mBack").onclick=()=>{M.sent=false;$("mOtp").value="";$("mErr").textContent="";mShow();$("mPh").focus();};
$("mPh").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").replace(/^(91|0)(?=[6-9]\d{9}$)/,"").slice(0,10);});
$("mOtp").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,6);if(e.target.value.length===6)$("mF").requestSubmit();});
$("mF").addEventListener("submit",async e=>{
  e.preventDefault();const go=$("mGo");if(go.disabled)return;$("mErr").textContent="";
  if(M.mode==="pin"){
    const ph=$("mPh").value.replace(/\D/g,""),pin=$("mPin").value.trim();
    if(!/^[6-9]\d{9}$/.test(ph)){$("mErr").textContent=tx("m_bad_ph");return;}
    if([...pin].length<4){$("mErr").textContent=mErr({code:"bad_pin"});$("mPin").focus();return;}
    go.disabled=true;
    try{await PBA.mobile.pinLogin(ph,pin);try{localStorage.setItem("pb-has-pin","1");}catch(_){}$("mPin").value="";go.disabled=false;await start();}
    catch(x){go.disabled=false;$("mPin").value="";$("mErr").textContent=mErr(x);if(x.code==="pin_locked"){M.mode="otp";mShow();}}
    return;
  }
  if(!M.sent){
    const ph=$("mPh").value.replace(/\D/g,"");
    if(!/^[6-9]\d{9}$/.test(ph)){$("mErr").textContent=tx("m_bad_ph");return;}
    go.disabled=true;
    try{await PBA.mobile.ownerSend(ph);M.sent=true;M.phone=ph;mShow();$("mOtp").focus();}
    catch(x){$("mErr").textContent=mErr(x);}
    go.disabled=false;return;
  }
  const code=$("mOtp").value.replace(/\D/g,"");
  if(!/^\d{6}$/.test(code)){$("mErr").textContent=tx("m_bad_otp");return;}
  go.disabled=true;
  try{await PBA.mobile.ownerVerify(M.phone,code);M.sent=false;$("mOtp").value="";$("mOtpW").hidden=true;$("mBack").hidden=true;$("mPh").readOnly=false;go.disabled=false;await start();}
  catch(x){go.disabled=false;$("mErr").textContent=mErr(x);}
});
$("list").addEventListener("click",e=>{   /* "Logo भरें" → उसी card का logo वाला हिस्सा */
  const a=e.target.closest("[data-scroll]");if(!a)return;e.preventDefault();
  const t=document.getElementById(a.dataset.scroll);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.style.outline="3px solid #1a73e8";setTimeout(()=>t.style.outline="",1800);}
});

$("who").addEventListener("click",async e=>{
  const b=e.target.closest("#pinSave");if(!b)return;
  const en=L()==="en",v=$("pinNew").value.trim(),msg=t=>{$("pinMsg").textContent=t;};
  if(!/^\d{5}$/.test(v)){msg(en?"Password must be exactly 5 digits.":"पासवर्ड ठीक 5 अंक का होना चाहिए।");return;}
  if(v!==$("pinNew2").value.trim()){msg(en?"Both passwords are not the same.":"दोनों पासवर्ड एक जैसे नहीं हैं।");return;}
  b.disabled=true;msg("…");
  try{await PBA.mobile.pinSet(v);PINST={has_pin:true};try{localStorage.setItem("pb-has-pin","1");}catch(x){}M.mode="pin";draw();
    $("pinMsg").textContent=en?"✅ Password saved. Next time: mobile number + password.":"✅ पासवर्ड सेव हो गया। अगली बार: मोबाइल नंबर + पासवर्ड।";}
  catch(x){b.disabled=false;msg(en?"Could not save. Try again.":"सेव नहीं हुआ। दोबारा कोशिश करें।");}
});
$("dv").addEventListener("click",async e=>{
  const b=e.target.closest("[data-kick]");if(!b)return;
  if(!confirm(L()==="en"?"Log out your shop from that phone/PC?":"उस फ़ोन/PC से दुकान का login बंद करें?"))return;
  b.disabled=true;
  try{await PBA.deviceKick(b.dataset.kick);DEV=await PBA.deviceCheck();draw();}catch(x){b.disabled=false;}
});
$("list").addEventListener("click",async e=>{
  const b=e.target.closest("#bellBtn");if(!b)return;
  const en=L()==="en",note=t=>{const n=$("bellNote");if(n){n.textContent=t||"";n.style.color="";}};
  b.disabled=true;note("…");
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){note(en?"Permission was not given. In Chrome tap 🔒 in the address bar → Permissions → Notifications → Allow, then tap again.":"अनुमति नहीं मिली। Chrome में ऊपर 🔒 → Permissions → Notifications → Allow करें, फिर दोबारा दबाएँ।");b.disabled=false;return;}
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const kj=await (await fetch(otpBase()+"/push/key")).json();if(!kj.ok)throw new Error("key");
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(kj.key)});
    ME=await PBA.session();
    const post=async(p,body)=>{const r=await fetch(otpBase()+p,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+ME.access_token},body:JSON.stringify(body||{})});const j=await r.json().catch(()=>null);if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||"HTTP "+r.status);return j;};
    await post("/push/owner/subscribe",{sub:sub.toJSON()});await post("/push/owner/test",{});
    try{localStorage.setItem("pb-own-bell","1");}catch(x){}
    BELL="on";draw();note(en?"✅ Turned on! A test notification should arrive now.":"✅ चालू हो गया! अभी एक test घंटी आनी चाहिए।");
  }catch(x){b.disabled=false;note(en?"Could not turn on. Try again in a while.":"चालू नहीं हो पाया। थोड़ी देर बाद दोबारा कोशिश करें।");}
});
$("out").onclick=async()=>{await PBA.logout();ME=null;ROWS=null;draw();};
async function start(){
  ME=await PBA.session();
  if(ME&&PBA.deviceCheck){DEV=await PBA.deviceCheck().catch(()=>null);if(DEV&&DEV.ok===false){ME=null;DEV=null;}}
  if(!ME)kickMsg();else $("kick").hidden=true;
  draw();
  if(!ME)return;
  try{ROWS=await rpc("pb_my_businesses")||[];ERR="";await loadLogos();await loadVac();await loadPreq();await loadEvents();await loadProf();await bellState();
    try{PINST=(PBA.mobile&&PBA.mobile.enabled()&&PBA.mobile.pinStatus)?await PBA.mobile.pinStatus():null;}catch(e){PINST=null;}}   /* admin / पुराना Worker → PIN box नहीं */
  catch(e){
    if(e.status===401||/JWT|expired/i.test(e.message)){await PBA.logout();ME=null;}
    else ERR=(e.status===404||/function|schema cache/i.test(e.message))?"e_setup":"e_net";
  }
  draw();
}
PB.mount($("pbLang"));
PB.onChange(draw);
start();
</script>
