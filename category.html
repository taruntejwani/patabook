<style>
:root{--blue:#1a73e8;--navy:#0b2f73;--yellow:#ffd21f;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5;--green:#188038}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f5f8fe;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;height:60px}
.back{font-size:22px;line-height:1;padding:6px 8px 6px 0;color:var(--navy)}
.brand{display:flex;align-items:center;gap:8px;line-height:1}
.brand img{width:28px;height:auto;display:block}
.brand .col{display:flex;flex-direction:column}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.5px}
.brand b span{color:var(--blue)}
.brand small{font-size:6.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.sp{flex:1}
.mapic{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff}.mapic svg{width:21px;height:21px;display:block}

.add{background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}

.head{padding:20px 0 6px}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--blue)}
h1{font-size:30px;font-weight:800;letter-spacing:-.4px;margin-top:4px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.sub b{color:var(--navy)}

.bar{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;align-items:center}
.row::-webkit-scrollbar{display:none}
.row .lbl{font-size:12px;color:var(--muted);flex:none}
.chip{flex:none;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.status{margin:10px 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status .loc{background:#e8f1ff;color:var(--navy);border-radius:999px;padding:5px 12px;font-weight:600}
.status select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px}
.status button{color:var(--blue);font-weight:600}

.count{font-size:14px;font-weight:700;margin:14px 0 8px;color:var(--navy)}

.list{display:flex;flex-direction:column;gap:12px;padding-bottom:30px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(11,47,115,.07);transition:box-shadow .15s,transform .15s}
.card:active{transform:scale(.995)}
.card .top{display:flex;gap:12px;align-items:flex-start}
.logo{flex:none;width:58px;height:58px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.info{flex:1;min-width:0}
.info h2{font-size:16.5px;font-weight:800;line-height:1.3;color:#12141c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info h2 a:hover{color:var(--blue)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:#eef3fc;color:#2c4a7c}
.tag.ver{background:#e3f7ea;color:var(--green)}
.tag.rt{background:#fff6dc;color:#8a6200}
.tag.hire{background:#fff1e6;color:#b54708;font-weight:800}
.dist{flex:none;align-self:flex-start;text-align:center;font-weight:800;color:var(--blue);font-size:13.5px;line-height:1.1;background:#eef5ff;border-radius:12px;padding:6px 8px}
.dist small{display:block;font-weight:600;color:var(--muted);font-size:10px;margin-top:2px}
.addr{display:flex;gap:6px;margin:10px 0 0;font-size:13.5px;color:#3c4043;line-height:1.45}
.addr span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,.8fr);gap:6px;margin:12px 0 0}
.acts a{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:700;border-radius:12px;padding:10px 4px;border:1px solid var(--line);background:#fff;color:var(--navy);white-space:nowrap}
.acts a.call{background:var(--blue);border-color:var(--blue);color:#fff}
.acts a.wa{background:var(--green);border-color:var(--green);color:#fff}

.empty{background:#fff;border:1px dashed #c8d6ee;border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty p{margin-bottom:12px;line-height:1.6}
.empty .btn{display:inline-block;background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:10px 18px;margin:4px}
.empty .btn.y{background:var(--yellow);color:var(--ink)}
.note{color:var(--muted);padding:20px 0;text-align:center}

footer{padding:14px 16px 24px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:480px){.nav{gap:6px}.add{padding:7px 10px;font-size:12px;max-width:34vw;overflow:hidden;text-overflow:ellipsis}.brand .col{display:none}}
@media(max-width:380px){.acts,.addr,.desc{margin-inline-start:0}}
.tag.prem.pt-silver{background:linear-gradient(135deg,#f6f8fa,#d5dbe3)!important;color:#3c4652!important;border-color:#c3cad4!important}.tag.prem.pt-platinum{background:linear-gradient(135deg,#1d2433,#41506e)!important;color:#eef3ff!important;border-color:#2b3650!important}
.tag.feat{background:#fff6d6;color:#8a6200;font-weight:800}/* Premium: सफ़ेद + हल्का सुनहरा + गहरा navy (सिर्फ़ Premium दुकानों पर) */.tag.prem{background:linear-gradient(135deg,#fdf7e6,#f4e4b8);color:#123568;border:1px solid #e3c983;font-weight:800;letter-spacing:.1px}.tag.prem i{font-style:normal;font-size:.85em;margin-right:3px}.goldname{color:#A67C22}@supports (-webkit-background-clip:text) or (background-clip:text){.goldname{background:linear-gradient(180deg,#C49A36 0%,#B58A2A 52%,#8E6A1C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}}.card.isprem{border-color:#ecdcb0;box-shadow:0 6px 20px rgba(18,53,104,.08),0 1px 3px rgba(181,138,42,.10)}.card.isprem h2 a{color:#A67C22}@supports (-webkit-background-clip:text) or (background-clip:text){.card.isprem h2 a{background:linear-gradient(180deg,#C49A36 0%,#B58A2A 52%,#8E6A1C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}}
#list article.card{cursor:pointer}
</style>
<script src="pb-guard.js" defer></script>
<script src="pb-track.js"></script>
</head>

<script>
function pbDir(b){const n=encodeURIComponent(b.name||""),a=encodeURIComponent(b.address||"");if(b.latitude!=null&&b.longitude!=null&&isFinite(+b.latitude)&&isFinite(+b.longitude))return "map.html?to="+(+b.latitude)+","+(+b.longitude)+"&n="+n+"&a="+a;return b.address?"map.html?q="+a+"&n="+n:"";}

const SB="https://kkvbpzysktozghnxplxv.supabase.co";
const KEY="sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8";
const H={apikey:KEY,Authorization:"Bearer "+KEY};
const CITIES={Gandhidham:[23.0753,70.1337],Adipur:[23.0750,70.0830],Anjar:[23.1130,70.0270],Bhuj:[23.2420,69.6669],Mundra:[22.8390,69.7220],Mandvi:[22.8330,69.3520],Nakhatrana:[23.3000,69.2700],Bhachau:[23.2960,70.3430],Rapar:[23.5730,70.6420],Naliya:[23.2600,68.8260],Dayapar:[23.6340,68.9020]};

const CATS={
 Automobile:{hi:"ऑटोमोबाइल",subs:["Car Wash & Detailing","Garage & Repair","Tyres & Batteries","Showroom & Dealer","Spare Parts & Accessories"]},
 Food:{hi:"खाना",subs:["Restaurant","Sweets & Bakery","Cafe & Snacks","Catering & Tiffin"]},
 Health:{hi:"स्वास्थ्य",subs:["Dental Care","Doctor & Clinic","Medical Store","Lab & Diagnostics","Gym & Fitness"]},
 Shopping:{hi:"शॉपिंग",subs:["Mobile & Electronics","Clothing & Fashion","Grocery & Kirana","Jewellery","Gifts & Stationery"]},
 Education:{hi:"शिक्षा",subs:["School & College","Coaching & Tuition","Computer & Skill Training"]},
 Home:{hi:"होम सर्विस",subs:["Plumber","Electrician","Interior & Furniture","Cleaning & Pest Control","Construction & Hardware"]},
 Professional:{hi:"प्रोफेशनल",subs:["Lawyer & Legal","CA & Accounting","Property Dealer","Manufacturer & Wholesaler","Transport & Logistics","Photo & Events","Insurance & Finance"]},
 Hotel:{hi:"होटल",subs:["Hotel & Lodge"]}
};
const T=(k,v)=>PB.t(k,v);
const MAP={none:"cnone",map:"dir"};
const L=new Proxy({},{get:(o,k)=>k==="found"?(n=>T("found",{n})):T(MAP[k]||k)});
const q=new URLSearchParams(location.search);
let cat=q.get("cat")||"Food";
if(!CATS[cat])cat="Food";
const info=CATS[cat];
function drawHead(){
  const nm=T("c_"+cat);
  document.title="PataBook – "+nm+" · Business Directory";
  document.getElementById("title").textContent=nm;
  document.getElementById("crumb").textContent=nm;
  PB.apply();
}
drawHead();

let radius=5, subSel=(info.subs.includes(q.get("sub"))?q.get("sub"):""), me=null, rows=[], mode="geo", cityName="Gandhidham";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function fmt(d){return d<1?Math.round(d*1000)+" m":d.toFixed(1)+" km";}
function subOf(b){const m=String(b.description||"").match(/Subcategory:\s*(.+)/);return m?m[1].trim():"";}
function cleanDesc(b){   /* card पर सिर्फ़ काम का प्रकार और "क्या बेचते हैं" — बाकी (समय, GST, Hide…) दुकान के page पर */
  const d=String(b.description||""),g=k=>{const m=d.match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
  const ty=g("Type"),sv=g("Services")||g("Products");
  if(ty||sv)return [ty,sv].filter(Boolean).join(" · ");
  if(/^[A-Za-z][\w-]*\s*:/m.test(d))return "";   /* बाकी सब "Key: value" lines */
  return d.replace(/\s+/g," ").trim();}

/* chips */
function drawSubs(){
  const el=document.getElementById("subs");
  el.innerHTML=[""].concat(info.subs).map(s=>`<button class="chip ${s===subSel?"on":""}" data-s="${esc(s)}">${esc(s||L.all)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;subSel=b.dataset.s;drawSubs();render();};
}
function drawRadius(){
  const el=document.getElementById("radius");
  el.style.display=mode==="geo"?"flex":"none";
  el.innerHTML=`<span class="lbl">${L.range}:</span>`+[5,10,25].map(r=>`<button class="chip ${r===radius?"on":""}" data-r="${r}">${r} km</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;radius=+b.dataset.r;drawRadius();load();};
}

/* location */
function locate(){
  const st=document.getElementById("status");
  st.innerHTML=L.locating;
  const saved=sessionStorage.getItem("pb-loc");
  if(saved){try{me=JSON.parse(saved);mode="geo";drawStatus();load();return;}catch(e){}}
  if(!navigator.geolocation){return fallback();}
  navigator.geolocation.getCurrentPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude};
    try{sessionStorage.setItem("pb-loc",JSON.stringify(me));}catch(e){}
    mode="geo";drawStatus();load();
  },()=>fallback(),{enableHighAccuracy:true,timeout:10000,maximumAge:300000});
}
function fallback(){
  mode="city";me=null;drawStatus();drawRadius();load();
}
function drawStatus(){
  const st=document.getElementById("status");
  document.getElementById("sub").innerHTML=mode==="geo"
    ?`${L.near} · ${T("within",{r:"<b>"+radius+" km</b>"})} · ${L.nearest}`
    :`${L.near}`;
  if(mode==="geo"){
    st.innerHTML=`<span class="loc">${L.using}</span><button id="re">${L.retry}</button>`;
    document.getElementById("re").onclick=()=>{try{sessionStorage.removeItem("pb-loc");}catch(e){}locate();};
  }else{
    st.innerHTML=`<span>${L.denied}</span><select id="cityPick">${Object.keys(CITIES).map(c=>`<option ${c===cityName?"selected":""}>${c}</option>`).join("")}</select><button id="re">${L.retry}</button>`;
    document.getElementById("cityPick").onchange=e=>{cityName=e.target.value;load();};
    document.getElementById("re").onclick=()=>{try{sessionStorage.removeItem("pb-loc");}catch(e){}locate();};
  }
  drawRadius();
}

/* data */
let SEL="name,slug,address,description,category,rating,review_count,is_verified,latitude,longitude,logo_url";
async function load(){
  const list=document.getElementById("list");
  list.innerHTML='<p class="note">…</p>';document.getElementById("count").textContent="";
  drawStatus_sub();
  const u=new URL(SB+"/rest/v1/businesses");
  u.searchParams.set("select",SEL);   /* phone/whatsapp nahi */
  u.searchParams.set("is_active","eq.true");
  u.searchParams.set("deleted_at","is.null");
  u.searchParams.set("category","eq."+cat);
  u.searchParams.set("limit","300");
  if(mode==="geo"&&me){
    const dLat=radius/111, dLng=radius/(111*Math.max(.2,Math.cos(me.lat*Math.PI/180)));
    u.searchParams.append("latitude","gte."+(me.lat-dLat));u.searchParams.append("latitude","lte."+(me.lat+dLat));
    u.searchParams.append("longitude","gte."+(me.lng-dLng));u.searchParams.append("longitude","lte."+(me.lng+dLng));
  }else{
    u.searchParams.set("address","ilike.*"+cityName+"*");
  }
  try{
    let r=await fetch(u,{headers:H});
    let data=await r.json();
    if(!r.ok&&SEL.includes("logo_url")&&/logo_url/.test(data&&data.message||"")){SEL=SEL.replace(",logo_url","");return load();}   /* logo column अभी नहीं बना */
    if(!r.ok)throw new Error(data.message||"x");
    if(mode==="geo"&&me){
      /* जिन दुकानों की map location save नहीं है, वे दूरी से नहीं मिलतीं: चुने शहर की ऐसी दुकानें नीचे जोड़ो */
      let city=cityName;try{city=localStorage.getItem("pb-city")||cityName;}catch(e){}
      const u2=new URL(SB+"/rest/v1/businesses");
      u2.searchParams.set("select",SEL);
      u2.searchParams.set("is_active","eq.true");u2.searchParams.set("deleted_at","is.null");
      u2.searchParams.set("category","eq."+cat);u2.searchParams.set("latitude","is.null");u2.searchParams.set("limit","200");
      if(city)u2.searchParams.set("address","ilike.*"+city+"*");
      try{const r2=await fetch(u2,{headers:H});if(r2.ok){const d2=await r2.json();if(Array.isArray(d2)){const seen={};data.forEach(b=>seen[b.slug]=1);d2.forEach(b=>{if(!seen[b.slug]){b._nopos=1;data.push(b);}});}}}catch(e){}
    }
    rows=data.map(b=>{
      const hasPos=b.latitude!=null&&b.longitude!=null;
      b._sub=subOf(b);
      b._d=(mode==="geo"&&me&&hasPos)?km(me.lat,me.lng,+b.latitude,+b.longitude):null;
      return b;
    }).filter(b=>mode!=="geo"||b._nopos||(b._d!=null&&b._d<=radius));
    rows.sort((a,b)=>mode==="geo"?((a._nopos?1:0)-(b._nopos?1:0))||((a._d??0)-(b._d??0))||String(a.name).localeCompare(b.name):String(a.name).localeCompare(b.name));
    rows=await premiumFirst(rows);
    render();
  }catch(e){list.innerHTML=`<p class="note">${L.err}</p>`;}
}
function drawStatus_sub(){
  document.getElementById("sub").innerHTML=mode==="geo"
    ?`${L.near} · ${T("within",{r:"<b>"+radius+" km</b>"})} · ${L.nearest}`:`${L.near} · <b>${esc(cityName)}</b>`;
}

/* 💎 Premium (sql-23): Premium दुकानें सबसे ऊपर — हर बार अलग क्रम (rotation), ताकि सबको बराबर मौका मिले */
let PREMS={};
async function premiumFirst(rows){
  if(!(window.PB_SITE&&PB_SITE.premium)||!rows||!rows.length||!window.PBPlan)return rows;
  try{await PBPlan.load(rows.map(b=>b.slug).filter(Boolean));}catch(e){return rows;}
  PREMS={};rows.forEach(b=>{if(PBPlan.paid(b.slug))PREMS[b.slug]=PBPlan.tier(b.slug);});
  /* plan में "ऊपर दिखना" ON: Platinum → Gold → Silver, हर समूह के अंदर हर बार अलग क्रम */
  const R={platinum:3,gold:2,silver:1},top=rows.filter(b=>PBPlan.has(b.slug,"top")),o=rows.filter(b=>!PBPlan.has(b.slug,"top"));
  for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]];}
  top.sort((a,b)=>(R[PBPlan.tier(b.slug)]||0)-(R[PBPlan.tier(a.slug)]||0));
  return top.concat(o);
}
function premTags(b){const t=PREMS[b.slug];if(!t)return "";const en=PB.lang&&PB.lang()!=="hi",ic={silver:"🥈",gold:"👑",platinum:"💎"}[t]||"💎";return (PBPlan.has(b.slug,"top")?'<span class="tag feat">⭐ Featured</span>':'')+'<span class="tag prem pt-'+t+'"><i>'+ic+'</i>'+esc(PBPlan.name(t,true))+' Member</span>';}
/* render */
/* दुकान का logo: logo_url हो तो फोटो, नहीं तो नाम के पहले अक्षर वाला रंगीन बैज */
const LOGO_BG=["linear-gradient(135deg,#1a73e8,#0b2f73)","linear-gradient(135deg,#1e9e57,#0f6b3a)","linear-gradient(135deg,#f57c00,#c43e00)","linear-gradient(135deg,#8e24aa,#5e1780)","linear-gradient(135deg,#e53935,#a31515)","linear-gradient(135deg,#00897b,#005b52)","linear-gradient(135deg,#3949ab,#1f2a78)"];
function logoHTML(b){
  const u=window.PBPlan&&PBPlan.has(b.slug,"logo")?String(b.logo_url||""):"";   /* Logo सिर्फ़ Premium दुकान का */
  if(/^https:\/\/kkvbpzysktozghnxplxv\.supabase\.co\/storage\/v1\/object\/public\/shop-logos\//.test(u))
    return `<div class="logo"><img src="${esc(u)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.textContent='${esc(initials(b.name))}'"></div>`;
  let h=0;for(const ch of String(b.name||""))h=(h*31+ch.charCodeAt(0))>>>0;
  return `<div class="logo" style="background:${LOGO_BG[h%LOGO_BG.length]}" aria-hidden="true">${esc(initials(b.name))}</div>`;
}
function initials(n){const w=String(n||"").trim().split(/\s+/).filter(Boolean);return ((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase();}
/* 💼 जिन दुकानों ने "मेरी दुकान" में Vacancy ON किया है (sql-13) — search में निशान */
let HIRE={},HIRE_KEY="";
async function loadHire(vis){
  const sl=vis.map(b=>b.slug).filter(Boolean).slice(0,50),key=sl.join(",");
  if(!sl.length||key===HIRE_KEY)return;HIRE_KEY=key;
  try{
    const r=await fetch(SB+"/rest/v1/rpc/pb_vacancy_status",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slugs:sl})});
    if(!r.ok)return;const j=await r.json()||{};
    if(Object.keys(j).length){HIRE=Object.assign({},HIRE,j);render();}
  }catch(e){}
}
function render(){
  const list=document.getElementById("list");
  const vis=rows.filter(b=>!subSel||b._sub===subSel);
  document.getElementById("count").textContent=vis.length?L.found(vis.length):"";
  if(!vis.length){
    const nextR=radius<10?10:radius<25?25:0;
    list.innerHTML=`<div class="empty"><p>${L.none}</p>
      ${mode==="geo"&&nextR?`<a class="btn" href="#" id="wide">${L.wider} → ${nextR} km</a>`:""}
      <p style="margin-top:14px">${L.addq}</p>
      <a class="btn y" href="list.html">${L.add}</a></div>`;
    const w=document.getElementById("wide");
    if(w)w.onclick=e=>{e.preventDefault();radius=nextR;drawRadius();load();};
    return;
  }
  loadHire(vis);
  list.innerHTML=vis.map((b,i)=>{
    const blink="business.html?slug="+encodeURIComponent(b.slug||"");
    const dir=pbDir(b);
    const d=cleanDesc(b);
    return `<article class="card${PREMS[b.slug]?" isprem":""}">
      <div class="top">
        ${logoHTML(b)}
        <div class="info">
          <h2><a href="${blink}">${esc(b.name)}</a></h2>
          <div class="tags">
            ${b._sub?`<span class="tag">${esc(b._sub)}</span>`:`<span class="tag">${esc(b.category)}</span>`}
            ${premTags(b)}
            ${b.is_verified?`<span class="tag ver">${L.ver}</span>`:""}
            ${HIRE[b.slug]?`<span class="tag hire">💼 ${PB.lang&&PB.lang()!=="hi"?"Hiring":"नौकरी खाली है"}</span>`:""}
            ${b.rating?`<span class="tag rt">★ ${esc(b.rating)}${b.review_count?" ("+esc(b.review_count)+")":""}</span>`:""}
          </div>
        </div>
        ${b._d!=null?`<div class="dist">${fmt(b._d)}<small>${L.away}</small></div>`:""}
      </div>
      ${b.address?`<p class="addr"><i aria-hidden="true" style="font-style:normal">📍</i><span>${esc(b.address)}</span></p>`:""}
      ${d?`<p class="desc">${esc(d)}</p>`:""}
      <div class="acts">
        <a class="call" href="${blink}#contact">${esc("📞 "+T("c_title"))}</a>
        ${dir?`<a href="${esc(dir)}">🧭 ${L.map}</a>`:`<span></span>`}
        <a href="${blink}">${L.details} ›</a>
      </div>
    </article>`;
  }).join("");
}

drawSubs();
PB.mount(document.getElementById("pbLang"));
PB.onChange(()=>{drawHead();drawSubs();drawStatus();if(rows.length||document.querySelector(".empty"))render();});
locate();

/* पूरा card दबाने पर दुकान खुले (button / link अपना काम करें) */
document.getElementById("list").addEventListener("click",function(e){
  if(e.target.closest("a,button,input,select,textarea,label"))return;
  var c=e.target.closest("article.card");if(!c)return;
  var a=c.querySelector("h2 a[href], a.jl[href]");if(a)location.href=a.getAttribute("href");
});
</script>
