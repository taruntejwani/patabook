<!doctype html>
<html lang="hi">
<head><style id="pb-noswipe">html,body{overscroll-behavior-x:none}</style>
<meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"><style id="pbfont">:root{--pbf:"Plus Jakarta Sans","Hind",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",Arial,sans-serif}</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style id="pbzoom">/* दो उँगली से zoom चालू (accessibility); double-tap zoom बंद; iPhone पर input छूने से अपने-आप zoom न हो */html{touch-action:pan-x pan-y;-webkit-tap-highlight-color:transparent}@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}input:focus,textarea:focus,select:focus,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none!important}@media(pointer:coarse){a[href^="tel:"]:not([class]),a[href^="mailto:"]:not([class]),footer a,.pb-legal a,.legal a{display:inline-block;padding-block:11px;margin-block:-11px}}</style>
<title>Shop offers – PataBook</title>
<script>try{if(localStorage.getItem("pb-lang")==="hi")document.title="दुकानों के ऑफ़र – PataBook"}catch(e){}</script>
<meta name="description" content="Offers from local shops on PataBook — Gandhidham, Adipur, Anjar, Bhuj and more.">
<link rel="canonical" href="https://patabook.in/offers">
<link rel="icon" href="pin.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<script src="i18n.js"></script>
<script src="site-config.js"></script>
<script src="pb-auth.js"></script>
<style>
:root{--blue:#1a73e8;--navy:#0b2f73;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit}body{font-family:var(--pbf,system-ui,sans-serif);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.nav{display:flex;align-items:center;gap:10px;height:60px}
.back{font-size:22px;line-height:1;padding:6px 8px 6px 0;color:var(--navy);text-decoration:none}
.brand{display:flex;align-items:center;gap:8px;line-height:1;text-decoration:none;color:var(--ink)}
.brand img{width:28px;height:auto}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.5px}.brand b span{color:var(--blue)}
.sp{flex:1}
main{padding:22px 0 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px}
h1,.h1{font-size:24px;line-height:1.25;margin-bottom:4px}
.upd{font-size:13px;color:var(--muted);margin-bottom:6px}
h2{font-size:18px;margin:18px 0 6px;color:var(--navy)}
p,li{font-size:15px}
ul{padding-left:20px;margin:4px 0}
li{margin:3px 0}
.note{background:#fffaeb;border:1px solid #fedf89;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.ct{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eef1f6}
.ct:last-child{border:0}
.ct i{font-style:normal;font-size:22px;width:30px;text-align:center}
.ct small{display:block;color:var(--muted);font-size:13px}
.ct b{font-size:16px;word-break:break-word}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns a{text-decoration:none;font-weight:700;font-size:14px;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff}
.btns a.alt{background:#eff4ff;color:var(--blue)}
.pending{color:#b54708;font-weight:700}
footer{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.legal{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-bottom:6px}
.legal a{color:var(--muted);text-decoration:none}
[data-l]{display:none}
html[lang="en"] [data-l="en"],html:not([lang="en"]) [data-l="hi"]{display:block}
.cf label{display:block;font-size:13px;font-weight:700;color:#344054;margin:12px 0 5px}
.cf input,.cf select,.cf textarea{width:100%;box-sizing:border-box;border:1.5px solid #d0d5dd;border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:#12141c}
.cf textarea{min-height:150px;resize:vertical;line-height:1.5}
.cf input:focus,.cf select:focus,.cf textarea:focus{outline:0;border-color:#1a73e8;box-shadow:0 0 0 3px #1a73e822}
.cf .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.cf .row2{grid-template-columns:1fr}}
.cf .cnt{text-align:right;font-size:12px;color:#5b6475;margin-top:4px}
.cf .err{color:#b42318;font-size:14px;min-height:18px;margin-top:8px}
.cf button{width:100%;margin-top:12px;border:0;border-radius:12px;background:#1a73e8;color:#fff;font:inherit;font-size:16px;font-weight:700;padding:14px;cursor:pointer}
.cf button:disabled{opacity:.6}
.cf .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.okbox{text-align:center;padding:10px 0}.okbox .big{font-size:48px}.okbox h3{margin:6px 0;color:#0b2f73}.okbox .tk{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:18px;background:#eaf2ff;color:#0b2f73;border-radius:10px;padding:6px 14px;margin:8px 0}
.okbox button{width:auto;margin-top:10px;background:#eef2f8;color:#0b2f73;padding:10px 18px}
</style>
<style>
.cty{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.cty button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.cty button.on{border-color:#f08c00;background:#fff4e6;color:#a35200}
</style>
<script src="pb-track.js"></script>
<style>@media(min-width:900px){.wrap{max-width:920px}}</style>
<script src="pb-backlink.js" defer></script>
<script src="pb-offers.js?v=1"></script>
</head>
<body>
<header><div class="wrap nav">
  <a class="back" href="index.html" aria-label="Home">←</a>
  <a class="brand" href="index.html"><img src="pin.png" alt=""><img class="pbwm" src="pb-wordmark.webp" alt="PataBook" width="117" height="20" style="height:clamp(15px,5vw,20px);width:auto;display:block"></a>
  <div class="sp"></div>
  <span id="pbLang"></span>
</div></header>
<main class="wrap">
<div class="card">
  <h1 id="ofH"></h1>
  <p class="upd" id="ofS"></p>
  <nav class="cty" id="ofC" aria-label="City"></nav>
  <div id="ofBox"><p class="upd">…</p></div>
</div>
</main>
<script>
(function () {
  /* 🎁 शहर के हिसाब से दुकानों के चालू ऑफ़र (sql-52: pb_offers_city) */
  var CITIES = ["Gandhidham", "Adipur", "Anjar", "Bhuj", "Mundra", "Mandvi", "Bhachau", "Rapar"];
  var CH = { Gandhidham: "गांधीधाम", Adipur: "आदिपुर", Anjar: "अंजार", Bhuj: "भुज", Mundra: "मुंद्रा", Mandvi: "मांडवी", Bhachau: "भचाऊ", Rapar: "रापर" };
  var city = ""; try { city = new URLSearchParams(location.search).get("city") || localStorage.getItem("pb-of-city") || ""; } catch (e) {}
  if (city && CITIES.indexOf(city) < 0) city = "";
  var ROWS = null, seq = 0;
  function en() { return (localStorage.getItem("pb-lang") || "en") !== "hi"; }
  function T(h, e) { return en() ? e : h; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function draw() {
    document.documentElement.lang = en() ? "en" : "hi";
    document.getElementById("ofH").textContent = "🎁 " + T("दुकानों के ऑफ़र", "Shop offers");
    document.getElementById("ofS").textContent = T("ऑफ़र दुकानदार खुद डालते हैं। ख़रीदने से पहले दुकान से पक्का कर लें।", "Shop owners post these offers themselves. Please confirm with the shop before buying.");
    document.getElementById("ofC").innerHTML = '<button type="button" data-c="" class="' + (city ? "" : "on") + '">' + esc(T("सभी शहर", "All cities")) + '</button>' +
      CITIES.map(function (c) { return '<button type="button" data-c="' + c + '" class="' + (city === c ? "on" : "") + '">' + esc(en() ? c : CH[c]) + '</button>'; }).join("");
    var box = document.getElementById("ofBox");
    if (ROWS === null) { box.innerHTML = '<p class="upd">' + T("लोड हो रहा है…", "Loading…") + '</p>'; return; }
    if (ROWS === "err") { box.innerHTML = '<p class="upd">' + T("अभी ऑफ़र नहीं खुल सके। थोड़ी देर बाद कोशिश करें।", "Could not load offers. Please try again later.") + '</p>'; return; }
    PBOffers.list(box, ROWS, { empty: T("अभी इस शहर में कोई ऑफ़र नहीं है।", "No offers in this city right now.") });
  }
  function load() {
    var my = ++seq; ROWS = null; draw();
    PBOffers.post("pb_offers_city", { p_city: city }).then(function (j) { if (my !== seq) return; ROWS = Array.isArray(j) ? j : []; draw(); })
      .catch(function () { if (my !== seq) return; ROWS = "err"; draw(); });
  }
  document.getElementById("ofC").addEventListener("click", function (e) {
    var b = e.target.closest("[data-c]"); if (!b) return; city = b.dataset.c;
    try { localStorage.setItem("pb-of-city", city); } catch (er) {}
    load();
  });
  if (window.PB) { PB.mount(document.getElementById("pbLang")); PB.onChange(function () { PB.apply(); draw(); }); PB.apply(); }
  load();
})();
</script>
</body>
</html>
