<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="pin.png">
<link rel="manifest" href="manifest.json">
<title>PataBook Map – दुकानें और रास्ता</title>
<script>
/* Mapbox (best quality) पहले; Mapbox बंद/सीमा पार हो तो अपने-आप मुफ़्त नक्शा */
var PB_USE_MAPBOX = true;
var PB_LIBS = {
  mapbox: ['https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.css', 'https://api.mapbox.com/mapbox-gl-js/v3.17.0/mapbox-gl.js'],
  free: ['https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css', 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js']
};
(function () {
  var freeUntil = 0; try { freeUntil = +localStorage.getItem('pb-free-until') || 0; } catch (e) {}
  window.PB_PROVIDER = PB_USE_MAPBOX && freeUntil < Date.now() ? 'mapbox' : 'free';
  function load(kind, fail) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = PB_LIBS[kind][0]; document.head.appendChild(l);
    var sc = document.createElement('script'); sc.src = PB_LIBS[kind][1];
    sc.onload = function () { if (kind === 'mapbox') window.maplibregl = window.mapboxgl; window.PB_PROVIDER = kind; window.__libReady = true; if (window.PBMAIN) window.PBMAIN(); };
    sc.onerror = fail;
    document.head.appendChild(sc);
  }
  var giveUp = function () { window.__libReady = true; if (window.PBMAIN) window.PBMAIN(); };
  if (window.PB_PROVIDER === 'mapbox') load('mapbox', function () { load('free', giveUp); });
  else load('free', giveUp);
})();
</script>
<script src="i18n.js"></script>
<script src="map-i18n.js"></script>
<script src="pb-auth.js"></script>
<style>
:root{--blue:#1a73e8;--navy:#0b2f73;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5;--top:calc(10px + env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#f3f1ec}
#map{position:absolute;inset:0}
button,input,select{font:inherit}button{cursor:pointer}
[hidden]{display:none!important}

/* ---------- ऊपर: नाम + शहर ---------- */
.top{position:absolute;z-index:6;top:var(--top);left:10px;right:10px;display:flex;align-items:center;gap:8px;background:#ffffffee;border-radius:16px;padding:7px 8px 7px 10px;box-shadow:0 8px 28px #102a4322;backdrop-filter:blur(10px)}
.back{font-size:22px;line-height:1;padding:4px 4px 4px 0;color:var(--navy);text-decoration:none}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.brand img{width:24px;height:auto;flex:none}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}.brand b span{color:var(--blue)}
.cityw{position:relative;flex:none}
.cityw select{appearance:none;-webkit-appearance:none;border:1px solid #d0d5dd;border-radius:10px;background:#fff;padding:8px 26px 8px 10px;font-size:13px;font-weight:700;color:#344054;max-width:132px}
.cityw::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:#667085;pointer-events:none}

/* ---------- खोज ---------- */
.sbar{position:absolute;z-index:6;top:calc(var(--top) + 60px);left:10px;right:10px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 6px 0 12px;box-shadow:0 6px 22px #102a4326;height:46px}
.sbar svg{width:20px;height:20px;flex:none;fill:#667085}
.sbar input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:transparent;color:var(--ink)}
.sbar button{border:0;background:none;font-size:20px;color:#667085;padding:6px 8px}
.sres{position:absolute;z-index:7;top:calc(var(--top) + 110px);left:10px;right:10px;max-height:52vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 10px 30px #102a4330}
.sres .h{padding:9px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sres a{display:flex;align-items:center;gap:11px;padding:10px 14px;border-top:1px solid #f1f3f6;color:var(--ink);text-decoration:none;cursor:pointer}
.sres a:active,.sres a:hover{background:#f1f6ff}
.sres .ic{width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:#eff4ff}
.sres .ic img{width:20px}.sres .ic svg{width:18px;height:18px;fill:#fff}
.sres b{display:block;font-size:14.5px}.sres small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.sres .none{padding:14px;font-size:13px;color:var(--muted)}

/* ---------- फ़िल्टर ---------- */
.chips{position:absolute;z-index:5;top:calc(var(--top) + 112px);left:0;right:0;display:flex;gap:7px;overflow-x:auto;padding:2px 10px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;padding:7px 12px 7px 8px;font-size:13px;font-weight:700;color:#344054;box-shadow:0 3px 12px #102a4322;white-space:nowrap}
.chips button i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.chips button i svg{width:12px;height:12px;fill:#fff}
.chips button.on{background:var(--navy);color:#fff}

/* ---------- दाएँ बटन ---------- */
.fab{position:absolute;z-index:5;right:12px;bottom:calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;transition:bottom .25s}
.fab button{width:48px;height:48px;border-radius:15px;border:0;background:#fff;box-shadow:0 6px 20px #102a4330;display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--navy)}
.fab button svg{width:24px;height:24px}
.fab button.on{background:var(--blue);color:#fff}.fab button.on svg path{fill:#fff}.fab button.on svg path{fill:#fff}
.recenter{position:absolute;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#1a73e8;color:#fff;font-weight:800;font-size:14px;padding:12px 20px;box-shadow:0 8px 24px #1a73e866}
body.nav .recenter{bottom:calc(100px + env(safe-area-inset-bottom))}
body.route:not(.nav) .recenter{bottom:calc(var(--sheet,260px) + 14px)}
.basic{position:absolute;z-index:6;left:50%;transform:translateX(-50%);top:calc(var(--top) + 158px);display:flex;align-items:center;gap:8px;background:#fffffff2;border-radius:999px;padding:6px 6px 6px 12px;font-size:12px;font-weight:700;color:#344054;box-shadow:0 4px 14px #102a4325;white-space:nowrap}
.basic button{border:0;border-radius:999px;background:#1a73e8;color:#fff;font-weight:800;font-size:12px;padding:6px 10px}
body.nav .basic,body.route .basic{display:none}
.status{position:absolute;z-index:8;left:50%;transform:translateX(-50%);top:calc(var(--top) + 160px);max-width:calc(100% - 40px);background:#101828e6;color:#fff;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;box-shadow:0 6px 20px #102a4333;text-align:center}
.status.warn{background:#b42318ee}.status:empty{display:none}

/* ---------- कार्ड (popup) ---------- */
.maplibregl-popup-content{border-radius:16px;padding:0;box-shadow:0 10px 30px #102a4335;font-family:inherit;overflow:hidden}
.maplibregl-popup-close-button{font-size:20px;width:30px;height:30px;color:#667085}
.pc{display:flex;gap:11px;padding:13px 14px 10px}
.pc .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center}
.pc .ic svg{width:22px;height:22px;fill:#fff}.pc .ic img{width:28px;height:auto}
.pt{font-weight:800;font-size:15px;line-height:1.25;padding-right:18px}
.ps{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.pa{font-size:11.5px;color:#b54708;margin-top:4px}
.pv{display:inline-block;font-size:10px;font-weight:800;color:#1a73e8;background:#eaf2ff;border-radius:999px;padding:2px 6px;margin-left:4px}
.pb{display:flex;gap:6px;padding:0 14px 13px}
.pb a,.pb button{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:800;border-radius:10px;padding:10px 6px;border:0}
.pb .dir{background:var(--blue);color:#fff}.pb .pro{background:#eff4ff;color:var(--blue)}

/* ---------- रास्ते की शीट ---------- */
.sheet{position:absolute;z-index:9;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 34px #102a4330;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-height:62vh;display:flex;flex-direction:column}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-t{flex:1;min-width:0}.sh-t small{display:block;font-size:12px;color:var(--muted)}
.sh-t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head button{border:0;background:#f2f4f7;border-radius:10px;width:34px;height:34px;font-size:16px;color:#344054}
.modes{display:flex;gap:7px;margin-top:10px}
.modes button{flex:1;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:9px 4px;font-size:13px;font-weight:700;color:#344054}
.modes button.on{border-color:var(--blue);background:#eff4ff;color:var(--blue)}
.sum{margin-top:10px;font-size:13px;color:var(--muted)}.sum b{font-size:20px;color:#1a73e8;margin-right:6px}
.sum .err{color:#b42318;font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.acts .go{flex:1;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;padding:13px}
.acts .go:disabled{opacity:.5}
.acts .tog{border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:12px 12px;font-weight:700;font-size:13px;color:#344054}
.gm{display:block;text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.steps{list-style:none;margin:10px 0 0;padding:0;overflow:auto;border-top:1px solid #f1f3f6}
.steps li{display:flex;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid #f1f3f6;font-size:13.5px}
.steps .a{width:30px;height:30px;flex:none;border-radius:9px;background:#f2f4f7;display:grid;place-items:center;font-size:17px;font-weight:900;color:var(--navy)}
.steps small{display:block;color:var(--muted);font-size:11.5px}
body.route .fab{bottom:calc(var(--sheet,260px) + 12px)}
body.route .chips,body.route .sres,body.srch .chips{display:none}

/* ---------- नेविगेशन ---------- */
.navb{position:absolute;z-index:10;top:var(--top);left:10px;right:10px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0b2f73,#1a73e8);color:#fff;border-radius:18px;padding:12px 12px 12px 14px;box-shadow:0 10px 30px #0006}
.navb .arw{width:52px;height:52px;flex:none;border-radius:14px;background:#ffffff26;display:grid;place-items:center;font-size:32px;font-weight:900}
.navb .ntx{flex:1;min-width:0}.navb .ntx b{display:block;font-size:24px;line-height:1.1}.navb .ntx span{display:block;font-size:15px;line-height:1.3;margin-top:2px}
.navb button{border:0;background:#ffffff26;color:#fff;border-radius:12px;width:44px;height:44px;font-size:20px}
.navb .nbtns{display:flex;flex-direction:column;gap:6px;flex:none}.navb .lgb{width:44px;height:30px;font-size:12px;font-weight:800;border-radius:10px}
.lgb{border:1px solid #d0d5dd;background:#fff;color:#0b2f73;border-radius:10px;height:36px;padding:0 8px;font-size:12.5px;font-weight:800;flex:none;white-space:nowrap;cursor:pointer}
.lgp{position:fixed;z-index:40;width:210px;max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid #e4eaf5;border-radius:14px;box-shadow:0 12px 34px #0b2f7333;padding:5px}
.lgp button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:9px;font:inherit;font-size:14.5px;color:#12141c;text-align:start;cursor:pointer}
.lgp button.on{background:#e8f1ff;color:#0b2f73;font-weight:800}.lgp small{font-size:10.5px;color:#7a8396}
body.nav .recenter{font-size:16px;padding:14px 24px;box-shadow:0 10px 30px #0b2f7388;animation:rcIn .25s ease-out}
@media (max-width:420px){.cityw select{max-width:124px;padding-right:22px;font-size:12.5px}.top .lgb{padding:0 6px;font-size:12px}.top{gap:6px}}
@keyframes rcIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.navf{position:absolute;z-index:10;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 12px 12px 16px;box-shadow:0 10px 30px #102a4335}
.navf div{flex:1}.navf b{display:block;font-size:20px;color:#0b2f73}.navf small{font-size:13px;color:var(--muted)}
.navf button{border:0;background:#d92d20;color:#fff;font-weight:800;border-radius:12px;padding:12px 18px;font-size:15px}
body.nav .top,body.nav .sbar,body.nav .sres,body.nav .chips,body.nav .sheet,body.nav .maplibregl-ctrl-top-right{display:none!important}
body.nav .fab{bottom:calc(96px + env(safe-area-inset-bottom))}

/* ---------- मेरी लोकेशन ---------- */
.me{position:relative;width:22px;height:22px}
.me .dot{position:absolute;inset:0;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 6px #0005}
.me .halo{position:absolute;inset:-10px;border-radius:50%;background:#1a73e833;animation:halo 2s ease-out infinite}
.me .cone{position:absolute;left:50%;bottom:50%;width:46px;height:46px;margin-left:-23px;transform-origin:50% 100%;background:radial-gradient(circle at 50% 100%,#1a73e877,transparent 70%);clip-path:polygon(50% 100%,15% 0,85% 0);display:none}
.me.head .cone{display:block}
@keyframes halo{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.me .vh{display:none}
.me.veh .dot,.me.veh .halo,.me.veh .cone{display:none!important}
.me.veh .vh{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px #0006)}
.me.veh .vh svg{display:block}
.me.veh .vh .wk{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #1a73e8;font-size:24px;line-height:1}
.viapt{width:16px;height:16px;border-radius:50%;background:#f59f00;border:3px solid #fff;box-shadow:0 1px 6px #0006}
.via{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:#8a5a00;background:#fff7e6;border:1px solid #ffe2a8;border-radius:10px;padding:6px 10px}
.via b{color:#0b2f73;font-size:13px}.via button{margin-inline-start:auto;border:0;background:#fff;border:1px solid #ffd27a;color:#8a5a00;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer}
.tiphint{font-size:12px;color:#5b6475;margin-top:6px}
.startpt{width:18px;height:18px;border-radius:50%;background:#4dabf7;border:3px solid #fff;box-shadow:0 1px 6px #0005}

/* ---------- लोडिंग स्क्रीन ---------- */
.splash{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;transition:opacity .45s ease}
.splash.hide{opacity:0;pointer-events:none}
.vis{width:min(280px,72vw)}
.art{position:relative;width:100%;aspect-ratio:830/640}
.art .map{position:absolute;left:0;top:39.8%;width:100%;height:auto;mix-blend-mode:multiply}
.art .pin{position:absolute;left:40.8%;top:31.6%;width:22%;height:auto;transform-origin:50% 100%;animation:pbjump 1.7s ease-in-out infinite}
.art .ring{position:absolute;left:48.3%;top:64.8%;width:7%;height:5%;border:3px solid #e53935;border-radius:50%;opacity:0;animation:pbring 1.7s ease-out infinite}
@keyframes pbjump{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.05,.94)}45%{transform:translateY(-14%) scale(.98,1.03)}62%{transform:translateY(0) scale(1.04,.94)}75%{transform:translateY(-3%) scale(1,1)}}
@keyframes pbring{0%,55%{opacity:0;transform:scale(.4)}62%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.art .pin,.art .ring,.me .halo{animation:none}}
.sname{margin-top:10px;font-size:24px;font-weight:900;letter-spacing:.3px}.sname span{color:var(--blue)}
.ssub{margin-top:4px;font-size:13px;color:var(--muted)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.maplibregl-ctrl-top-right{top:calc(var(--top) + 158px)!important}
.maplibregl-ctrl-group{border-radius:12px!important;box-shadow:0 4px 14px #102a4325!important}
.maplibregl-ctrl-group button{width:36px!important;height:36px!important}
@media(min-width:760px){
 .top,.sbar,.sres{width:400px;right:auto;left:18px}
 .chips{left:420px;top:calc(var(--top) + 64px)}
 .sheet{width:420px;left:18px;bottom:18px;border-radius:20px;max-height:70vh}
 body.route .fab{bottom:30px}
 .navb,.navf{width:440px;left:18px;right:auto}
 .maplibregl-ctrl-top-right{top:10px!important}
}
.mapboxgl-popup-content{border-radius:16px;padding:0;box-shadow:0 10px 30px #102a4335;font-family:inherit;overflow:hidden}
.mapboxgl-popup-close-button{font-size:20px;width:30px;height:30px;color:#667085}
body.nav .top,body.nav .sbar,body.nav .sres,body.nav .chips,body.nav .sheet,body.nav .mapboxgl-ctrl-top-right{display:none!important}
.mapboxgl-ctrl-top-right{top:calc(var(--top) + 158px)!important}
.mapboxgl-ctrl-group{border-radius:12px!important;box-shadow:0 4px 14px #102a4325!important}
.mapboxgl-ctrl-group button{width:36px!important;height:36px!important}
 .mapboxgl-ctrl-top-right{top:10px!important}
.mapboxgl-ctrl-logo{margin:0 0 2px 2px!important}
</style>
<script src="pb-guard.js" defer></script>
<script src="pb-track.js"></script>
</head>
<body>

<div class="splash" id="splash">
  <div class="vis"><div class="art" aria-hidden="true">
    <img class="map" src="map.png" alt="">
    <i class="ring"></i>
    <img class="pin" src="pin.png" alt="">
  </div></div>
  <div class="sname">Pata<span>Book</span></div>
  <div class="ssub dots" data-t="loading">मैप लोड हो रहा है</div>
</div>

<div id="map"></div>

<header class="top">
  <a class="back" href="index.html" aria-label="Home">←</a>
  <a class="brand" href="index.html"><img src="pin.png" alt=""><b>Pata<span>Book</span> Map</b></a>
  <button type="button" class="lgb" data-lg aria-label="Language">🌐 <span class="lgt">हि</span> ▾</button>
  <label class="cityw"><select id="city" aria-label="City"></select></label>
</header>
<div class="lgp" id="lgp" hidden></div>

<form class="sbar" id="sform" autocomplete="off" onsubmit="return false">
  <svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
  <input id="q" type="text" enterkeyhint="search" data-tp="search_ph" placeholder="दुकान, जगह या पता खोजें">
  <button type="button" id="qx" hidden aria-label="Clear">✕</button>
</form>
<div class="sres" id="sres" hidden></div>

<nav class="chips" id="chips" aria-label="Filter"></nav>

<div class="fab">
  <button id="tilt" class="on" aria-label="3D / 2D">3D</button>
  <button id="sat" aria-label="Satellite / Map"><svg viewBox="0 0 24 24"><path fill="#0b2f73" d="M12 2 2 7l10 5 10-5zm-7.6 8.7L2 12l10 5 10-5-2.4-1.3L12 14.5zm0 5L2 17l10 5 10-5-2.4-1.3L12 19.5z"/></svg></button>
  <button id="locate" aria-label="My location"><svg viewBox="0 0 24 24"><path fill="#1a73e8" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7 7 0 0 0 13 5.06V3h-2v2.06A7 7 0 0 0 5.06 11H3v2h2.06A7 7 0 0 0 11 18.94V21h2v-2.06A7 7 0 0 0 18.94 13H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>

/* =========================================================

   ========================================================= */

function photon(q, limit) {

  var u = PHOTON + '?q=' + encodeURIComponent(q) + '&limit=' + (limit || 1) + '&lat=' + c.lat.toFixed(4) + '&lon=' + c.lng.toFixed(4) + '&bbox=' + KUTCH_BBOX;

}

    '&bbox=' + KUTCH_BBOX + '&language=en&access_token=' + MAPBOX_TOKEN;

    return photon(tries[i++], 1).then(function (fs) {
      if (fs.length) { var ll = fs[0].geometry.coordinates; cacheSet(addr, ll); return ll; }
      return next();
    });
  }

  fetch(SB_URL + '/rest/v1/businesses?' + q.toString(), { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      BIZ = rows.map(function (b) {
        var lat = +b.latitude, lng = +b.longitude, ok = b.latitude != null && b.longitude != null && isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
        return { name: b.name || T('shop_t'), slug: b.slug || '', address: b.address || '', category: b.category || '', v: !!b.is_verified, ll: ok ? [lng, lat] : null, approx: false };
      });
      addBizLayers();
      var exact = BIZ.filter(function (b) { return b.ll; }).length;
      if (exact) status(T('pb_n', { n: exact }));
      geocodeMissing();
    })
    .catch(function (e) { status(T('pb_fail') + ' (' + e.message + ')', true); });
}
function geocodeMissing() {
  var todo = BIZ.filter(function (b) { return !b.ll && b.address; }).slice(0, 60), i = 0, fresh = 0;
  (function step() {
    if (i >= todo.length) { if (fresh) refreshBiz(); return; }
    var b = todo[i++], cached = cacheGet(b.address);
    geocode(b.address).then(function (ll) {
      if (ll) { b.ll = ll; b.approx = true; fresh++; if (fresh % 5 === 1) refreshBiz(); }
    }).catch(function () {}).then(function () { setTimeout(step, cached ? 0 : 1100); });   // मुफ़्त सेवा: हर सेकंड एक
  })();
}

  return BIZ.filter(function (b) { return b.ll && (currentGroup === 'all' || (g.pb || []).indexOf(b.category) >= 0); }).map(function (b) {
    return { type: 'Feature', geometry: { type: 'Point', coordinates: b.ll }, properties: { i: BIZ.indexOf(b), name: b.name, cat: PB_CAT[b.category] ? b.category : '' } };
  });
}

  addL({ id: 'pb-cluster', type: 'circle', source: 'pb', filter: ['has', 'point_count'],
    paint: { 'circle-color': '#1a73e8', 'circle-radius': ['step', ['get', 'point_count'], 17, 10, 21, 50, 27], 'circle-stroke-width': 3, 'circle-stroke-color': '#fff', 'circle-pitch-alignment': 'viewport' } });
  addL({ id: 'pb-count', type: 'symbol', source: 'pb', filter: ['has', 'point_count'],

    if (lys.length && map.queryRenderedFeatures(e.point, { layers: lys }).length) return;
  } catch (x) {}
  var ll = [e.lngLat.lng, e.lngLat.lat];
  if (hav(ll, route.to) < 40 || hav(ll, route.from) < 40) return;
  route.via = ll;
  if (viaMk) viaMk.remove();
  var el = document.createElement('div'); el.className = 'viapt';
  viaMk = new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map);

});
$('rClose').onclick = closeRoute;

/* ---------- मोड़ की भाषा ---------- */
var DIR = {
  hi: { left: 'बाएँ मुड़ें', right: 'दाएँ मुड़ें', 'slight left': 'हल्का बाएँ मुड़ें', 'slight right': 'हल्का दाएँ मुड़ें', 'sharp left': 'तेज़ बाएँ मुड़ें', 'sharp right': 'तेज़ दाएँ मुड़ें', straight: 'सीधे चलते रहें', uturn: 'यू-टर्न लें' },
  en: { left: 'Turn left', right: 'Turn right', 'slight left': 'Keep slightly left', 'slight right': 'Keep slightly right', 'sharp left': 'Turn sharp left', 'sharp right': 'Turn sharp right', straight: 'Continue straight', uturn: 'Make a U-turn' }
};
var ORD = { hi: ['पहला', 'दूसरा', 'तीसरा', 'चौथा', 'पाँचवाँ', 'छठा'], en: ['1st', '2nd', '3rd', '4th', '5th', '6th'] };
var DKEY = { left: 'dir_left', right: 'dir_right', 'slight left': 'dir_sl', 'slight right': 'dir_sr', 'sharp left': 'dir_shl', 'sharp right': 'dir_shr', straight: 'dir_st', uturn: 'dir_ut' };
['hi', 'en'].forEach(function (L) {
  var d = DIR[L]; TX[L].dir_left = d.left; TX[L].dir_right = d.right; TX[L].dir_sl = d['slight left']; TX[L].dir_sr = d['slight right'];
  TX[L].dir_shl = d['sharp left']; TX[L].dir_shr = d['sharp right']; TX[L].dir_st = d.straight; TX[L].dir_ut = d.uturn; TX[L].ord = ORD[L];
});
function instr(s, L) {
  L = L || lang();
  var m = s.maneuver, ty = m.type, mod = m.modifier || 'straight', nm = s.name ? (L === 'en' ? ' onto ' : ' — ') + s.name : '';
  if (ty === 'depart') return s.name ? T('start_on', { r: s.name }, L) : T('start', null, L);
  if (ty === 'arrive') return (route && route.name ? route.name + ' — ' : '') + T('arrived', null, L);
  if (/roundabout|rotary/.test(ty)) {
    var ord = T('ord', null, L), ex = m.exit && Array.isArray(ord) ? ord[Math.min(m.exit, 6) - 1] : null;
    return (ex ? T('rb', { n: ex }, L) : T('rb0', null, L)) + nm;

  if ((ty === 'continue' || ty === 'new name') && mod === 'straight') return T('dir_st', null, L) + nm;
  return T(DKEY[mod] || 'dir_st', null, L) + nm;
}
function arrow(s) {
  var m = s.maneuver, t = m.type, mod = m.modifier || 'straight';
  if (t === 'arrive') return '🏁'; if (t === 'depart') return '⬆';
  if (/roundabout|rotary/.test(t)) return '⟳';
  return { left: '↰', right: '↱', 'slight left': '↖', 'slight right': '↗', 'sharp left': '↰', 'sharp right': '↱', straight: '↑', uturn: '↶' }[mod] || '↑';
}

/* =========================================================
   नेविगेशन — Google जैसा चलना, हिंदी आवाज़
   ========================================================= */
var nav = null, voice = true, wake = null;
var SPEECH = { hi: 'hi-IN', en: 'en-IN', gu: 'gu-IN', mr: 'mr-IN', bn: 'bn-IN', ta: 'ta-IN', te: 'te-IN', kn: 'kn-IN', ml: 'ml-IN', or: 'or-IN', as: 'as-IN',
  pa: 'pa-IN', ur: 'ur-IN', ne: 'ne-NP', sd: 'sd-IN', 'sd-deva': 'sd-IN', ks: 'ks-IN', mai: 'mai-IN', kok: 'kok-IN', doi: 'doi-IN', sa: 'sa-IN', brx: 'brx-IN', sat: 'sat-IN', mni: 'mni-IN' };
var DEVA = { hi: 1, mr: 1, ne: 1, mai: 1, kok: 1, doi: 1, sa: 1, brx: 1, 'sd-deva': 1 };
function voiceFor(tag) {
  var p = tag.split('-')[0], vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  return vs.filter(function (v) { return v.lang && v.lang.toLowerCase().replace('_', '-').split('-')[0] === p; })[0] || null;
}
try { if (window.speechSynthesis) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = function () {}; } } catch (e) {}
function speakFn(build) {
  if (!voice || !window.speechSynthesis) return;
  try {
    var L = lang(), tag = SPEECH[L] || 'hi-IN', v = voiceFor(tag), useL = L, known = speechSynthesis.getVoices().length > 0;
    if (!v && known) { tag = 'hi-IN'; v = voiceFor('hi-IN'); if (!DEVA[L]) useL = 'hi'; }
    var u = new SpeechSynthesisUtterance(build(useL)); u.lang = tag; if (v) u.voice = v; u.rate = 1;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
function speak(t) {
  if (!voice || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = lang() === 'en' ? 'en-IN' : 'hi-IN'; u.rate = 1; speechSynthesis.speak(u); } catch (e) {}
}
/* नेविगेशन में नीले बिंदु की जगह गाड़ी: car / bike / पैदल (ऊपर से देखी हुई, रास्ते की दिशा में घूमती) */
var VEH = {
  car: '<svg width="30" height="50" viewBox="0 0 30 50" aria-hidden="true"><rect x="3" y="2" width="24" height="46" rx="9" fill="#1a73e8" stroke="#fff" stroke-width="2.5"/>' +
       '<path d="M7 15 Q15 9 23 15 L22 21 H8 Z" fill="#0b2f73"/><rect x="8" y="33" width="14" height="6" rx="2" fill="#0b2f73"/>' +
       '<rect x="5" y="6" width="5" height="3" rx="1.5" fill="#ffe066"/><rect x="20" y="6" width="5" height="3" rx="1.5" fill="#ffe066"/></svg>',
  bike: '<svg width="22" height="46" viewBox="0 0 22 46" aria-hidden="true"><rect x="7" y="1" width="8" height="8" rx="3" fill="#333" stroke="#fff" stroke-width="1.5"/>' +
        '<rect x="7" y="37" width="8" height="8" rx="3" fill="#333" stroke="#fff" stroke-width="1.5"/><rect x="5" y="8" width="12" height="31" rx="6" fill="#1a73e8" stroke="#fff" stroke-width="2"/>' +
        '<rect x="1" y="11" width="20" height="3" rx="1.5" fill="#0b2f73"/><circle cx="11" cy="24" r="4" fill="#ffd21f" stroke="#0b2f73" stroke-width="1.5"/></svg>',
  walk: '<span class="wk">🚶</span>'
};
function setVeh(on) {
  if (!meEl) return;
  meEl.classList.toggle('veh', !!on);
  var v = meEl.querySelector('.vh'); if (v) v.innerHTML = on ? (VEH[rMode] || VEH.car) : '';
}
$('rGo').onclick = function () {
  setTimeout(function () { setVeh(true); }, 0);
  if (!route || !route.data) return;
  nav = { step: 1, said: {}, off: 0, last: 0, follow: true }; $('recenter').hidden = true;
  document.body.classList.add('nav'); $('navb').hidden = false; $('navf').hidden = false;
  if (popup) popup.remove();
  ensureWatch();
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {}); } catch (e) {}
  var first = route.steps[1] || route.steps[0];
  var s0 = route.steps[0];
  speakFn(function (L) { return instr(s0, L) + '. ' + T('in_m', { d: fmtDist(s0.distance, L) }, L) + ' ' + instr(first, L); });
  if (myPos) navTick(myPos); else { var c = route.from, s1 = snapAhead(c, route.data.geometry.coordinates); map.easeTo({ center: c, bearing: s1.br != null ? s1.br : map.getBearing(), zoom: 17.6, pitch: tilted ? 65 : 0, duration: 900, padding: { top: Math.round(innerHeight * 0.45), bottom: 0, left: 0, right: 0 } }); paintBanner(first, route.steps[0].distance); }
};
function paintBanner(s, d) {
  $('nArw').textContent = arrow(s); $('nDist').textContent = fmtDist(d); $('nTxt').textContent = instr(s);
}
/* रास्ते पर सबसे पास का बिंदु + आगे ~35 मीटर वाले रास्ते की दिशा */
function snapAhead(p, line) {
  var k = Math.cos(p[1] * Math.PI / 180) * 111320, best = Infinity, bi = 1, bt = 0;
  for (var i = 1; i < line.length; i++) {
    var ax = (line[i - 1][0] - p[0]) * k, ay = (line[i - 1][1] - p[1]) * 110540, bx = (line[i][0] - p[0]) * k, by = (line[i][1] - p[1]) * 110540;
    var dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
    var x = ax + t * dx, y = ay + t * dy, d = x * x + y * y; if (d < best) { best = d; bi = i; bt = t; }
  }
  var a = line[bi - 1], b = line[bi], sp = [a[0] + (b[0] - a[0]) * bt, a[1] + (b[1] - a[1]) * bt];
  var left = 35, cur = sp, j = bi, ahead = b;
  while (j < line.length) { var seg = hav(cur, line[j]); if (seg >= left) { var f = left / seg; ahead = [cur[0] + (line[j][0] - cur[0]) * f, cur[1] + (line[j][1] - cur[1]) * f]; break; } left -= seg; cur = line[j]; ahead = line[j]; j++; }
  return { pt: sp, off: Math.sqrt(best), br: hav(sp, ahead) > 2 ? bearingTo(sp, ahead) : null };
}
function navTick(ll, jump) {
  if (!nav || !route || !route.data) return;
  var line = route.data.geometry.coordinates, now = Date.now();
  if (hav(ll, route.to) < 25) { paintBanner(route.steps[route.steps.length - 1], 0); speakFn(function (L) { return T('arrived', null, L); }); status(T('arrived')); stopNav(); return; }
  var off = distToLine(ll, line);
  if (off > 45) { nav.off++; if (nav.off >= 2 && now - nav.last > 12000) { nav.last = now; nav.off = 0; status(T('reroute')); speakFn(function (L) { return T('reroute', null, L); }); route.from = ll; clearVia(); calcRoute(true).then(function () { if (nav) { nav.step = 1; nav.said = {}; } }); } }
  else nav.off = 0;
  var s = route.steps[nav.step];
  while (s && hav(ll, s.maneuver.location) < 18 && nav.step < route.steps.length - 1) { nav.step++; s = route.steps[nav.step]; }
  if (!s) return;
  var d = hav(ll, s.maneuver.location);
  paintBanner(s, d);
  var key = nav.step;
  if (d < 170 && d > 45 && !nav.said[key + 'f']) { nav.said[key + 'f'] = 1; speakFn(function (L) { return T('in_m', { d: fmtDist(d, L) }, L) + ' ' + instr(s, L); }); }
  if (d <= 40 && !nav.said[key + 'n']) { nav.said[key + 'n'] = 1; speakFn(function (L) { return T('now', null, L) + ' ' + instr(s, L); }); }
  var rem = d; for (var i = nav.step; i < route.steps.length; i++) rem += i === nav.step ? 0 : route.steps[i].distance;
  $('nRem').textContent = fmtTime(route.data.duration * Math.min(1, rem / Math.max(1, route.data.distance)));
  $('nEta').textContent = fmtDist(rem) + ' ' + T('rem');
  /* दिशा रास्ते से (कंपास से नहीं) → आगे वाला रास्ता हमेशा स्क्रीन पर सामने/ऊपर */
  var sn = snapAhead(ll, line), on = sn.off < 30, c = on ? sn.pt : ll;
  var br = on && sn.br != null ? sn.br : (moveHeading != null ? moveHeading : (sn.br != null ? sn.br : map.getBearing()));
  if (me) { me.setLngLat(c); me.setRotation(br); if (meEl) { meEl.classList.add('head'); if (!meEl.classList.contains('veh')) setVeh(true); } }
  if (nav.follow) map.easeTo({ center: c, bearing: br, pitch: tilted ? 65 : 0, zoom: 17.6, duration: jump ? 700 : 1000, padding: { top: Math.round(innerHeight * 0.45), bottom: 0, left: 0, right: 0 } });
}
function stopNav() {
  setVeh(false);
  nav = null; clearTimeout(rcTimer); $('recenter').hidden = true; document.body.classList.remove('nav'); $('navb').hidden = true; $('navf').hidden = true;
  try { if (wake) wake.release(); } catch (e) {} wake = null;
  map.easeTo({ padding: { top: 0, bottom: 0, left: 0, right: 0 }, pitch: tilted ? 55 : 0, duration: 600 });
  if (route && route.data) fitRoute();
}
$('nStop').onclick = function () { if (window.speechSynthesis) speechSynthesis.cancel(); stopNav(); };
$('nVoice').onclick = function () { voice = !voice; this.textContent = voice ? '🔊' : '🔇'; status(T(voice ? 'voice_on' : 'voice_off')); if (!voice && window.speechSynthesis) speechSynthesis.cancel(); };

/* =========================================================
   दूसरे पेज से आए: map.html?to=lat,lng&n=नाम  या  ?q=पता&n=नाम
   ========================================================= */
function handleUrl() {
  var P = new URLSearchParams(location.search), n = (P.get('n') || '').slice(0, 120), a = (P.get('a') || '').slice(0, 200);
  var to = (P.get('to') || '').split(',').map(Number);
  if (to.length === 2 && isFinite(to[0]) && isFinite(to[1]) && Math.abs(to[0]) <= 90 && Math.abs(to[1]) <= 180) {
    var ll = [to[1], to[0]];
    map.jumpTo({ center: ll, zoom: 16 });
    openRoute({ ll: ll, name: n || a });
    return;
  }
  var q = (P.get('q') || '').slice(0, 200);
  if (q) {
    status(T('routing'));
    geocode(q).then(function (ll) {
      if (!ll) { status(T('addr_fail'), true); $('q').value = n || q; runSearch(n || q); return; }
      map.jumpTo({ center: ll, zoom: 16 });
      openRoute({ ll: ll, name: n || q });
    }).catch(function () { status(T('route_fail'), true); });
  }
}

/* छोटा भाषा बटन (ऊपर + नेविगेशन पट्टी) */
function langShort() { var c = lang(), L = (window.PB && PB.langs || []).filter(function (x) { return x[0] === (PB.lang && PB.lang()); })[0]; return L ? Array.from(L[1]).slice(0, L[0] === 'en' ? 2 : 2).join('') : (c === 'en' ? 'En' : 'हि'); }
function paintLangBtns() { var s = langShort(); document.querySelectorAll('.lgt').forEach(function (e) { e.textContent = s; }); }
(function () {
  var P = $('lgp');
  document.querySelectorAll('[data-lg]').forEach(function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      if (!P.hidden) { P.hidden = true; return; }
      var cur = window.PB && PB.lang && PB.lang();
      P.innerHTML = ((window.PB && PB.langs) || []).map(function (L) { return '<button type="button" data-l="' + L[0] + '"' + (L[0] === cur ? ' class="on"' : '') + '><span>' + L[1] + '</span><small>' + L[2] + '</small></button>'; }).join('');
      var r = b.getBoundingClientRect(), w = 210;

  P.onclick = function (e) { var x = e.target.closest('[data-l]'); if (!x) return; e.stopPropagation(); P.hidden = true; if (window.PB && PB.set) PB.set(x.dataset.l); };
  document.addEventListener('click', function () { P.hidden = true; });
  paintLangBtns();
})();
if (window.PB && PB.onChange) PB.onChange(function () { applyTexts(); paintLangBtns(); if (!$('recenter').hidden) showRecenter(); if (nav && route && route.data) { var sx = route.steps[nav.step]; if (sx) paintBanner(sx, myPos ? hav(myPos, sx.maneuver.location) : sx.distance); } drawChips(); if (route && route.data) fillSheet(); });
};
