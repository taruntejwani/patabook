<style>
/* दुकानदार की अपनी mini website (shop.html?slug=...) — business.html के "View all" से खुलती है */
:root{--blue:#1a73e8;--navy:#0b2f73;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5;--gold:#B58A2A;--green:#1e9e57;--bg:#f6f8fc}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

/* ऊपर की पतली पट्टी */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.tb{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tb img{width:34px;height:34px;border-radius:10px;object-fit:cover;flex:none;background:#fff;box-shadow:0 0 0 1px var(--line)}
.tb .ini{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font:800 17px/1 Arial,sans-serif;background:linear-gradient(160deg,#2f6fd6,#123568)}
.tb b{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:17px;cursor:pointer}
#pbLang{flex:none}

/* Hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0b2f73 0%,#123f96 55%,#1a73e8 100%)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;filter:saturate(1.1)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,rgba(255,210,31,.18),transparent 55%),linear-gradient(180deg,rgba(6,22,56,.15),rgba(6,22,56,.55))}
.hero .wrap{position:relative;z-index:1;padding-top:34px;padding-bottom:34px;display:flex;gap:18px;align-items:center}
.hlogo{position:relative;flex:none}
.hlogo img,.hlogo .ini{width:96px;height:96px;border-radius:24px;object-fit:cover;display:block;background:#fff;box-shadow:0 0 0 3px #fff,0 10px 26px rgba(0,0,0,.3)}
.hlogo .ini{display:grid;place-items:center;font:800 44px/1 Arial,sans-serif;color:#fff;background:linear-gradient(160deg,#2f6fd6,#123568)}
.hlogo.gold img,.hlogo.gold .ini{box-shadow:0 0 0 3px #fff,0 0 0 6px #e2b34c,0 10px 26px rgba(0,0,0,.3)}
.hlogo .crn{position:absolute;right:-14px;top:-14px;width:38px;height:38px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.hname{min-width:0}
.hname h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.4px;word-break:break-word}
.hname .sub{margin-top:6px;font-size:14.5px;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25)}
.chip.gold{background:linear-gradient(135deg,#f6e3a8,#d9b257 45%,#B58A2A);color:#123568;border:0}
.chip.op{background:#e3f7ea;color:#137333;border:0}.chip.cl{background:#fde8e7;color:#b42318;border:0}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
@media(max-width:560px){.hero .wrap{flex-direction:column;text-align:center;padding-top:28px;padding-bottom:26px}.chips{justify-content:center}.hname h1{font-size:25px}}

/* Quick actions */
.qa{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:-22px;position:relative;z-index:2}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 4px;font-size:12.5px;font-weight:800;color:var(--navy);box-shadow:0 6px 18px rgba(11,47,115,.10);cursor:pointer;text-align:center}
.qa span{font-size:21px;line-height:1}
.qa .dis{opacity:.45;pointer-events:none;filter:grayscale(1)}

/* Section nav */
.snav{position:sticky;top:56px;z-index:15;background:var(--bg);padding:12px 0 8px}
.snav .in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.snav .in::-webkit-scrollbar{display:none}
.snav a{flex:none;font-size:13.5px;font-weight:700;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.snav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}

section.blk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin:12px 0 16px;box-shadow:0 2px 10px rgba(11,47,115,.04);scroll-margin-top:118px}
h2{font-size:19px;color:var(--navy);display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
h2 small{font-size:13px;color:var(--muted);font-weight:600}

/* Products */
.pgr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.pgr{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.pgr{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pcd{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.pim{position:relative;border:0;padding:0;aspect-ratio:1;background:#0d0d10;cursor:zoom-in;display:block;width:100%}.pim img{width:100%;height:100%;object-fit:contain;display:block}
.psz{position:absolute;left:7px;top:7px;background:rgba(255,255,255,.95);color:#123568;font-size:11px;font-weight:900;border-radius:999px;padding:2px 8px}
.pbs{position:absolute;right:7px;top:7px;background:linear-gradient(135deg,#f6e3a8,#d9b257 45%,#B58A2A);color:#123568;font-size:10px;font-weight:900;border-radius:999px;padding:2px 7px}
.pout{position:absolute;left:0;right:0;bottom:0;background:rgba(197,34,31,.92);color:#fff;font-size:11.5px;font-weight:800;padding:4px;text-align:center}
.pbd{padding:10px 10px 11px;display:flex;flex-direction:column;gap:5px;flex:1}.pbd b{font-size:14px;line-height:1.3}
.pmr{font-size:15px;font-weight:900;color:#137333}.pmr small{font-size:11px;color:var(--muted);font-weight:600}
.pask{margin-top:auto;border:0;border-radius:12px;padding:9px 6px;background:#25a244;color:#fff;font-weight:800;font-size:13px;cursor:pointer}
.pask.big{width:100%;margin-top:14px;padding:13px;font-size:15px}
.empty{color:var(--muted);font-size:14px;line-height:1.6}

/* Product sheet + lightbox */
.psh{position:fixed;inset:0;z-index:9998;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center}
.psh .pin{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.psh{align-items:center}.psh .pin{border-radius:22px}}
.psh .px{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:15px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pbig{border-radius:14px;overflow:hidden;background:#0d0d10;aspect-ratio:1;max-height:56vh;margin:0 auto}.pbig img{width:100%;height:100%;object-fit:contain;display:block}
.psh h3{font-size:19px;margin-top:12px}.pmeta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:14px;font-weight:700;color:#123568}
.pft{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pft span{background:#f1f4fa;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:640px){.gal{grid-template-columns:repeat(4,1fr)}}
.gal button{border:0;padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:#eef3fd;cursor:zoom-in}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.lbx{position:fixed;inset:0;z-index:9999;background:rgba(5,10,20,.92);display:flex;align-items:center;justify-content:center}.lbx img{max-width:96vw;max-height:86vh;border-radius:10px}.lbx button{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}.lbx .x{top:14px;right:14px}.lbx .pv{left:10px;top:50%}.lbx .nx{right:10px;top:50%}

/* About */
.rows{border-top:1px solid #eef1f6}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #eef1f6;font-size:14.5px;line-height:1.5}
.row span{flex:0 0 120px;color:var(--muted)}.row b{font-weight:600;flex:1;min-width:0;word-break:break-word}.row a{color:var(--blue)}
@media(max-width:480px){.row span{flex-basis:96px}}

/* Visit */
.addr{display:flex;gap:10px;align-items:flex-start;background:#f7f9fd;border:1px solid var(--line);border-radius:16px;padding:13px}
.addr .pn{font-size:20px;line-height:1.2}.addr b{display:block;font-size:15.5px;line-height:1.45}.addr small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.smap{position:relative;display:block;height:190px;border-radius:16px;overflow:hidden;margin-top:12px;background:#e5e9ef;border:1px solid var(--line)}
.smap .tl{position:absolute;display:grid;grid-template-columns:repeat(3,256px)}.smap .tl img{width:256px;height:256px;display:block}
.smap .mp{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:36px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.smap .ma{position:absolute;right:6px;bottom:4px;font-size:9.5px;color:#555;background:#ffffffc0;padding:0 4px;border-radius:4px}
.vbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.vbtn a{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px;font-weight:800;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.vbtn a.p{background:var(--blue);border-color:var(--blue);color:#fff}

/* Contact */
.num{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;margin-bottom:10px}
.num .l{flex:1;min-width:0}.num small{display:block;color:var(--muted);font-size:12px}.num b{font-size:17px;letter-spacing:.02em}
.num a{flex:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;color:#fff;background:var(--blue)}.num a.w{background:var(--green)}
.num.dir .l{min-width:0}.num.dir .lk{display:flex;align-items:center;gap:6px;margin-top:2px}.num.dir .lk a{flex:0 1 auto;min-width:0;background:none;padding:0;border-radius:0;color:var(--blue);font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num.dir .cpy{flex:none;border:1px solid var(--line);background:#f4f7fc;border-radius:8px;width:30px;height:28px;font-size:15px;cursor:pointer}.num.dir .cpt{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:#5b6475;cursor:pointer}.num.dir a.d{background:var(--navy)}
.cnote{color:var(--muted);font-size:13.5px;line-height:1.5}

/* नीचे चिपका Call / WhatsApp */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock a{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px;font-weight:800;font-size:15px;color:#fff;background:var(--blue)}
.dock a.w{background:#25a244}
.dock[hidden]{display:none}

.shr{display:flex;align-items:center;gap:12px;width:100%;background:linear-gradient(135deg,#e3f7ea,#f4fbf6);border:1px solid #c9ead4;border-radius:18px;padding:14px;margin:0 0 10px;text-decoration:none;color:var(--ink)}
.shr .ic{flex:none;width:44px;height:44px;border-radius:14px;background:#1e9e57;color:#fff;display:grid;place-items:center;font-size:22px}
.shr b{display:block;font-size:15px}.shr small{color:var(--muted);font-size:12.5px}.shr .go{margin-left:auto;background:#1e9e57;color:#fff;font-weight:800;border-radius:999px;padding:9px 14px;font-size:13.5px;white-space:nowrap}
.shr.crd{background:linear-gradient(135deg,#e8f0fe,#f4f8ff);border-color:#c6d8fb;font:inherit;text-align:left;cursor:pointer}.shr.crd .ic{background:var(--blue)}.shr.crd .go{background:var(--blue)}
.near{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.near::-webkit-scrollbar{display:none}
.near a{flex:0 0 150px;border:1px solid var(--line);border-radius:16px;padding:11px;background:#fff;text-decoration:none;color:var(--ink)}
.near .i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#eef3fd;overflow:hidden}.near .i img{width:100%;height:100%;object-fit:cover}
.near b{display:block;font-size:13.5px;margin-top:8px;line-height:1.25}.near small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.near em{display:inline-block;font-style:normal;margin-top:6px;background:#e8f0fe;color:var(--blue);font-weight:800;font-size:11.5px;border-radius:999px;padding:2px 8px}
.shr{font:inherit;text-align:left;cursor:pointer}
.vflag{display:flex;flex-direction:column;gap:3px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#fff7e6;border:1px solid #ffd591;color:#874d00;font-size:14px}
.lnk[hidden]{display:none}.lnk{display:block;text-align:center;margin:6px 0;font-size:14px;font-weight:700;color:var(--blue)}
.rep{display:block;margin:6px auto 0;border:0;background:none;padding:6px 10px;font-size:13px;color:#b42318;cursor:pointer}
.pw{text-align:center;color:var(--muted);font-size:12.5px;padding:8px 16px 22px;line-height:1.7}
.pw a{color:var(--blue);font-weight:700}
.pw .pb{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--navy);font-weight:800}
.pw .pb img{width:16px;height:auto}
.note{color:var(--muted);padding:60px 0;text-align:center}
.ctoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#12141c;color:#fff;font-size:13.5px;font-weight:700;border-radius:999px;padding:9px 16px;z-index:999}

const DAY_HI={Sunday:"रविवार",Monday:"सोमवार",Tuesday:"मंगलवार",Wednesday:"बुधवार",Thursday:"गुरुवार",Friday:"शुक्रवार",Saturday:"शनिवार"};
function hm12(t){if(!/^\d{2}:\d{2}$/.test(t||""))return "";let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap;}
function hoursText(b){const h=line(b,"Hours"),off=line(b,"Closed"),m=h.match(/^(\d{2}:\d{2})-(\d{2}:\d{2})$/);if(!m&&!off)return "";
  let t=m?hm12(m[1])+" – "+hm12(m[2]):"";if(off)t+=(t?"\n":"")+(EN()?"🗓️ "+off+" off":"🗓️ "+(DAY_HI[off]||off)+" छुट्टी");return t;}
function openStatus(b){const h=line(b,"Hours"),off=line(b,"Closed"),m=h.match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);if(!m)return null;
  const a=+m[1]*60+ +m[2],z=+m[3]*60+ +m[4],now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"})),cur=now.getHours()*60+now.getMinutes();
  const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],today=DN[now.getDay()];
  const isOpen=today!==off&&(a<=z?cur>=a&&cur<z:cur>=a||cur<z);
  if(isOpen)return {open:true,t:L("अभी खुला है · "+hm12(m[3]+":"+m[4])+" तक","Open now · till "+hm12(m[3]+":"+m[4]))};
  if(today!==off&&cur<a)return {open:false,t:L("अभी बंद · आज "+hm12(m[1]+":"+m[2])+" पर खुलेगा","Closed · opens today "+hm12(m[1]+":"+m[2]))};
  for(let d=1;d<=7;d++){const dn=DN[(now.getDay()+d)%7];if(dn===off)continue;const w=d===1?L("कल","tomorrow"):L((DAY_HI[dn]||dn)+" को",dn);
    return {open:false,t:L("अभी बंद · "+w+" "+hm12(m[1]+":"+m[2])+" पर खुलेगा","Closed · opens "+w+" "+hm12(m[1]+":"+m[2]))};}
  return {open:false,t:L("अभी बंद","Closed now")};}
function tcase(w){return /^[A-Z]{4,}$/.test(w)?w[0]+w.slice(1).toLowerCase():w;}
function cityOf(b){return line(b,"City")||String(b.address||"").split(",").map(s=>s.trim()).filter(Boolean).pop()||"";}
function fullAddr(b){const city=cityOf(b);let parts=String(b.address||"").split(",").map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean);
  parts=parts.filter((x,i)=>!parts.some((y,j)=>j!==i&&y.length>x.length&&y.toLowerCase().includes(x.toLowerCase()))&&parts.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);
  let t=parts.join(", ");[line(b,"Area"),city].forEach(x=>{x=String(x||"").trim();if(x&&!t.toLowerCase().includes(x.toLowerCase()))t+=(t?", ":"")+x;});
  t=t.split(" ").map(tcase).join(" ");const pin=line(b,"PIN")||line(b,"Pincode");if(/^[1-9]\d{5}$/.test(pin)&&!t.includes(pin))t+=" – "+pin;return t;}
function pbDir(b){const n=encodeURIComponent(b.name||""),a=encodeURIComponent(b.address||"");if(b.latitude!=null&&b.longitude!=null&&isFinite(+b.latitude)&&isFinite(+b.longitude)&&+b.latitude)return "map.html?to="+(+b.latitude)+","+(+b.longitude)+"&n="+n+"&a="+a;return b.address?"map.html?q="+a+"&n="+n:"";}
function gmapsUrl(b){const la=+b.latitude,ln=+b.longitude;return "https://www.google.com/maps/search/?api=1&query="+(la&&ln?la+","+ln:encodeURIComponent((b.name||"")+", "+(b.address||"")));}
function staticMap(b,href){const la=+b.latitude,ln=+b.longitude;if(!la||!ln)return "";
  const z=16,n=2**z,xf=(ln+180)/360*n,yr=la*Math.PI/180,yf=(1-Math.log(Math.tan(yr)+1/Math.cos(yr))/Math.PI)/2*n,x=Math.floor(xf),y=Math.floor(yf);
  let t="";for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)t+='<img alt="" loading="lazy" src="https://tile.openstreetmap.org/'+z+'/'+(x+dx)+'/'+(y+dy)+'.png">';
  return '<a class="smap" data-pbh="addr" id="smap" href="'+esc(href||"#")+'" data-fx="'+(xf-x)+'" data-fy="'+(yf-y)+'"><div class="tl">'+t+'</div><span class="mp">📍</span><span class="ma">© OpenStreetMap</span></a>';}
function placeMap(){const m=document.getElementById("smap");if(!m)return;const t=m.querySelector(".tl");t.style.left=(m.clientWidth/2-(256+ +m.dataset.fx*256))+"px";t.style.top=(m.clientHeight/2-(256+ +m.dataset.fy*256))+"px";}

async function load(){
  const app=document.getElementById("app");
  if(!slug){app.innerHTML='<p class="note">'+L("दुकान नहीं मिली।","Shop not found.")+'</p>';return;}
  const COLS="name,slug,address,description,category,website,is_verified,rating,review_count,latitude,longitude";
  const tries=[COLS+",business_code,home_service,logo_url",COLS+",business_code,home_service",COLS];
  try{
    let r,rows=null;
    for(const sel of tries){const u=new URL(SB+"/rest/v1/businesses");u.searchParams.set("select",sel);u.searchParams.set("slug","eq."+slug);u.searchParams.set("limit","1");
      r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(r.ok){rows=await r.json();break;}}
    if(!rows||!rows.length){app.innerHTML='<p class="note">'+L("यह दुकान अभी उपलब्ध नहीं है।","This shop is not available right now.")+'<br><br><a href="index.html" style="color:#1a73e8;font-weight:700">PataBook ›</a></p>';return;}
    B=rows[0];
    document.title=B.name+" — "+(B.category||"Shop")+" | PataBook";
    try{document.querySelector('meta[name="description"]').setAttribute("content",(B.name+" — "+[B.category,cityOf(B)].filter(Boolean).join(", ")+". Products, photos, address & WhatsApp.").slice(0,300));}catch(_){}
    render();

    loadNear();loadVacFlag();loadOwner();

  }catch(e){app.innerHTML='<p class="note">'+L("इंटरनेट की दिक्कत — दोबारा कोशिश करें।","Connection problem — please try again.")+'</p>';}

async function loadPrem(){
  if(!(window.PB_SITE&&PB_SITE.premium))return;
  try{const r=await fetch(SB+"/rest/v1/rpc/pb_premium_status",{method:"POST",headers:H,body:JSON.stringify({p_slugs:[slug]})});if(!r.ok)return;const j=await r.json();PREM=!!(j&&j[slug]);}catch(e){return;}

    fetch(SB+"/rest/v1/rpc/pb_shop_photos_public",{method:"POST",headers:H,body:JSON.stringify({p_slug:slug})}).then(r=>r.ok?r.json():[]).then(j=>{GAL=j||[];}).catch(()=>{GAL=[];}),
    fetch(SB+"/rest/v1/rpc/pb_shop_products_public",{method:"POST",headers:H,body:JSON.stringify({p_slug:slug})}).then(r=>r.ok?r.json():[]).then(j=>{PRODS=j||[];}).catch(()=>{PRODS=[];})
  ]);
}
async function loadContact(){
  try{const r=await fetch(SB+"/rest/v1/rpc/pb_public_contact",{method:"POST",headers:H,body:JSON.stringify({p_slug:slug})});
    if(r.ok){const j=await r.json(),c=Array.isArray(j)?j[0]:j;CT=c&&(c.phone||c.whatsapp)?{k:"ok",phone:c.phone,whatsapp:c.whatsapp}:{k:"off"};return;}
  }catch(e){}
  /* public तरीका नहीं चला: login हो तो पुराने तरीके (pb_contact) से — बिल्कुल business.html जैसा */
  CT={k:"off"};
