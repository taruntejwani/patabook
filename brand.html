<script>
const SB="https://kkvbpzysktozghnxplxv.supabase.co",KEY="sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8";
(function(){
/* PataBook Platinum — दुकान की अपनी website (100 में से चुना हुआ design, My Shop → Gallery → Website Design)
   ?d=1-100 : सिर्फ़ झलक (preview) — कुछ save नहीं होता */
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const Q=new URLSearchParams(location.search),slug=Q.get("slug")||"",PV=+Q.get("d")||0;
const IMG_RX=/^https:\/\/kkvbpzysktozghnxplxv\.supabase\.co\/storage\/v1\/object\/public\/shop-logos\//;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const EN=()=>{try{return (localStorage.getItem("pb-lang")||"en")!=="hi";}catch(e){return true;}};
const L=(hi,en)=>EN()?en:hi;
const rpc=(fn,args)=>fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(args)}).then(r=>r.ok?r.json():null).catch(()=>null);
const line=(b,k)=>{const m=String(b.description||"").match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
const DAY_HI={Sunday:"रविवार",Monday:"सोमवार",Tuesday:"मंगलवार",Wednesday:"बुधवार",Thursday:"गुरुवार",Friday:"शुक्रवार",Saturday:"शनिवार"};
const TYPE_HI={Manufacturer:"निर्माता",Wholesaler:"थोक विक्रेता",Wholesale:"थोक विक्रेता",Retailer:"खुदरा दुकान",Retail:"खुदरा दुकान",Distributor:"वितरक",Trader:"व्यापारी","Service Provider":"सेवा देने वाले"};
const hm12=t=>{if(!/^\d{2}:\d{2}$/.test(t||""))return "";let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap;};
const stdUrl=()=>"shop.html?slug="+encodeURIComponent(slug)+"&std=1";
let B=null,PRODS=[],GAL=[],CAPS={},COVER="",CT=[],DSN=1,VAC=null,INTROSEL=null,FIRST=true;

function hoursTxt(b){const m=line(b,"Hours").match(/^(\d{2}:\d{2})-(\d{2}:\d{2})$/),off=line(b,"Closed");let t=m?hm12(m[1])+" – "+hm12(m[2]):"";
  if(off)t+=(t?"\n":"")+L((DAY_HI[off]||off)+" को बंद",off+" closed");return t;}
function openSt(b){const m=line(b,"Hours").match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/),off=line(b,"Closed");if(!m)return null;
  const a=+m[1]*60+ +m[2],z=+m[3]*60+ +m[4],now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"})),cur=now.getHours()*60+now.getMinutes();
  const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],td=DN[now.getDay()];
  const op=td!==off&&(a<=z?cur>=a&&cur<z:cur>=a||cur<z);
  return op?{o:1,t:L("अभी खुला है · "+hm12(m[3]+":"+m[4])+" तक","Open now · until "+hm12(m[3]+":"+m[4]))}:{o:0,t:L("अभी बंद है","Closed now")};}
function cityOf(b){return line(b,"City")||String(b.address||"").split(",").map(s=>s.trim()).filter(Boolean).pop()||"";}
function fullAddr(b){let t=String(b.address||"").replace(/\s+/g," ").trim();const ar=line(b,"Area"),ci=cityOf(b);
  if(ar&&!t.toLowerCase().includes(ar.toLowerCase())){const k=ci?t.toLowerCase().indexOf(ci.toLowerCase()):-1;t=k>0?t.slice(0,k)+ar+", "+t.slice(k):t+(t?", ":"")+ar;}
  if(ci&&!t.toLowerCase().includes(ci.toLowerCase()))t+=(t?", ":"")+ci;return t;}
function dirUrl(b){const n=encodeURIComponent(b.name||""),a=encodeURIComponent(b.address||"");if(+b.latitude&&+b.longitude)return "map.html?to="+(+b.latitude)+","+(+b.longitude)+"&n="+n+"&a="+a;return b.address?"map.html?q="+a+"&n="+n:"";}
const offerOf=p=>{for(const f of (p.feats||[])){const m=String(f).match(/^Offer:\s*(\d+)/i);if(m)return +m[1];}return 0;};
const hid=k=>!!(window.PBHide&&PBHide.has(k));
const PF=f=>!!(window.PBPlan&&PBPlan.has(slug,f));
function fail(t){try{const m=document.createElement("meta");m.name="robots";m.content="noindex";document.head.appendChild(m);}catch(_){}   /* दुकान नहीं मिली → Google इसे "Soft 404" न गिने */
  document.getElementById("app").innerHTML='<div class="msg"><div>'+esc(t)+'<br><br><a href="index.html">PataBook ›</a></div></div>';}

async function load(){
  if(!slug)return fail(L("दुकान नहीं मिली।","Shop not found."));
  const u=new URL(SB+"/rest/v1/businesses");u.searchParams.set("select","name,slug,address,description,category,website,is_verified,rating,review_count,latitude,longitude,logo_url,business_code");u.searchParams.set("slug","eq."+slug);u.searchParams.set("limit","1");
  let rows=null;try{const r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});rows=r.ok?await r.json():null;}catch(e){}
  if(!rows||!rows.length)return fail(L("यह दुकान अभी उपलब्ध नहीं है।","This shop is not available right now."));
  B=rows[0];
  /* सिर्फ़ Platinum: बाकी plan वालों को उनका साधारण पेज */
  let tier="free";try{if(window.PBPlan){await PBPlan.load([slug]);tier=PBPlan.tier(slug);}}catch(e){}
  if(tier!=="platinum"){try{localStorage.removeItem("pbd_"+slug);}catch(e){}location.replace(stdUrl());return;}   /* पुराना "Platinum design" निशान मिटाओ — वरना shop → brand का नीला loader बार-बार दिखता है */
  if(window.PBHide)PBHide.apply(B.description);
  const [cv,pr,ph,cp,nums,dz,vs,it]=await Promise.all([rpc("pb_profile_banner_get",{p_slug:slug}),rpc("pb_shop_products_public",{p_slug:slug}),rpc("pb_shop_photos_public",{p_slug:slug}),rpc("pb_photo_captions",{p_slug:slug}),rpc("pb_public_numbers",{p_slug:slug}),PV?null:rpc("pb_design_get",{p_slug:slug}),rpc("pb_vacancy_status",{p_slugs:[slug]}),rpc("pb_intro_get",{p_slug:slug})]);
  COVER=typeof cv==="string"&&IMG_RX.test(cv)?cv:"";
  VAC=vs&&vs[slug]?vs[slug]:null;INTROSEL=it&&+it.scene>=1&&+it.scene<=50?{scene:+it.scene,style:it.style||"silver"}:null;
  PRODS=(Array.isArray(pr)?pr:[]).filter(p=>p&&p.name);
  GAL=(Array.isArray(ph)?ph:[]).filter(x=>IMG_RX.test(x));
  CAPS={};(Array.isArray(cp)?cp:[]).forEach(c=>{if(c&&c.url&&c.caption)CAPS[c.url]=c.caption;});
  CT=(Array.isArray(nums)?nums:[]).sort((a,b)=>a.slot-b.slot).map(x=>String(x.phone||"").replace(/\D/g,"").slice(-10)).filter(x=>/^\d{10}$/.test(x));
  /* कोई design नहीं चुना (या हटा दिया) → दुकान का साधारण page */
  if(!PV&&!(+dz>=1&&+dz<=100)){try{localStorage.removeItem("pbd_"+slug);}catch(e){}location.replace(stdUrl()+location.hash);return;}
  if(!PV)try{localStorage.setItem("pbd_"+slug,"1");}catch(e){}
  DSN=PV||+dz;
  document.title=B.name+" — "+(B.category||"")+" | PataBook";
try{if(B&&B.slug){const k="pb-seen",a=(JSON.parse(localStorage.getItem(k)||"[]")||[]).filter(x=>x&&x.s!==B.slug);a.unshift({s:B.slug,n:String(B.name||"").slice(0,80),c:String(B.category||"").slice(0,40),t:Date.now()});localStorage.setItem(k,JSON.stringify(a.slice(0,8)));}}catch(_){}   /* 👀 हाल ही में देखी (सिर्फ़ इसी फ़ोन में) */
  try{const c=document.querySelector('link[rel="canonical"]')||document.head.appendChild(Object.assign(document.createElement("link"),{rel:"canonical"}));c.href="https://patabook.in/shop?slug="+encodeURIComponent(slug);}catch(e){}
  render();
}
function data(){
  const b=B,en=EN(),city=cityOf(b),sub=line(b,"Subcategory"),hrs=hid("hours")?"":hoursTxt(b),type=line(b,"Type"),typeT=en?type:(TYPE_HI[type]||type);
  const email=line(b,"Email"),web=b.website||line(b,"Website"),ig=line(b,"Instagram"),fb=line(b,"Facebook"),gst=/^yes$/i.test(line(b,"GST-Verified"))&&!hid("gst");
  const waNo=CT[0]?"91"+CT[0]:"",cat=[sub,b.category].filter((x,i,a)=>x&&a.indexOf(x)===i).join(" · ");
  const P=hid("prods")?[]:PRODS.map(p=>({name:p.name,size:p.size||"",mrp:+p.mrp||0,offer:offerOf(p),best:!!p.best,stock:p.stock,img:IMG_RX.test(p.img||"")?p.img:"",feats:(p.feats||[]).filter(f=>!/^Offer:/i.test(f))}));
  return {en,name:b.name,cat:sub||b.category||"",city,sub:[sub||b.category,city].filter(Boolean).join(" · "),services:line(b,"Services"),
    open:hid("hours")?null:openSt(b),ph:CT[0]?"+91"+CT[0]:"",nums:CT,waLink:t=>waNo?"https://wa.me/"+waNo+"?text="+encodeURIComponent(t):"",
    email:/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)&&!hid("web")?email:"",web:/^https?:\/\//i.test(web||"")&&!hid("web")?web:"",
    ig:/^https:\/\/www\.instagram\.com\//.test(ig)?ig:"",fb:/^https:\/\/www\.facebook\.com\//.test(fb)?fb:"",
    addr:hid("addr")?"":fullAddr(b),landmark:hid("addr")?"":line(b,"Landmark"),hours:hrs,dir:hid("addr")?"":dirUrl(b),lat:hid("addr")?0:+b.latitude,lng:hid("addr")?0:+b.longitude,
    rating:+b.rating||0,count:+b.review_count||0,products:P,gallery:hid("photos")?[]:GAL.map(u=>({src:u,cap:CAPS[u]||""})),cover:COVER||(!hid("photos")&&GAL[0])||"",
    type:typeT,facts:[[L("मालिक","Owner"),line(b,"Owner")],["PataBook",b.is_verified?L("सत्यापित दुकान","Verified shop"):""],[L("होम डिलीवरी","Home delivery"),/^yes$/i.test(line(b,"Delivery"))?L("हाँ","Yes"):""],[L("व्यवसाय","Business"),typeT],[L("कैटेगरी","Category"),cat],[L("समय","Hours"),hrs],["GST",gst?L("सत्यापित","Verified"):""]].filter(x=>x[1]),
    logo:PF("logo")&&!hid("logo")&&IMG_RX.test(b.logo_url||"")?b.logo_url:"",verified:!!b.is_verified,
    tools:{hire:PF("hiring")&&!!VAC&&!hid("vac"),card:PF("card"),share:true,report:true},
    rateInline:true,rateUrl:"",stdUrl:"",pin:"pin.png",   /* रेटिंग इसी पेज पर; पुराने page का link नहीं */
    onLang:()=>{render();}};
}
function render(){
  const app=document.getElementById("app");
  const s=PBBrand.split(DSN);PBBrand.render(app,data(),s.ly,s.th);
  document.documentElement.lang=EN()?"en":"hi";
  try{document.querySelector('meta[name="theme-color"]').content=PBBrand.THEMES[s.th-1].v.bg;document.body.style.background=PBBrand.THEMES[s.th-1].v.bg;}catch(e){}
  if(FIRST){FIRST=false;if(!PV)intro();}
  if(PV){let p=document.getElementById("pvb");if(!p){p=document.createElement("div");p.id="pvb";p.className="pvb";document.body.appendChild(p);}p.textContent=L("झलक: डिज़ाइन #","Preview: design #")+PV;}
}

/* 💼 🪪 📤 🚩 — footer के ऊपर वाले बटन */
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-tool]");if(!t||!B)return;const k=t.getAttribute("data-tool");
  const ph=CT[0]||"",city=cityOf(B),sub=line(B,"Subcategory")||B.category||"";
  if(k==="hire"&&window.PBHire){PBHire.top(false,{slug:slug,name:B.name,call:ph,wa:ph?"91"+ph:"",own:false});PBHire.show();}
  else if(k==="card"&&window.PBCard){const ig=line(B,"Instagram"),fb=line(B,"Facebook");
    PBCard.open({slug:slug,name:B.name,category:B.category,sub:sub,owner:line(B,"Owner"),address:hid("addr")?"":B.address,city:city,tier:"platinum",phone:ph,wa:ph,insta:/^https:\/\/www\.instagram\.com\//.test(ig)?ig:"",fb:/^https:\/\/www\.facebook\.com\//.test(fb)?fb:"",code:B.business_code||"",visitor:true});}
  else if(k==="share"){const u="https://patabook.in/shop?slug="+encodeURIComponent(slug),tx=B.name+(city?" — "+city:"");
    if(navigator.share)navigator.share({title:B.name,text:tx,url:u}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(tx+"\n"+u),"_blank","noopener");}
  else if(k==="report")openReport();
});
function openReport(){
  const R=[["wrong_info",L("गलत जानकारी (नंबर / पता / नाम)","Wrong information (number / address / name)")],["closed",L("दुकान बंद हो गई / मौजूद नहीं","Shop closed / does not exist")],
           ["fake",L("नकली या धोखाधड़ी","Fake or fraud")],["offensive",L("गलत / आपत्तिजनक फ़ोटो या शब्द","Offensive photo or text")],["other",L("कुछ और","Something else")]];
  const old=document.getElementById("repSheet");if(old)old.remove();
  const w=document.createElement("div");w.id="repSheet";w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");
  w.setAttribute("style","position:fixed;inset:0;z-index:9999;background:rgba(10,20,40,.5);display:flex;align-items:flex-end;justify-content:center;font-family:Inter,Hind,system-ui,sans-serif;color:#14161c");
  w.innerHTML='<form style="background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-height:90vh;overflow:auto">'+
    '<h2 style="margin:0 0 4px;font-size:18px;color:#0b2f73">🚩 '+esc(L("शिकायत करें","Report this listing"))+'</h2><p style="margin:0 0 10px;font-size:13px;color:#5b6475">'+esc(B.name)+'</p>'+
    R.map((r,i)=>'<label style="display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid #eef1f6;font-size:15px;cursor:pointer"><input type="radio" name="rr" value="'+r[0]+'"'+(i?'':' required')+'>'+esc(r[1])+'</label>').join("")+
    '<textarea id="repNote" maxlength="500" rows="3" aria-label="'+esc(L("और जानकारी","Details"))+'" placeholder="'+esc(L("कुछ और बताना हो तो लिखें (ज़रूरी नहीं)","Add details (optional)"))+'" style="width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #d0d7e2;border-radius:10px;padding:10px;font:inherit;font-size:16px"></textarea>'+
    '<p id="repMsg" style="min-height:18px;margin:8px 0;font-size:14px"></p>'+
    '<div style="display:flex;gap:10px"><button type="button" id="repX" style="flex:1;border:1px solid #d0d7e2;background:#fff;color:#14161c;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer">'+esc(L("बंद करें","Cancel"))+'</button>'+
    '<button type="submit" id="repGo" style="flex:1;border:0;background:#d92d20;color:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer">'+esc(L("शिकायत भेजें","Send report"))+'</button></div></form>';
  document.body.appendChild(w);   /* फ़ोन का Back = बंद (pb-back.js #repSheet को देखता है) */
  const close=()=>w.remove();
  w.addEventListener("click",e=>{if(e.target===w)close();});w.querySelector("#repX").onclick=close;
  w.querySelector("form").onsubmit=async e=>{e.preventDefault();
    const sel=w.querySelector('input[name="rr"]:checked'),msg=w.querySelector("#repMsg"),go=w.querySelector("#repGo");
    if(!sel){msg.style.color="#b42318";msg.textContent=L("कारण चुनें","Choose a reason");return;}
    go.disabled=true;msg.style.color="#5b6475";msg.textContent="…";
    try{const r=await fetch(SB+"/rest/v1/rpc/pb_report_add",{method:"POST",headers:H,body:JSON.stringify({p_slug:slug,p_reason:sel.value,p_note:w.querySelector("#repNote").value||null})});
      if(r.ok){msg.style.color="#137333";msg.textContent="✅ "+L("शिकायत मिल गई। हमारी टीम जाँच करेगी, धन्यवाद।","Thanks — our team will review this listing.");go.style.display="none";w.querySelector("#repX").textContent=L("ठीक है","OK");return;}
      let m="";try{const j=await r.json();m=(j&&j.message)||"";}catch(_){}
      if(/too many/i.test(m)){msg.style.color="#b42318";msg.textContent=L("आज बहुत शिकायतें भेजी जा चुकी हैं, कल कोशिश करें।","Too many reports today, please try tomorrow.");go.disabled=false;return;}
      throw new Error(m||r.status);
    }catch(err){msg.style.color="#b42318";msg.innerHTML=esc(L("अभी नहीं भेज पाए। ईमेल करें: ","Could not send. Please email: "))+'<a href="mailto:patabook.in@gmail.com">patabook.in@gmail.com</a>';go.disabled=false;}
  };
}
