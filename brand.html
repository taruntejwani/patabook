/* PataBook Platinum — Luxury Signature brand page (brand.html?slug=…). सिर्फ़ Platinum दुकानें; बाकी shop.html पर जाती हैं */
:root{--k:#0a1230;--k2:#0f1b47;--ch:#c7d2e8;--iv:#eef2fa;--mu:#93a0c2;--ln:#24356e;
  --f-lux:"Cormorant Garamond","Tiro Devanagari Hindi",Georgia,serif;--f-ui:Inter,"Tiro Devanagari Hindi",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--k);color:var(--iv);font-family:var(--f-ui);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="hi"] body{font-weight:400}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
.w{max-width:1200px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px))}
.ld{min-height:100svh;display:grid;place-items:center;color:var(--mu);font-size:11px;letter-spacing:.4em;text-transform:uppercase}
.ld i{display:block;width:60px;height:1px;background:var(--ch);margin:16px auto 0;animation:ldp 1.4s ease-in-out infinite}
@keyframes ldp{50%{transform:scaleX(.2);opacity:.4}}
.msg{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mu)}
.msg a{color:var(--ch)}

/* nav */
.nav{position:sticky;top:0;z-index:40;background:rgba(10,18,48,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid rgba(185,200,232,.12);padding-top:env(safe-area-inset-top,0px)}
.nav .in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.mark{text-decoration:none;min-width:0}
.mark b{display:block;font-family:var(--f-lux);font-weight:500;font-size:19px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.mark small{display:block;font-size:8.5px;letter-spacing:.42em;color:var(--ch);margin-top:3px;text-transform:uppercase}
.links{display:flex;gap:28px;align-items:center;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#c3cde3}
.links a{text-decoration:none}.links a:hover{color:var(--ch)}
.lg{background:none;border:1px solid var(--ln);border-radius:999px;padding:7px 12px;font-size:11px;letter-spacing:.12em;color:var(--iv)}
.nr{display:flex;gap:8px;align-items:center}
.menu{display:none;background:none;border:1px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
@media(max-width:820px){.links{display:none}.menu{display:block}.mark b{font-size:16px;letter-spacing:.12em;max-width:56vw}}
.drawer{position:fixed;inset:0;z-index:150;background:rgba(10,18,48,.97);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:40px 30px;opacity:0;pointer-events:none;transition:opacity .45s}
.drawer.on{opacity:1;pointer-events:auto}
.drawer a{font-family:var(--f-lux);font-size:40px;text-decoration:none;line-height:1.1}
.drawer .x{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:20px;background:none;border:1px solid var(--ln);border-radius:999px;width:44px;height:44px;font-size:18px}

/* hero */
.hero{position:relative;min-height:calc(100svh - 64px);display:grid;align-items:end;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transform:scale(1.06);animation:kb 18s ease-out forwards}
@keyframes kb{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,18,48,.25) 0%,rgba(10,18,48,.35) 40%,rgba(10,18,48,.92) 82%,var(--k) 100%)}
.hero.nobg::before{content:"";position:absolute;inset:-20% -10% auto;height:120%;z-index:-1;background:radial-gradient(40% 45% at 50% 40%,rgba(185,200,232,.18),transparent 70%)}
.hero.nobg{align-items:center;text-align:center}
.hero .in{padding-block:80px 70px;max-width:980px}
.hero.nobg .in{margin:0 auto}
.eb{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--ch)}
h1{font-family:var(--f-lux);font-weight:400;font-size:clamp(46px,9vw,112px);line-height:.98;margin:18px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;color:var(--ch)}
.lead{max-width:46ch;margin:20px 0 0;color:#d3dbee;font-size:15.5px;line-height:1.75}
.hero.nobg .lead{margin-inline:auto}
.st{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c3cde3}
.st i{width:7px;height:7px;border-radius:50%;background:#7bc48f;box-shadow:0 0 0 4px rgba(123,196,143,.15)}
.st.cl i{background:#c98a7a;box-shadow:0 0 0 4px rgba(201,138,122,.15)}
.btns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero.nobg .btns{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;font-weight:500;border:1px solid var(--ch);background:transparent;color:var(--ch);transition:background .3s,color .3s}
.btn.p{background:var(--ch);color:var(--k)}
.btn:hover{background:var(--iv);color:var(--k);border-color:var(--iv)}
.btn svg{width:16px;height:16px}
.btn.dis{opacity:.35;pointer-events:none}
.scr{position:absolute;left:50%;bottom:22px;width:1px;height:44px;background:linear-gradient(var(--ch),transparent);animation:scr 2.4s ease-in-out infinite}
@keyframes scr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* sections */
section.blk{padding-block:110px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--ln);padding-bottom:22px}
h2{font-family:var(--f-lux);font-weight:400;font-size:clamp(36px,5vw,60px);margin:10px 0 0;line-height:1}
.cats{display:flex;gap:22px;flex-wrap:wrap}
.cats button{background:none;border:0;color:var(--mu);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent}
.cats button[aria-pressed="true"]{color:var(--iv);border-color:var(--ch)}
@media(max-width:820px){section.blk{padding-block:76px}}

/* collection */
.item{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:56px;padding-block:60px;border-bottom:1px solid var(--ln)}
.item:nth-child(even) .ph{order:2}
.ph{position:relative;aspect-ratio:1/1;background:var(--iv);overflow:hidden;border:0;padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:contain;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.item:hover .ph img{transform:scale(1.04)}
.ph .tg{position:absolute;left:14px;top:14px;background:var(--k);color:var(--ch);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;padding:7px 10px}
.ph .tg.os{left:auto;right:14px;color:#e6b9ad}
.no{font-family:var(--f-lux);font-size:16px;color:var(--ch);letter-spacing:.1em}
.item h3{font-family:var(--f-lux);font-weight:400;font-size:clamp(32px,4vw,50px);margin:8px 0 14px;line-height:1.02}
.fts{list-style:none;padding:0;margin:0;color:var(--mu);font-size:14.5px;line-height:1.95}
.fts li::before{content:"— ";color:var(--ch)}
.meta{display:flex;gap:30px;margin-top:24px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c3cde3;flex-wrap:wrap}
.meta b{display:block;color:var(--ch);font-weight:500;margin-bottom:6px;font-size:9.5px}
.meta s{color:var(--mu);margin-right:6px}
.meta .pr{font-family:var(--f-lux);font-size:24px;letter-spacing:.02em;text-transform:none;color:var(--iv)}
.ask{margin-top:28px;display:inline-flex;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid var(--ch);color:var(--ch);padding:0 0 5px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none}
.empty{color:var(--mu);padding:40px 0;font-size:14px}
@media(max-width:820px){.item{grid-template-columns:1fr;gap:22px;padding-block:44px}.item:nth-child(even) .ph{order:0}}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:clamp(200px,24vw,320px);grid-auto-flow:dense;gap:10px;margin-top:40px}
.gal button{border:0;padding:0;background:var(--k2);overflow:hidden;position:relative}
.gal button:first-child{grid-column:span 2;grid-row:span 2}
.gal.n1 button:first-child{grid-column:span 3}
.gal.n2 button{grid-row:span 2}.gal.n2 button:first-child{grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s;filter:saturate(.9)}
.gal button:hover img{transform:scale(1.05);filter:none}
.gal small{position:absolute;left:12px;bottom:10px;right:12px;text-align:left;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--iv);text-shadow:0 1px 8px rgba(0,0,0,.7)}
@media(max-width:820px){.gal,.gal.n1,.gal.n2{grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:8px}.gal button,.gal button:first-child,.gal.n2 button{grid-column:span 1;grid-row:auto;aspect-ratio:4/5}.gal button:nth-child(3n+1),.gal.n2 button:first-child{grid-column:span 2;aspect-ratio:4/3}}

/* about */
.story{display:grid;grid-template-columns:1.1fr 1fr;gap:70px;align-items:start}
.story blockquote{margin:0;font-family:var(--f-lux);font-size:clamp(28px,3.6vw,46px);line-height:1.18;font-weight:400}
.story blockquote em{color:var(--ch)}
.facts{border-top:1px solid var(--ln)}
.facts div{display:flex;justify-content:space-between;gap:20px;padding:18px 0;border-bottom:1px solid var(--ln);font-size:14px}
.facts span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ch);padding-top:3px;flex:none}
.facts b{font-weight:400;text-align:right;color:var(--iv);white-space:pre-line}
@media(max-width:820px){.story{grid-template-columns:1fr;gap:34px}}
.pill3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ln);margin-top:80px}
.pill3 div{padding:40px 30px 10px 0;border-right:1px solid var(--ln)}
.pill3 div:last-child{border-right:0}
.pill3 div+div{padding-left:30px}
.pill3 span{font-size:10.5px;letter-spacing:.26em;color:var(--ch);text-transform:uppercase}
.pill3 b{font-family:var(--f-lux);font-weight:400;font-size:28px;display:block;margin:12px 0 10px;line-height:1.1}
.pill3 p{color:var(--mu);font-size:14px;line-height:1.7;margin:0}
@media(max-width:820px){.pill3{grid-template-columns:1fr;margin-top:50px}.pill3 div,.pill3 div+div{border-right:0;border-bottom:1px solid var(--ln);padding:28px 0}}

/* rating */
.rate{text-align:center;max-width:760px;margin:0 auto}
.rate .big{font-family:var(--f-lux);font-size:clamp(72px,12vw,140px);line-height:1;margin:18px 0 0}
.rate .stars{color:var(--ch);letter-spacing:.3em;font-size:18px;margin-top:6px}
.rate p{color:var(--mu);font-size:14px;line-height:1.7}
.rate .btn{margin-top:18px}

/* visit */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border:1px solid var(--ln);margin-top:40px}
.visit>div{background:var(--k);padding:44px 36px}
.visit h3{font-family:var(--f-lux);font-weight:400;font-size:34px;margin:10px 0 14px;line-height:1.1}
.visit p{color:var(--mu);line-height:1.8;margin:0 0 14px;font-size:14.5px}
.visit .cl a{display:block;text-decoration:none;font-size:14.5px;padding:10px 0;border-bottom:1px solid var(--ln);color:var(--iv);overflow-wrap:anywhere}
.visit .cl a span{display:inline-block;width:92px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ch)}
.map{position:relative;min-height:340px;overflow:hidden;background:#0d1740;display:block;padding:0!important;text-decoration:none}
.map .tl{position:absolute;display:grid;grid-template-columns:repeat(3,256px);filter:grayscale(1) invert(1) contrast(.85) brightness(.75) sepia(.4) hue-rotate(185deg) saturate(1.6)}
.map .tl img{width:256px;height:256px}
.map i{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ch);box-shadow:0 0 0 10px rgba(185,200,232,.18),0 0 0 26px rgba(185,200,232,.08)}
.map span{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ch)}
.map em{position:absolute;right:6px;bottom:4px;font-size:9px;color:#777;font-style:normal}
@media(max-width:820px){.visit{grid-template-columns:1fr}.visit>div{padding:34px 22px}.map{min-height:260px}}

footer{border-top:1px solid var(--ln);padding:44px 20px calc(110px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:11px;letter-spacing:.06em;line-height:1.9}
footer a{color:var(--ch)}
footer .pb{display:inline-flex;align-items:center;gap:8px;margin-top:14px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#c3cde3}
footer .pb img{width:16px;height:16px}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(110%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sticky.on{transform:none}
.sticky.one{grid-template-columns:1fr}
.sticky a{background:rgba(10,18,48,.96);color:var(--iv);padding:17px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center}
.sticky a.g{color:var(--k);background:var(--ch)}
.sticky svg{width:16px;height:16px}
@media(max-width:820px){.sticky{display:grid}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(6,6,7,.97);display:grid;grid-template-rows:1fr auto;opacity:0;pointer-events:none;transition:opacity .35s}
.lb.on{opacity:1;pointer-events:auto}
.lb .im{display:grid;place-items:center;padding:60px 14px 10px;min-height:0}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb .cap{padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:#c3cde3;font-size:12px;letter-spacing:.18em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb .cap button{background:none;border:1px solid var(--ln);border-radius:999px;width:44px;height:44px;flex:none}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:none;border:1px solid var(--ln);border-radius:999px;width:44px;height:44px;font-size:18px;color:var(--iv)}

function mapHtml(b,href){const la=+b.latitude,ln=+b.longitude;if(!la||!ln||hid("addr"))return '<div class="map" style="display:none"></div>';
  const z=16,n=2**z,xf=(ln+180)/360*n,yr=la*Math.PI/180,yf=(1-Math.log(Math.tan(yr)+1/Math.cos(yr))/Math.PI)/2*n,x=Math.floor(xf),y=Math.floor(yf);
  let t="";for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)t+='<img alt="" loading="lazy" src="https://tile.openstreetmap.org/'+z+'/'+(x+dx)+'/'+(y+dy)+'.png">';
  return '<a class="map" id="map" href="'+esc(href||"#")+'" data-fx="'+(xf-x)+'" data-fy="'+(yf-y)+'" aria-label="'+esc(L("नक्शे पर देखें","Open in map"))+'"><div class="tl">'+t+'</div><i></i><span>'+esc(b.name)+'</span><em>© OpenStreetMap</em></a>';}
function placeMap(){const m=$("map");if(!m)return;const t=m.querySelector(".tl");t.style.left=(m.clientWidth/2-(256+ +m.dataset.fx*256))+"px";t.style.top=(m.clientHeight/2-(256+ +m.dataset.fy*256))+"px";}

function lbOpen(list,i){LBL=list;LBI=i;lbShow();layer($("lb"));}
function wire(){
  $("lgB").onclick=()=>{const to=EN()?"hi":"en";if(window.PB&&PB.set)PB.set(to);else try{localStorage.setItem("pb-lang",to);}catch(e){}render();};
  const d=$("drw");$("mnB").onclick=()=>layer(d);$("drX").onclick=()=>d._close&&d._close();
  d.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();const h=a.getAttribute("href");d._close&&d._close();setTimeout(()=>{const t=document.querySelector(h);if(t)t.scrollIntoView({behavior:"smooth"});},120);});
  const c=document.querySelector(".cats");if(c)c.onclick=e=>{const x=e.target.closest("[data-c]");if(!x)return;CAT=x.dataset.c;c.querySelectorAll("button").forEach(bn=>bn.setAttribute("aria-pressed",bn===x));$("plist").innerHTML=prodList();reveal();};
  const pl=$("plist");if(pl)pl.onclick=e=>{const x=e.target.closest("[data-pi]");if(!x)return;const p=PRODS[+x.dataset.pi];lbOpen([{src:p.img,cap:p.name+(p.size?" · "+p.size:"")}],0);};
  const g=document.querySelector(".gal");if(g)g.onclick=e=>{const x=e.target.closest("[data-gi]");if(!x)return;lbOpen(GAL.map(u=>({src:u,cap:CAPS[u]||""})),+x.dataset.gi);};
  $("lbX").onclick=()=>$("lb")._close&&$("lb")._close();
  $("lbP").onclick=()=>{LBI=(LBI-1+LBL.length)%LBL.length;lbShow();};$("lbN").onclick=()=>{LBI=(LBI+1)%LBL.length;lbShow();};
  $("lb").querySelector(".im").onclick=e=>{if(e.target.tagName!=="IMG")$("lbX").click();};
  const s=$("stk");if(s){const top=$("top");const io=new IntersectionObserver(es=>es.forEach(en=>s.classList.toggle("on",!en.isIntersecting)),{threshold:.15});io.observe(top);}
  reveal();
}
let RIO=null;
function reveal(){if(!("IntersectionObserver" in window)){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));return;}
  RIO=RIO||new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");RIO.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv:not(.in)").forEach(e=>RIO.observe(e));}
load();
})();
</script>
</body></html>
