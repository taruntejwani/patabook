<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style id="pbzoom">/* दो उँगली से zoom चालू (accessibility); double-tap zoom बंद; iPhone पर input छूने से अपने-आप zoom न हो */html{touch-action:manipulation}@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}</style>
<title>PataBook Platinum</title>
<meta name="description" content="Shop website — products, photos, address and WhatsApp. Powered by PataBook.">
<link rel="icon" href="pin.png">
<meta name="theme-color" content="#0a1230">
<link rel="preconnect" href="https://kkvbpzysktozghnxplxv.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="pb-brand/engine.css?v=5">
<script src="site-config.js"></script>
<script src="pb-plan.js"></script>
<script src="pb-back.js"></script>
<script src="pb-hide.js"></script>
<script src="pb-brand/engine.js?v=4"></script>
<style>
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#0a1230;color:#eef2fa;font-family:Inter,"Hind",system-ui,-apple-system,"Segoe UI",sans-serif}
.ld{min-height:100svh;display:grid;place-items:center;color:#93a0c2;font-size:11px;letter-spacing:.4em;text-transform:uppercase}
.ld i{display:block;width:60px;height:1px;background:#c7d2e8;margin:16px auto 0;animation:ldp 1.4s ease-in-out infinite}
@keyframes ldp{50%{transform:scaleX(.2);opacity:.4}}
.msg{min-height:100svh;display:grid;place-items:center;text-align:center;padding:30px;color:#93a0c2}.msg a{color:#c7d2e8}
.pvb{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:300;background:#fff;color:#0b2f73;border-radius:999px;padding:7px 14px;font:700 12.5px Inter,"Hind",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
</style>
</head><body>
<div id="app"><div class="ld"><div>PataBook<i></i></div></div></div>
<script>
const SB="https://kkvbpzysktozghnxplxv.supabase.co",KEY="sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8";
(function(){
/* PataBook Platinum — दुकान की अपनी website (100 में से चुना हुआ design, My Shop → Gallery → Website Design)
   ?d=1-100 : सिर्फ़ झलक (preview) — कुछ save नहीं होता */
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const Q=new URLSearchParams(location.search),slug=Q.get("slug")||"",PV=+Q.get("d")||0;
const IMG_RX=/^https:\/\/kkvbpzysktozghnxplxv\.supabase\.co\/storage\/v1\/object\/public\/shop-logos\//;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const EN=()=>{try{return (localStorage.getItem("pb-lang")||"en")!=="hi";}catch(e){return true;}};
const L=(hi,en)=>EN()?en:hi;
const rpc=(fn,args)=>fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(args)}).then(r=>r.ok?r.json():null).catch(()=>null);
const line=(b,k)=>{const m=String(b.description||"").match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
const DAY_HI={Sunday:"रविवार",Monday:"सोमवार",Tuesday:"मंगलवार",Wednesday:"बुधवार",Thursday:"गुरुवार",Friday:"शुक्रवार",Saturday:"शनिवार"};
const TYPE_HI={Manufacturer:"निर्माता",Wholesaler:"थोक विक्रेता",Wholesale:"थोक विक्रेता",Retailer:"खुदरा दुकान",Retail:"खुदरा दुकान",Distributor:"वितरक",Trader:"व्यापारी","Service Provider":"सेवा देने वाले"};
const hm12=t=>{if(!/^\d{2}:\d{2}$/.test(t||""))return "";let[h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap;};
const stdUrl=()=>"shop.html?slug="+encodeURIComponent(slug)+"&std=1";
let B=null,PRODS=[],GAL=[],CAPS={},COVER="",CT=[],DSN=1;

function hoursTxt(b){const m=line(b,"Hours").match(/^(\d{2}:\d{2})-(\d{2}:\d{2})$/),off=line(b,"Closed");let t=m?hm12(m[1])+" – "+hm12(m[2]):"";
  if(off)t+=(t?"\n":"")+L((DAY_HI[off]||off)+" को बंद",off+" closed");return t;}
function openSt(b){const m=line(b,"Hours").match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/),off=line(b,"Closed");if(!m)return null;
  const a=+m[1]*60+ +m[2],z=+m[3]*60+ +m[4],now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"})),cur=now.getHours()*60+now.getMinutes();
  const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],td=DN[now.getDay()];
  const op=td!==off&&(a<=z?cur>=a&&cur<z:cur>=a||cur<z);
  return op?{o:1,t:L("अभी खुला है · "+hm12(m[3]+":"+m[4])+" तक","Open now · until "+hm12(m[3]+":"+m[4]))}:{o:0,t:L("अभी बंद है","Closed now")};}
function cityOf(b){return line(b,"City")||String(b.address||"").split(",").map(s=>s.trim()).filter(Boolean).pop()||"";}
function fullAddr(b){let t=String(b.address||"").replace(/\s+/g," ").trim();const ar=line(b,"Area"),ci=cityOf(b);
  if(ar&&!t.toLowerCase().includes(ar.toLowerCase())){const k=ci?t.toLowerCase().indexOf(ci.toLowerCase()):-1;t=k>0?t.slice(0,k)+ar+", "+t.slice(k):t+(t?", ":"")+ar;}
  if(ci&&!t.toLowerCase().includes(ci.toLowerCase()))t+=(t?", ":"")+ci;return t;}
function dirUrl(b){const n=encodeURIComponent(b.name||""),a=encodeURIComponent(b.address||"");if(+b.latitude&&+b.longitude)return "map.html?to="+(+b.latitude)+","+(+b.longitude)+"&n="+n+"&a="+a;return b.address?"map.html?q="+a+"&n="+n:"";}
const offerOf=p=>{for(const f of (p.feats||[])){const m=String(f).match(/^Offer:\s*(\d+)/i);if(m)return +m[1];}return 0;};
const hid=k=>!!(window.PBHide&&PBHide.has(k));
function fail(t){document.getElementById("app").innerHTML='<div class="msg"><div>'+esc(t)+'<br><br><a href="index.html">PataBook ›</a></div></div>';}

async function load(){
  if(!slug)return fail(L("दुकान नहीं मिली।","Shop not found."));
  const u=new URL(SB+"/rest/v1/businesses");u.searchParams.set("select","name,slug,address,description,category,website,is_verified,rating,review_count,latitude,longitude,logo_url");u.searchParams.set("slug","eq."+slug);u.searchParams.set("limit","1");
  let rows=null;try{const r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});rows=r.ok?await r.json():null;}catch(e){}
  if(!rows||!rows.length)return fail(L("यह दुकान अभी उपलब्ध नहीं है।","This shop is not available right now."));
  B=rows[0];
  /* सिर्फ़ Platinum: बाकी plan वालों को उनका साधारण पेज */
  let tier="free";try{if(window.PBPlan){await PBPlan.load([slug]);tier=PBPlan.tier(slug);}}catch(e){}
  if(tier!=="platinum"){location.replace(stdUrl());return;}
  if(window.PBHide)PBHide.apply(B.description);
  const [cv,pr,ph,cp,nums,dz]=await Promise.all([rpc("pb_profile_banner_get",{p_slug:slug}),rpc("pb_shop_products_public",{p_slug:slug}),rpc("pb_shop_photos_public",{p_slug:slug}),rpc("pb_photo_captions",{p_slug:slug}),rpc("pb_public_numbers",{p_slug:slug}),PV?null:rpc("pb_design_get",{p_slug:slug})]);
  COVER=typeof cv==="string"&&IMG_RX.test(cv)?cv:"";
  PRODS=(Array.isArray(pr)?pr:[]).filter(p=>p&&p.name);
  GAL=(Array.isArray(ph)?ph:[]).filter(x=>IMG_RX.test(x));
  CAPS={};(Array.isArray(cp)?cp:[]).forEach(c=>{if(c&&c.url&&c.caption)CAPS[c.url]=c.caption;});
  CT=(Array.isArray(nums)?nums:[]).sort((a,b)=>a.slot-b.slot).map(x=>String(x.phone||"").replace(/\D/g,"").slice(-10)).filter(x=>/^\d{10}$/.test(x));
  /* कोई design नहीं चुना (या हटा दिया) → दुकान का साधारण page */
  if(!PV&&!(+dz>=1&&+dz<=100)){try{localStorage.removeItem("pbd_"+slug);}catch(e){}location.replace(stdUrl()+location.hash);return;}
  if(!PV)try{localStorage.setItem("pbd_"+slug,"1");}catch(e){}
  DSN=PV||+dz;
  document.title=B.name+" — "+(B.category||"")+" | PataBook";
  try{const c=document.querySelector('link[rel="canonical"]')||document.head.appendChild(Object.assign(document.createElement("link"),{rel:"canonical"}));c.href="https://patabook.in/shop?slug="+encodeURIComponent(slug);}catch(e){}
  render();
}
function data(){
  const b=B,en=EN(),city=cityOf(b),sub=line(b,"Subcategory"),hrs=hid("hours")?"":hoursTxt(b),type=line(b,"Type"),typeT=en?type:(TYPE_HI[type]||type);
  const email=line(b,"Email"),web=b.website||line(b,"Website"),ig=line(b,"Instagram"),fb=line(b,"Facebook"),gst=/^yes$/i.test(line(b,"GST-Verified"))&&!hid("gst");
  const waNo=CT[0]?"91"+CT[0]:"",cat=[sub,b.category].filter((x,i,a)=>x&&a.indexOf(x)===i).join(" · ");
  const P=hid("prods")?[]:PRODS.map(p=>({name:p.name,size:p.size||"",mrp:+p.mrp||0,offer:offerOf(p),best:!!p.best,stock:p.stock,img:IMG_RX.test(p.img||"")?p.img:"",feats:(p.feats||[]).filter(f=>!/^Offer:/i.test(f))}));
  return {en,name:b.name,cat:sub||b.category||"",city,sub:[sub||b.category,city].filter(Boolean).join(" · "),services:line(b,"Services"),
    open:hid("hours")?null:openSt(b),ph:CT[0]?"+91"+CT[0]:"",nums:CT,waLink:t=>waNo?"https://wa.me/"+waNo+"?text="+encodeURIComponent(t):"",
    email:/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)&&!hid("web")?email:"",web:/^https?:\/\//i.test(web||"")&&!hid("web")?web:"",
    ig:/^https:\/\/www\.instagram\.com\//.test(ig)?ig:"",fb:/^https:\/\/www\.facebook\.com\//.test(fb)?fb:"",
    addr:hid("addr")?"":fullAddr(b),landmark:hid("addr")?"":line(b,"Landmark"),hours:hrs,dir:hid("addr")?"":dirUrl(b),lat:hid("addr")?0:+b.latitude,lng:hid("addr")?0:+b.longitude,
    rating:+b.rating||0,count:+b.review_count||0,products:P,gallery:hid("photos")?[]:GAL.map(u=>({src:u,cap:CAPS[u]||""})),cover:COVER||(!hid("photos")&&GAL[0])||"",
    type:typeT,facts:[[L("मालिक","Owner"),line(b,"Owner")],[L("व्यवसाय","Business"),typeT],[L("कैटेगरी","Category"),cat],[L("समय","Hours"),hrs],["GST",gst?L("सत्यापित","Verified"):""]].filter(x=>x[1]),
    rateUrl:stdUrl()+"#pbRate",stdUrl:stdUrl(),pin:"pin.png",
    onLang:()=>{render();}};
}
function render(){
  const app=document.getElementById("app");
  const s=PBBrand.split(DSN);PBBrand.render(app,data(),s.ly,s.th);
  document.documentElement.lang=EN()?"en":"hi";
  try{document.querySelector('meta[name="theme-color"]').content=PBBrand.THEMES[s.th-1].v.bg;document.body.style.background=PBBrand.THEMES[s.th-1].v.bg;}catch(e){}
  if(PV){let p=document.getElementById("pvb");if(!p){p=document.createElement("div");p.id="pvb";p.className="pvb";document.body.appendChild(p);}p.textContent=L("झलक: डिज़ाइन #","Preview: design #")+PV;}
}
load();
})();
</script>
</body></html>
