<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>टीम – PataBook</title>
<link rel="icon" href="pin.png">
<meta name="theme-color" content="#0b2f73">
<script src="pb-auth.js"></script>
<script src="site-config.js"></script>
<style>
:root{--b:#0b2f73;--bl:#1a73e8;--g:#1e9e57;--r:#d93025;--mu:#5f6368;--bd:#e1e6ef}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fc;color:#202124}
header{background:var(--b);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header a{color:#fff;font-size:13px;text-decoration:underline;font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1.5px solid var(--bd);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#3c4043}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 4px;font-size:16px}
.mut{color:var(--mu);font-size:13px;line-height:1.45}
.role{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:6px;background:#eef3fd;color:var(--bl)}
.role.m{background:#efeaff;color:#5b2bb8}.role.off{background:#fdecec;color:var(--r)}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--bl);color:#fff}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.w{background:#eef3fd;color:var(--bl)}.btn.o{background:#fff;color:#3c4043;border:1.5px solid var(--bd)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select,textarea{width:100%;border:2px solid #dfe1e5;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;background:#fff;margin-top:8px}
label.ck{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;font-weight:600}
label.ck input{width:auto;margin:0}
.err{color:var(--r);font-weight:700;font-size:14px;margin-top:8px}
.ok{color:var(--g);font-weight:700;font-size:14px;margin-top:8px}
.ln{font-size:13.5px;margin-top:6px;line-height:1.5}
.v{color:var(--g);font-weight:800}.nv{color:#b26a00;font-weight:800}
.sub{margin:10px 0 0 14px;padding-left:10px;border-left:3px solid #e8edf5}
.gate{max-width:420px;margin:60px auto;text-align:center;padding:0 16px}
.gate a{display:inline-block;margin-top:10px;background:var(--bl);color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:11px 16px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eef1f6;padding:6px 4px;text-align:left;vertical-align:top}
.cx{color:var(--r);font-weight:800}.src{color:#5b2bb8;font-weight:800}
.card.dim{opacity:.6}
.tw{overflow-x:auto}.tw td:not(:first-child),.tw th:not(:first-child){text-align:right;white-space:nowrap}
.big{font-size:20px;font-weight:900}

/* ── नया मोबाइल-फ़र्स्ट रूप (सिर्फ़ डिज़ाइन) ── */
body{background:#f4f7fb}
header{background:linear-gradient(135deg,#0b2f73,#1769aa);padding:14px 16px 16px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(11,47,115,.18)}
header h1{font-size:19px;line-height:1.25}header h1 small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:2px;letter-spacing:.3px}
header a{background:#ffffff22;border:1px solid #ffffff55;border-radius:11px;padding:7px 11px;text-decoration:none}
main{padding:14px 14px 96px}
.card{border-radius:18px;box-shadow:0 3px 12px rgba(16,42,67,.05)}
.btn{border-radius:13px;padding:12px 15px}
#m>.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);margin:0;gap:0;flex-wrap:nowrap;background:#fff;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -4px 16px rgba(16,42,67,.06)}
#m>.tabs button{flex:1;min-width:0;border:0;border-radius:12px;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#7a8794}
#m>.tabs button b{font-size:20px;font-weight:400;line-height:1}
#m>.tabs button.on{background:#eaf2ff;color:var(--bl)}
#m>.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.hstat{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(16,42,67,.05)}
.hstat i{font-style:normal;font-size:20px}.hstat strong{display:block;font-size:26px;margin:6px 0 2px;color:#0b2f73}.hstat span{font-size:12px;color:var(--mu)}
.hq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hq button{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;font:inherit;font-weight:800;font-size:14px;color:#202124;cursor:pointer}
.hq button b{display:block;font-size:22px;margin-bottom:6px;font-weight:400}
</style>
</head>
<body>
<header><h1><span id="ttl">👥 टीम</span><small id="ttlS">PataBook · टीम वर्कस्पेस</small></h1><a href="admin.html" id="adm" hidden>Admin</a></header>
<main id="m"><div class="mut">लोड हो रहा है…</div></main>
<script>
(function () {
  var SB = 'https://kkvbpzysktozghnxplxv.supabase.co', KEY = 'sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var ROLE = null, ME = null, TAB = '', TEAM = [], SH = [], shSt = 'pending', shQ = '', MSG = {}, WORK = {}, SRC = {}, EARN = [], DED = null, EM = '', ADDOPEN = false, CITIES = null;
  var ER = { 'already in team': 'यह email पहले से टीम में है।', 'already admin': 'यह email पहले से Admin है।', 'staff limit': 'एक Manager के नीचे अधिकतम 20 Staff हो सकते हैं।', 'bad email': 'Email सही नहीं लगता।', 'manager needed': 'पहले Manager चुनें।', 'not allowed': 'आपको यह करने की अनुमति नहीं है।', 'not found': 'नहीं मिला।', 'no GST': 'इस दुकान में GST नंबर नहीं है।', 'no Udyam': 'इस दुकान में Udyam नंबर नहीं है।', 'bad address': 'पता 5 से 300 अक्षर का होना चाहिए।', 'bad pct': 'हिस्सा 0 से 100 के बीच होना चाहिए।', 'not admin': 'यह सिर्फ़ Owner कर सकता है।', 'duplicate': 'इसी नाम और नंबर की दुकान पहले से जुड़ी है।', 'limit3': 'इस नंबर पर पहले से 3 दुकानें हैं।', 'bad phone': 'मोबाइल नंबर 10 अंकों का सही होना चाहिए।', 'bad name': 'दुकान का नाम 2 से 80 अक्षर का होना चाहिए।', 'bad category': 'श्रेणी सही नहीं है।', 'rate limit': 'बहुत जल्दी-जल्दी हो रहा है, थोड़ी देर बाद कोशिश करें।', 'slug conflict': 'यह नाम पहले से है, नाम थोड़ा बदलकर देखें।' };
  function eMsg(e) { var m = String(e && e.message || e); for (var k in ER) if (m.indexOf(k) >= 0) return ER[k]; return 'गलती: ' + m; }

  async function rpc(fn, args) {
    var s = await PBA.session();
    if (!s) { gate('login'); throw new Error('login'); }
    var r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + s.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) { var e = new Error((j && (j.message || j.msg)) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return j;
  }
  function gate(kind, extra) {
    $('m').innerHTML = kind === 'login'
      ? '<div class="gate"><h2>🔒 लॉगिन करें</h2><p class="mut">अपने Google email या मोबाइल OTP से लॉगिन करें। यह वही email या नंबर होना चाहिए जो Admin ने टीम में जोड़ा है।</p><a href="' + PBA.loginUrl('team.html') + '">✉️ Email से लॉगिन करें</a>' + (PBA.mobile && PBA.mobile.enabled() ? '<br><a href="team-login.html" style="background:#0b2f73">📱 Mobile OTP से लॉगिन करें</a>' : '') + '</div>'
      : '<div class="gate"><h2>⛔ अनुमति नहीं</h2><p class="mut">यह email टीम में नहीं है' + (extra ? ' (' + esc(extra) + ')' : '') + '। Admin से कहें कि इसे टीम में जोड़ें, या सही Google email से लॉगिन करें।</p></div>';
  }
  /* 10 अंकों का मोबाइल नंबर हो तो login वाली पहचान (m98XXXXXXXX@phone.patabook.in) बनाओ */
  function idOf(v) { var d = String(v || '').replace(/[\s\-()]/g, '').replace(/^\+/, ''); if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2); else if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1); return /^[6-9]\d{9}$/.test(d) ? 'm' + d + '@phone.patabook.in' : v; }
  function show(e) { var m = /^m([6-9]\d{9})@phone\.patabook\.in$/.exec(e || ''); return m ? '📱 ' + m[1] : e; }
  function can(p) { if (ROLE === 'owner') return true; if (ROLE === 'manager') return p === 'photo' || p === 'gst' || p === 'addr'; return !!(ME && ME.perms && ME.perms[p] === true); }
  function ln(d, k) { var m = String(d || '').match(new RegExp('^' + k + ':\\s*(.+)$', 'mi')); return m ? m[1].trim() : ''; }

  async function boot() {
    try {
      ROLE = await rpc('pb_team_role', {});
      if (!ROLE) { var s = await PBA.session(); return gate('noteam', s && s.email); }
      if (ROLE !== 'owner') { var me = await rpc('pb_team_me', {}); ME = (me && me[0]) || null; }
      else $('adm').hidden = false;
    } catch (e) { if (e.message === 'login') return; return $('m').innerHTML = '<div class="gate"><p class="err">' + esc(eMsg(e)) + '</p></div>'; }
    $('ttl').textContent = ROLE === 'owner' ? '👥 टीम (Owner)' : ROLE === 'manager' ? '👥 Manager' : '🧾 Staff';
    TAB = 'home';
    if (location.hash === '#shops') TAB = 'shops';
    draw();
  }
  function tabs() {
    var T = [['home', '🏠', 'होम']];
    if (ROLE !== 'staff') T.push(['team', '👥', ROLE === 'owner' ? 'टीम' : 'मेरे Staff']);
    T.push(['shops', '🧾', 'दुकानें']);
    T.push(['earn', '💰', ROLE === 'staff' ? 'मेरी कमाई' : 'कमाई']);
    if (ROLE === 'owner') T.push(['ready', '📬', 'जाँच पूरी']);
    if (ROLE !== 'staff') T.push(['log', '📜', 'रिकॉर्ड']);
    return '<div class="tabs">' + T.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (TAB === t[0] ? 'on' : '') + '"><b>' + t[1] + '</b><span>' + t[2] + '</span></button>'; }).join('') + '</div>';
  }
  async function drawHome() {
    var b = $('body'), W = [];
    try { W = await rpc('pb_team_work', {}) || []; } catch (e) { W = []; }
    var o = { shops_month: 0, live_total: 0, sold_month: 0, sold_total: 0 };
    W.forEach(function (x) { for (var k in o) o[k] += +x[k] || 0; });
    var who = ROLE === 'owner' ? 'पूरी टीम' : ROLE === 'manager' ? 'मेरी टीम' : 'मेरा';
    var h = '<div class="hgrid"><div class="hstat"><i>🏪</i><strong>' + o.shops_month + '</strong><span>इस महीने दुकानें (' + who + ')</span></div>' +
      '<div class="hstat"><i>✅</i><strong>' + o.live_total + '</strong><span>कुल Live दुकानें</span></div>' +
      '<div class="hstat"><i>💎</i><strong>' + o.sold_month + '</strong><span>इस महीने plan बिके</span></div>' +
      '<div class="hstat"><i>📈</i><strong>' + o.sold_total + '</strong><span>कुल plan बिके</span></div></div>' +
      '<h3 style="margin:6px 2px 10px;font-size:16px">जल्दी के काम</h3><div class="hq">' +
      '<button data-tab="shops"><b>🧾</b>दुकानें देखें</button>' +
      '<button data-tab="earn"><b>💰</b>' + (ROLE === 'staff' ? 'मेरी कमाई' : 'कमाई / काम') + '</button>' +
      (ROLE !== 'staff' ? '<button data-tab="team"><b>👥</b>' + (ROLE === 'owner' ? 'टीम' : 'मेरे Staff') + '</button>' : (canAdd() ? '<button data-tab="shops" data-add="1"><b>＋</b>नई दुकान जोड़ें</button>' : '')) +
      (ROLE === 'owner' ? '<button data-tab="ready"><b>📬</b>जाँच पूरी</button>' : ROLE === 'manager' ? '<button data-tab="log"><b>📜</b>रिकॉर्ड</button>' : '') + '</div>';
    b.innerHTML = h;
  }
  function draw() {
    $('m').innerHTML = tabs() + '<div id="body"><div class="mut">लोड हो रहा है…</div></div>';
    if (TAB === 'home') return drawHome();
    if (TAB === 'team') return drawTeam();
    if (TAB === 'shops') return drawShops();
    if (TAB === 'earn') return drawEarn();
    if (TAB === 'ready') return drawReady();
    if (TAB === 'log') return drawLog();
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]'); if (t) { ADDOPEN = false; TAB = t.dataset.tab; draw(); window.scrollTo(0, 0); if (t.dataset.add === '1') showAddForm(); }
  });

  /* ───────── टीम ───────── */
  function canAdd() { return ROLE === 'owner' || !!(ME && ME.perms && ME.perms.add === true); }
  function canGiveAdd() { return ROLE === 'owner' || (ROLE === 'manager' && !!(ME && ME.perms && ME.perms.add === true)); }
  function permBoxes(id, perms) {
    return (canGiveAdd() ? '<label class="ck"><input type="checkbox" data-p="add" ' + (perms && perms.add ? 'checked' : '') + '> ➕ दुकान जोड़ना</label>' : '') + '<label class="ck"><input type="checkbox" data-p="gst" ' + (perms && perms.gst ? 'checked' : '') + '> 🧾 GST / MSME जाँच</label><label class="ck"><input type="checkbox" data-p="addr" ' + (perms && perms.addr ? 'checked' : '') + '> 📍 पता सुधार</label>';
  }
  async function drawTeam() {
    var b = $('body');
    try { TEAM = await rpc('pb_team_list', {}) || []; } catch (e) { return b.innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p>'; }
    var mgrs = TEAM.filter(function (t) { return t.role === 'manager'; });
    WORK = {}; try { (await rpc('pb_team_work', {}) || []).forEach(function (w) { WORK[w.member_id] = w; }); } catch (e) { WORK = {}; }
    var h = '<div class="card"><h3>＋ ' + (ROLE === 'owner' ? 'नया Manager या Staff जोड़ें' : 'नया Staff जोड़ें') + '</h3><p class="mut">उसका <b>Google email या 10 अंकों का मोबाइल नंबर</b> डालें। वह उसी से लॉगिन करके अपना काम देखेगा।</p>' +
      '<input id="aE" inputmode="email" placeholder="name@gmail.com या 98XXXXXXXX" autocomplete="off"><input id="aN" placeholder="नाम (ज़रूरी नहीं)" maxlength="60">';
    if (ROLE === 'owner') h += '<select id="aR"><option value="manager">👔 Manager</option><option value="staff">🧑‍💼 Staff (किसी Manager के नीचे)</option></select><select id="aP" hidden>' + mgrs.map(function (m) { return '<option value="' + m.id + '">' + esc(m.name || m.email) + '</option>'; }).join('') + '</select>';
    h += '<div id="aPerm" ' + (ROLE === 'owner' ? 'hidden' : '') + '>' + permBoxes('a', { gst: true, addr: true }) + '</div><div class="row"><button class="btn" id="aGo">जोड़ें</button></div><div id="aMsg"></div></div>';
    var top = ROLE === 'owner' ? mgrs : TEAM.filter(function (t) { return t.role === 'staff'; });
    h += top.length ? top.map(function (t) { return memberCard(t, ROLE === 'owner'); }).join('') : '<p class="mut">अभी कोई नहीं जुड़ा।</p>';
    b.innerHTML = h;
    var aR = $('aR'); if (aR) aR.onchange = function () { var st = aR.value === 'staff'; $('aP').hidden = !st; $('aPerm').hidden = !st; };
    $('aGo').onclick = async function () {
      var btn = this, role = ROLE === 'owner' ? $('aR').value : 'staff', perms = {};
      $('aPerm').querySelectorAll('[data-p]').forEach(function (c) { if (c.checked) perms[c.dataset.p] = true; });
      btn.disabled = true; $('aMsg').innerHTML = '';
      try {
        await rpc('pb_team_add', { p_email: idOf($('aE').value), p_name: $('aN').value, p_role: role, p_parent: role === 'staff' && ROLE === 'owner' ? +$('aP').value || null : null, p_perms: perms });
        MSG.t = 'जुड़ गया। अब वह इसी email या नंबर से लॉगिन करके team.html खोले।'; await drawTeam(); $('aMsg').innerHTML = '<p class="ok">' + MSG.t + '</p>';
      } catch (e) { btn.disabled = false; $('aMsg').innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p>'; }
    };
  }
  /* काम की गिनती + कमाई का % (Owner → Manager/Staff का, Manager → अपने Staff का) */
  function pctBlock(t) {
    var w = WORK[t.id]; if (!w) return '';
    var can = ROLE === 'owner' || (ROLE === 'manager' && t.role === 'staff');
    var lab = t.role === 'manager' ? 'आपके मुनाफ़े में हिस्सा' : (ROLE === 'owner' ? 'Manager के हिस्से में Staff का' : 'आपके हिस्से में इसका');
    return '<div class="ln">📊 इस महीने <b>' + (w.shops_month || 0) + '</b> दुकान जोड़ी · <b>' + (w.sold_month || 0) + '</b> plan बिके · कुल <b>' + (w.live_total || 0) + '</b> दुकान Live</div>' +
      (can ? '<div class="ln">💰 ' + lab + ': <input type="number" min="0" max="100" step="0.5" data-pct value="' + (w.pct != null ? +w.pct : 0) + '" style="width:84px;display:inline-block;margin:0"> % <button class="btn w" data-act="pct" style="padding:7px 12px">सेव</button></div>' : '');
  }
  function memberCard(t, nest) {
    var kids = nest ? TEAM.filter(function (x) { return x.parent_id === t.id; }) : [];
    return '<div class="card" data-id="' + t.id + '"><h3>' + esc(t.name || show(t.email)) + '<span class="role ' + (t.role === 'manager' ? 'm' : '') + '">' + (t.role === 'manager' ? 'Manager' : 'Staff') + '</span>' + (t.active ? '' : '<span class="role off">रुका हुआ</span>') + '</h3><div class="mut">' + esc(show(t.email)) + (t.role === 'manager' && nest ? ' · ' + kids.length + ' Staff' : '') + '</div>' + pctBlock(t) +

      kids.forEach(function (k) { rows += tr(k.member_name, true, tot([k])); });
    });
    return '<div class="card"><h3>' + (ROLE === 'staff' ? '📊 मेरा काम' : '📊 किसने कितना काम किया') + '</h3><div class="tw"><table><tr><th>नाम</th><th>इस महीने दुकानें</th><th>Live (कुल)</th><th>इस महीने plan</th><th>कुल plan</th></tr>' + rows + '</table></div><p class="mut">"दुकानें" = इस महीने जोड़ी गई दुकानें। "plan" = बिके हुए Premium plan (नकद + gift)।</p></div>';
  }
  function earnSummary(rows, W) {
    var B = {}, order = [], add = function (key, name, tag, fin, v) { if (!B[key]) { B[key] = { name: name, tag: tag, f: 0, p: 0 }; order.push(key); } B[key][fin ? 'f' : 'p'] += v; };
    rows.forEach(function (r) {
      if (r.status === 'cancelled') return;
      var fin = r.status === 'final';
      if (ROLE === 'staff') { add('s' + r.staff_id, r.staff_name || 'मैं', '', fin, +r.staff_share || 0); return; }
      if (r.manager_id != null && r.mgr_share != null) add('m' + r.manager_id, r.manager_name, 'Manager', fin, (+r.mgr_share || 0) - (+r.staff_share || 0));
      if (r.staff_id != null) add('s' + r.staff_id, r.staff_name, 'Staff', fin, +r.staff_share || 0);
      if (ROLE === 'owner') add('o', 'आप (Owner)', '', fin, (+r.profit || 0) - (+r.mgr_share || 0));
    });
    var pctLine = '';
    if (ROLE !== 'owner') {
      var me = W.filter(function (x) { return x.role === ROLE; })[0];
      if (me) pctLine = '<p class="mut">आपका हिस्सा: <b>' + (+me.pct) + '%</b> ' + (ROLE === 'manager' ? '(मुनाफ़े का; इसमें से Staff का हिस्सा कटता है)' : '(Manager के हिस्से का)') + '</p>';
    }
    var tr = order.map(function (k) { var b = B[k]; return '<tr><td><b>' + esc(b.name || '—') + '</b>' + (b.tag ? ' <span class="mut">' + b.tag + '</span>' : '') + '</td><td class="v">' + rs(b.f) + '</td><td class="nv">' + rs(b.p) + '</td></tr>'; }).join('');
    return '<div class="card"><h3>💰 कमाई</h3>' + pctLine + (tr ? '<div class="tw"><table><tr><th>नाम</th><th>✅ पक्की</th><th>⏳ बाकी</th></tr>' + tr + '</table></div>' : '<p class="mut">इस अवधि में कोई कमाई नहीं बनी।</p>') +
      '<p class="mut">"पक्की" = बिक्री के अगले महीने की 15 तारीख़ बीत चुकी। "बाकी" = अभी तारीख़ नहीं आई। 15 तारीख़ से पहले plan हटाया गया तो कमाई रद्द होती है।</p></div>';
  }
  function salesList(rows) {
    if (!rows.length) return '';
    return '<h3 style="margin:16px 2px 8px">🧾 बिक्री की सूची</h3>' + rows.map(function (r) {
      var st = r.status === 'final' ? '<span class="v">✅ पक्की</span>' : r.status === 'cancelled' ? '<span class="cx">❌ रद्द (15 तारीख़ से पहले plan हटाया)</span>' : '<span class="nv">⏳ बाकी — ' + dlabel(r.settle_on) + ' को पक्की</span>';
      var d = '';
      if (r.status === 'cancelled') d = '';
      else if (ROLE === 'staff') d = '<div class="ln">आपका हिस्सा: <b>' + rs(r.staff_share) + '</b></div>';
      else {
        d = '<div class="ln">मुनाफ़ा: <b>' + rs(r.profit) + '</b>' + (+r.gst || +r.fee_google || +r.fee_razor ? ' <span class="mut">(कटौती: ' + rs((+r.gst || 0) + (+r.fee_google || 0) + (+r.fee_razor || 0)) + ')</span>' : '') + '</div>';
        d += ROLE === 'manager'
          ? '<div class="ln">आपका: <b>' + rs(mine(r)) + '</b>' + (r.staff_id ? ' · Staff ' + esc(r.staff_name || '') + ': <b>' + rs(r.staff_share) + '</b>' : '') + '</div>'
          : '<div class="ln">Manager ' + esc(r.manager_name || '—') + ': <b>' + rs(mine(r)) + '</b>' + (r.staff_id ? ' · Staff ' + esc(r.staff_name || '') + ': <b>' + rs(r.staff_share) + '</b>' : '') + ' · आपका: <b>' + rs((+r.profit || 0) - (+r.mgr_share || 0)) + '</b></div>';
      }
      return '<div class="card' + (r.status === 'cancelled' ? ' dim' : '') + '"><h3>' + esc(r.shop || r.slug) + '</h3><div class="mut">बिक्री: ' + new Date(r.sale_at).toLocaleDateString('hi-IN', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Kolkata' }) + (r.amount != null ? ' · plan ' + rs(r.amount) : '') + '</div><div class="ln">' + st + '</div>' + d + '</div>';
    }).join('');
  }
  async function drawEarn() {
    var b = $('body'), W;
    try { EARN = await rpc('pb_earn_rows', { p_months: 6 }) || []; W = await rpc('pb_team_work', {}) || []; }
    catch (e) { return b.innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p><p class="mut">अगर यह नया है तो Supabase में SQL का भाग 1 और 2 चलाना होगा।</p>'; }
    DED = null; if (ROLE === 'owner') { try { DED = await rpc('pb_deduct_list', {}) || []; } catch (e) { DED = null; } }
    var keys = []; EARN.forEach(function (r) { var k = mkey(r.sale_at); if (keys.indexOf(k) < 0) keys.push(k); });
    keys.sort().reverse(); if (EM && keys.indexOf(EM) < 0) EM = '';
    var rows = EM ? EARN.filter(function (r) { return mkey(r.sale_at) === EM; }) : EARN;
    var sel = '<div class="card"><select id="eM" style="margin:0"><option value="">सभी (पिछले 6 महीने)</option>' + keys.map(function (k) { return '<option value="' + k + '"' + (k === EM ? ' selected' : '') + '>' + mlabel(k) + ' की बिक्री</option>'; }).join('') + '</select></div>';
    b.innerHTML = (ROLE === 'owner' ? dedCard() : '') + workCard(W) + sel + earnSummary(rows, W) + salesList(rows);
    $('eM').onchange = function () { EM = this.value; drawEarn(); };
    var sv = $('dedSave');
    if (sv) sv.onclick = async function () {
      sv.disabled = true; $('dedMsg').innerHTML = '';
      try {
        var ks = (DED || []).map(function (d) { return d.k; });
        for (var i = 0; i < ks.length; i++) {
          await rpc('pb_deduct_set', { p_k: ks[i], p_enabled: b.querySelector('[data-dk="' + ks[i] + '"]').checked, p_pct: +b.querySelector('[data-dp="' + ks[i] + '"]').value || 0 });
        }
        await drawEarn(); $('dedMsg').innerHTML = '<p class="ok">सेव हो गया — नीचे का हिसाब नए switch से बन गया।</p>';
      } catch (e) { sv.disabled = false; $('dedMsg').innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p>'; }
    };
  }

  /* ───────── जाँच पूरी (Owner) ───────── */
  async function drawReady() {
    var b = $('body'), R;
    try { R = await rpc('pb_team_ready_list', {}) || []; } catch (e) { return b.innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p>'; }
    b.innerHTML = '<p class="mut">टीम ने इन दुकानों की जाँच पूरी कर दी है। Approve सिर्फ़ आप Admin से करेंगे।</p>' + (R.length ? R.map(function (r) {
      return '<div class="card"><h3>' + esc(r.name) + '</h3><div class="mut">भेजने वाला: ' + esc(r.by_email) + ' · ' + new Date(r.at).toLocaleString('hi-IN') + '</div>' + (r.note ? '<div class="ln">📝 ' + esc(r.note) + '</div>' : '') + '<div class="row"><a class="btn" style="text-decoration:none" href="admin.html">✅ Admin में Approve करें</a><a class="btn o" style="text-decoration:none" target="_blank" rel="noopener" href="business.html?slug=' + encodeURIComponent(r.slug) + '">👁 दुकान देखें</a></div></div>';
    }).join('') : '<p class="mut">अभी कोई दुकान नहीं आई।</p>');
  }

  /* ───────── रिकॉर्ड ───────── */
  async function drawLog() {
    var b = $('body'), R;
    try { R = await rpc('pb_team_log_list', { p_limit: 150 }) || []; } catch (e) { return b.innerHTML = '<p class="err">' + esc(eMsg(e)) + '</p>'; }
    var N = { gst_verify: '🧾 GST', udyam_verify: '🏭 MSME', address: '📍 पता', ready: '📤 भेजी', team_add: '➕ जोड़ा', team_set: '✏️ बदला', team_remove: '🗑 हटाया', set_pct: '💰 हिस्सा %' };
    b.innerHTML = R.length ? '<div class="card"><table><tr><th>कब</th><th>किसने</th><th>क्या</th></tr>' + R.map(function (r) {
      return '<tr><td>' + new Date(r.at).toLocaleString('hi-IN', { dateStyle: 'short', timeStyle: 'short' }) + '</td><td>' + esc(r.by_email) + '</td><td>' + (N[r.action] || esc(r.action)) + (r.slug ? ' · ' + esc(r.slug) : '') + (r.note ? '<br><span class="mut">' + esc(r.note) + '</span>' : '') + '</td></tr>';
    }).join('') + '</table></div>' : '<p class="mut">अभी कोई रिकॉर्ड नहीं।</p>';
  }

  boot();
})();
</script>
</body>
</html>
