<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PataBook</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;color:#202124;background:#fff}a{color:#1a0dab;text-decoration:none}header{height:60px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;gap:16px}header a,button.lang{color:#202124;background:none;border:0;font-size:13px;cursor:pointer}button.lang{border:1px solid #dadce0;border-radius:20px;padding:7px 12px}.home{min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;padding-top:14vh}.brand{font-size:56px;font-weight:500;letter-spacing:-2px;margin:0 0 24px}.brand span{color:#1a73e8}.search{width:min(584px,92vw);display:flex;align-items:center;border:1px solid #dfe1e5;border-radius:24px;padding:0 8px 0 16px;height:46px}.search:focus-within{box-shadow:0 1px 6px #20212433}.search input{flex:1;border:0;outline:0;font-size:16px;height:44px}.search select{border:0;background:#fff;color:#3c4043;font-size:14px;outline:0}.search button{border:0;background:#1a73e8;color:#fff;border-radius:18px;height:36px;padding:0 16px;font-weight:600;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px 16px;max-width:720px}.chips button{border:1px solid #f8f9fa;background:#f8f9fa;border-radius:16px;padding:8px 14px;cursor:pointer;color:#3c4043}.results{width:min(652px,94vw);margin:8px auto 40px}.item{padding:14px 0;border-bottom:1px solid #f1f3f4}.item b{display:block;font-size:18px;font-weight:400}.item small{color:#4d5156}.note{color:#70757a;font-size:14px}footer{text-align:center;color:#70757a;font-size:13px;padding:16px}@media(max-width:700px){.brand{font-size:40px}.home{padding-top:10vh}}</style></head><body><header><a href="#results" data-i="navBiz">Businesses</a><button class="lang" id="langBtn" type="button">English</button></header><main class="home"><h1 class="brand">Pata<span>Book</span></h1><form class="search" onsubmit="return searchNow()"><input id="q" autocomplete="off"><select id="city" aria-label="City"><option>Gandhidham</option><option>Adipur</option><option>Anjar</option><option>Bhuj</option><option>Mundra</option><option>Mandvi</option><option>Nakhatrana</option></select><button data-i="search">Search</button></form><div class="chips" id="chips"></div></main><section class="results" id="results"></section><footer data-i="foot">PataBook</footer><script src="config.js"></script><script>
const CATS=["Automobile","Food","Health","Shopping","Education","Home","Professional","Hotel"];
const T={hi:{search:"खोजें",ph:"बिज़नेस, दुकान या सेवा खोजें",empty:"शहर चुनकर खोजें।",need:"config.js me anon key daalo. Service role mat daalna.",loading:"खोज रहे हैं...",none:"कोई बिज़नेस नहीं मिला।",fail:"खोज रुक गई",net:"नेटवर्क त्रुटि",foot:"PataBook · हर बिज़नेस का पता",btn:"English",navBiz:"बिज़नेस"},en:{search:"Search",ph:"Search a business, shop or service",empty:"Choose a city and search.",need:"Add the anon key in config.js. Do not add the service role key.",loading:"Searching...",none:"No business found.",fail:"Search failed",net:"Network error",foot:"PataBook · every business address",btn:"हिन्दी",navBiz:"Businesses"}};
let lang=localStorage.getItem("pb-lang")||"hi";
function t(k){return T[lang][k];}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">","\"":""","'":"&#39;"}[c]));}
function applyLang(){document.documentElement.lang=lang==="en"?"en":"hi";document.querySelector("[data-i=search]").textContent=t("search");document.getElementById("q").placeholder=t("ph");document.querySelector("[data-i=navBiz]").textContent=t("navBiz");document.querySelector("[data-i=foot]").textContent=t("foot");document.getElementById("langBtn").textContent=t("btn");}
function card(b){return `<a class="item" href="business.html?slug=${encodeURIComponent(b.slug||"")}"><b>${esc(b.name)}</b><small>${esc(b.category)} · ${esc(b.city)}</small></a>`;}
async function searchNow(){
  const box=document.getElementById("results");
  const q=document.getElementById("q").value.trim();
  const city=document.getElementById("city").value;
  const c=window.PATABOOK_SUPABASE||{};
  if(!c.url||!c.anonKey){box.innerHTML='<p class="note">'+esc(t("need"))+'</p>';return false;}
  box.innerHTML='<p class="note">'+esc(t("loading"))+'</p>';
  const url=new URL(c.url.replace(/\/$/,"")+"/rest/v1/businesses");
  url.searchParams.set("select","name,slug,city,category");
  url.searchParams.set("is_active","eq.true");
  url.searchParams.set("deleted_at","is.null");
  url.searchParams.set("limit","10");
  if(city) url.searchParams.set("city","ilike."+city);
  if(q) url.searchParams.set("or","(name.ilike.*"+q+"*,category.ilike.*"+q+"*)");
  try{
    const res=await fetch(url,{headers:{apikey:c.anonKey,Authorization:"Bearer "+c.anonKey}});
    const rows=await res.json();
    if(!res.ok){box.innerHTML='<p class="note">'+esc(rows.message||t("fail"))+'</p>';return false;}
    box.innerHTML=rows.length?rows.map(card).join(""):'<p class="note">'+esc(t("none"))+'</p>';
  }catch(e){box.innerHTML='<p class="note">'+esc(t("net"))+'</p>';}
  return false;
}
document.getElementById("chips").innerHTML=CATS.map(c=>`<button type="button" data-q="${c}">${c}</button>`).join("");
document.getElementById("chips").onclick=e=>{if(e.target.dataset.q){document.getElementById("q").value=e.target.dataset.q;searchNow();}};
document.getElementById("langBtn").onclick=()=>{lang=lang==="hi"?"en":"hi";localStorage.setItem("pb-lang",lang);applyLang();};
applyLang();
</script></body></html>
