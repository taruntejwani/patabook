name: Sitemap (daily)
on:
  schedule:
    - cron: "40 20 * * *"   # रोज़ रात ~2:10 (भारत)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: sitemap
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/gen-sitemap.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap-businesses.xml; then echo "no change"; exit 0; fi
          git config user.name "PataBook Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-businesses.xml
          git commit -m "Sitemap: update shop list (automatic)"
          git pull --rebase
          git push
