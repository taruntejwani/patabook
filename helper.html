<html lang="en">

<meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"><style id="pbfont">:root{--pbf:"Plus Jakarta Sans","Hind",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",Arial,sans-serif}</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style id="pbzoom">/* दो उँगली से zoom चालू (accessibility); double-tap zoom बंद; iPhone पर input छूने से अपने-आप zoom न हो */html{touch-action:pan-x pan-y;-webkit-tap-highlight-color:transparent}@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px!important}}input:focus,textarea:focus,select:focus,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none!important}@media(pointer:coarse){a[href^="tel:"]:not([class]),a[href^="mailto:"]:not([class]),footer a,.pb-legal a,.legal a{display:inline-block;padding-block:11px;margin-block:-11px}}</style>

<style>
:root{--blue:#1a73e8;--navy:#0b2f73;--ink:#12141c;--muted:#5b6475;--line:#e4eaf5;--green:#1e9e57}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font-family:inherit}body{font-family:var(--pbf,system-ui,sans-serif);color:var(--ink);background:#fff;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
.edrow{display:flex;justify-content:flex-end;margin:-6px 0 12px}.edtop{display:inline-flex;align-items:center;gap:6px;background:#ffd21f;color:#3b2a00;font-weight:700;font-size:14px;border-radius:999px;padding:9px 16px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(26,115,232,.07)}
.err{color:#b42318;font-size:13px;margin-top:8px;min-height:1px}
.gate,.empty{text-align:center;padding:26px 18px}
.gate .big,.empty .big{font-size:40px}
.gate h2,.empty h2{justify-content:center;margin:6px 0 8px;font-size:20px}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gl .gfh{border:1px solid #e1e8f5;border-radius:16px;flex-direction:column;justify-content:center;text-align:center;gap:5px;padding:14px 4px 11px;min-height:104px;box-shadow:0 4px 14px rgba(22,42,83,.05)}.gl .gfh .gi{font-size:32px;line-height:1}.gl .gfh .gn{flex:none;width:100%}.gl .gfh .gn b{font-size:13px;line-height:1.25}.gl .gfh em{display:none}.gl .gfh i{margin-top:1px}
.gph{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:#fff;padding:8px 4px;margin:-4px -4px 8px}.gph b{flex:1;font-size:18px;color:#0b2f73}.gph span{color:#5b6475;font-weight:700}.gbk{border:0;background:#eef3fc;color:#0b2f73;width:40px;height:40px;border-radius:50%;font-size:28px;line-height:1;cursor:pointer}
.gplus2{width:44px;height:44px;border-radius:50%;background:#1a73e8;color:#fff;display:grid;place-items:center;font-size:32px;font-weight:700;cursor:pointer;line-height:1}
.gg3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}@media(min-width:560px){.gg3{grid-template-columns:repeat(5,1fr)}}.gg3 .gt{border-radius:4px}
.gck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}.gck.on{background:#1e9e57}.gsum{margin:10px 2px 0;font-size:13px;color:#4a5578;line-height:1.7}.gsum b{color:#0b2f73}.gtot{margin-top:4px;font-size:15px;font-weight:700;color:#0b2f73}.gt.hid img{opacity:.45}.gcnt{font-size:14px;color:#2a3350;margin:2px 0 8px}.gf{margin-top:8px;background:#fff;border:1px solid #e1e8f5;border-radius:14px;overflow:hidden}.gfr{display:flex;align-items:stretch}
.gfh{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:#fff;padding:12px;font:inherit;text-align:left;cursor:pointer}.gfh.on{background:#f4f8ff}.gfh .gi{font-size:22px}.gfh .gn{flex:1;min-width:0}.gfh .gn b{display:block;font-size:15px;color:#0b2f73}.gfh .gn small{color:#5b6475;font-size:13px}.gfh i{font-style:normal;background:#eef3fc;color:#1a4fb4;border-radius:999px;padding:2px 9px;font-size:13px;font-weight:700}.gfh i:empty{display:none}.gfh.glk{opacity:.6}.gfh.glk i{background:transparent;font-size:15px}.glkm{margin:8px 2px;padding:10px 12px;border-radius:12px;background:#fff6e5;color:#8a5a00;font-size:13px;font-weight:700}.glkm button{border:0;background:none;color:#1a4fb4;font:inherit;font-weight:700;margin-left:6px;cursor:pointer}.gfh em{font-style:normal;color:#5b6475}
.gplus{flex:none;width:52px;display:grid;place-items:center;background:#1a73e8;color:#fff;font-size:28px;font-weight:700;cursor:pointer;line-height:1}
.gbd{padding:10px 12px 12px;border-top:1px solid #e8eef8}.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(min-width:560px){.gg{grid-template-columns:repeat(5,1fr)}}
.gt{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:#eef3fd;cursor:pointer}.gt img{width:100%;height:100%;object-fit:cover;display:block}.gt.hid img{opacity:.35}.gtm{position:absolute;left:0;right:0;bottom:0;background:rgba(180,83,9,.94);color:#fff;font-size:11px;font-weight:700;padding:2px 3px;text-align:center;line-height:1.2}
.gt .gok{position:absolute;top:5px;left:5px;background:#1e9e57;color:#fff;border-radius:999px;padding:1px 7px;font-size:13px;font-weight:700}.gt .ghd{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px}
h1{font-size:22px;color:var(--navy);margin:6px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.pick button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid #cfd8ea;background:#fff;color:var(--navy)}.pick button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hacc{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}.hacc button{flex:1;min-width:140px;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid #cfd8ea;background:#fff;color:var(--navy)}.hacc button.dng{border-color:#f1b9b3;color:#b42318;background:#fff7f6}.hacc button:disabled{opacity:.6}.hmsg{font-size:13px;margin:8px 2px;color:#b42318}
.hov{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:60;display:grid;place-items:center;padding:20px}.hbx{background:#fff;border-radius:18px;padding:20px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}.hbx h3{font-size:18px;color:var(--navy);margin-bottom:8px}.hbx p{font-size:14px;color:var(--muted);line-height:1.5}.hbx .r{display:flex;gap:10px;margin-top:16px}.hbx .r button{flex:1;padding:11px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid #cfd8ea;background:#fff;color:var(--navy)}.hbx .r button.dng{background:#d93025;border-color:#d93025;color:#fff}
.note{color:var(--muted);font-size:14px;padding:8px 2px}.lnk{display:inline-block;margin-top:10px;font-weight:700;color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="pbh" href="index.html" aria-label="PataBook Home"><img src="pin.png" alt="" width="26" height="26"><img class="pbwm" src="pb-wordmark.webp" alt="PataBook" width="117" height="20" style="height:clamp(15px,5vw,20px);width:auto;display:block"></a>
    <span id="pbLang"></span>
  </div>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div id="list"><p class="note">…</p></div>
</div>
<script>
const SB="https://kkvbpzysktozghnxplxv.supabase.co",KEY="sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=()=>(window.PB&&PB.lang&&PB.lang()!=="hi")?"en":"hi";
let ME=null,ROWS=null,SEL=0,ERR="",OWN=0;
/* pb-gallery.js को चाहिए वाली चीज़ें (सहायक के पास सिर्फ़ फ़ोटो का काम है) */
let PREM={},PHOTOS={},LOGOS={},COVER={},BAN={},PDAYS=0,PDOPEN=0;
const PH=(b,f)=>window.PBPlan?PBPlan.has(b.slug,f):true;
const posterDays=()=>0;
const extOf=bl=>bl.type==="image/webp"?"webp":"jpg";
async function rpc(fn,args){
  const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+ME.access_token,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.message||j.msg))||("HTTP "+r.status));e.status=r.status;throw e;}
  return j;
}
function resizeImage(file,maxSide){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,maxSide/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const tryQ=q=>c.toBlob(bl=>{if(bl&&bl.size<150000)return res(bl);if(q>0.4)return tryQ(Math.round((q-0.1)*100)/100);bl?res(bl):rej(new Error("img"));},"image/webp",q);tryQ(0.78);};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};img.src=url;});}
const squareImage=resizeImage,coverImage=resizeImage,bannerImage=resizeImage;
const TX={en:{h1:"Photo Helper",sub:"Add and manage photos for the shop that added you as a helper.",
  gH:"Please log in first",gP:"Log in with the same email or mobile number the shop owner added as helper.",gB:"Log in",
  none:"No shop has added you as a helper yet. Ask the shop owner to add your email or mobile number.",my:"Open my own shops ›",
  e_net:"Could not load. Check your internet and open again.",noplan:"Photos are not in this shop's plan.",lo:"Log out",lv:"Leave this shop",lvT:"Leave this shop?",lvP:"You will no longer be a helper for {n}. The shop and its photos stay as they are. The owner can add you again.",lvY:"Yes, leave",no:"Cancel",lvE:"Could not leave. Try again.",lvOk:"You left the shop."},
 hi:{h1:"फ़ोटो सहायक",sub:"जिस दुकान ने आपको सहायक बनाया है, उसकी फ़ोटो यहाँ जोड़ें और संभालें।",
  gH:"पहले लॉगिन करें",gP:"उसी ईमेल या मोबाइल नंबर से लॉगिन करें जो दुकान के मालिक ने सहायक के रूप में जोड़ा है।",gB:"लॉगिन करें",
  none:"अभी किसी दुकान ने आपको सहायक नहीं बनाया। दुकान के मालिक से कहें कि वे आपका ईमेल या मोबाइल नंबर जोड़ें।",my:"मेरी अपनी दुकानें खोलें ›",
  e_net:"लोड नहीं हुआ। इंटरनेट देखकर दोबारा खोलें।",noplan:"इस दुकान के प्लान में फ़ोटो की सुविधा नहीं है।",lo:"लॉग आउट",lv:"इस दुकान से हट जाएँ",lvT:"इस दुकान से हट जाएँ?",lvP:"आप {n} के सहायक नहीं रहेंगे। दुकान और उसकी फ़ोटो जैसी हैं वैसी ही रहेंगी। मालिक आपको दोबारा जोड़ सकते हैं।",lvY:"हाँ, हट जाएँ",no:"रद्द करें",lvE:"हट नहीं पाए। दोबारा कोशिश करें।",lvOk:"आप दुकान से हट गए।"}};
const tx=k=>TX[L()][k];
function draw(){
  $("h1").textContent=tx("h1");$("sub").textContent=tx("sub");document.documentElement.lang=L();document.title=tx("h1")+" — PataBook";
  const list=$("list");
  if(!ME){list.innerHTML='<div class="card gate"><div class="big">🔒</div><h2>'+tx("gH")+'</h2><p class="note">'+tx("gP")+'</p><a class="lnk" href="'+esc(PBA.loginUrl("helper.html"))+'">'+tx("gB")+' ›</a></div>';return;}
  if(ROWS===null){list.innerHTML=ERR?'<p class="note">'+tx(ERR)+'</p>':'<p class="note">…</p>';return;}
  if(!ROWS.length){list.innerHTML=(LVM?'<p class="note" style="color:#1e9e57;font-weight:700">'+esc(LVM)+'</p>':'')+'<div class="card gate"><div class="big">👥</div><p class="note">'+tx("none")+'</p><a class="lnk" href="mybusiness.html">'+tx("my")+'</a></div><div class="hacc"><button type="button" data-lo>🚪 '+tx("lo")+'</button></div>';return;}
  if(SEL>=ROWS.length)SEL=0;
  const b=ROWS[SEL];
  let h=OWN?'<a class="lnk" href="mybusiness.html" style="margin:0 0 10px">‹ '+(L()==="en"?"My own shop":"मेरी अपनी दुकान")+'</a>':"";
  if(ROWS.length>1)h+='<div class="pick">'+ROWS.map((r,k)=>'<button type="button" data-sel="'+k+'" class="'+(k===SEL?"on":"")+'">'+esc(r.name)+'</button>').join("")+'</div>';
  else h+='<p class="sub" style="margin-top:-4px"><b>'+esc(b.name)+'</b></p>';
  {const en=L()==="en",PL={add:en?"➕ Add photos":"➕ फ़ोटो जोड़ना",edit:en?"✏️ Edit price & details":"✏️ कीमत / कैप्शन बदलना",hide:en?"👁️ Show / hide":"👁️ दिखाना / छिपाना",remove:en?"🗑️ Remove":"🗑️ हटाना"};
   h+='<p class="note" style="margin:-6px 0 10px">'+(en?"You can: ":"आप कर सकते हैं: ")+(b.perms||[]).filter(k=>PL[k]).map(k=>PL[k]).join(" · ")+'</p>';}
  h+='<div class="card">'+(PH(b,"photos")?(window.galleryBlock?galleryBlock(b,SEL):""):'<p class="note">'+tx("noplan")+'</p>')+'</div>';
  h+='<div class="hacc"><button type="button" data-lo>🚪 '+tx("lo")+'</button><button type="button" class="dng" data-lv>🚶 '+tx("lv")+'</button></div><div class="hmsg" id="hm"></div>';
  list.innerHTML=h;
}
let LVM="";
async function doLogout(){try{await PBA.logout();}catch(e){}ME=null;ROWS=null;OWN=0;LVM="";draw();}
function askLeave(){
  const b=ROWS&&ROWS[SEL];if(!b||document.querySelector(".hov"))return;
  const ov=document.createElement("div");ov.className="hov";
  ov.innerHTML='<div class="hbx" role="dialog" aria-modal="true"><h3>'+esc(tx("lvT"))+'</h3><p>'+esc(tx("lvP").replace("{n}",b.name))+'</p><div class="r"><button type="button" data-no>'+esc(tx("no"))+'</button><button type="button" class="dng" data-yes>'+esc(tx("lvY"))+'</button></div></div>';
  document.body.appendChild(ov);
  const kill=()=>{if(ov.isConnected)ov.remove();};
  if(window.PBBack)PBBack.open(kill,ov);
  const close=()=>{if(window.PBBack&&PBBack.isOpen())PBBack.close();else kill();};
  ov.addEventListener("click",async e=>{
    if(e.target===ov||e.target.closest("[data-no]")){close();return;}
    const y=e.target.closest("[data-yes]");if(!y)return;
    y.disabled=true;
    try{await rpc("pb_helper_leave",{p_slug:b.slug});
      ROWS=ROWS.filter(r=>r.slug!==b.slug);SEL=0;LVM=tx("lvOk");close();draw();}
    catch(x){y.disabled=false;close();const m=$("hm");if(m)m.textContent=tx("lvE");}
  });
}
$("list").addEventListener("click",e=>{const s=e.target.closest("[data-sel]");if(s){SEL=+s.dataset.sel;draw();return;}
  if(e.target.closest("[data-lo]")){doLogout();return;}
  if(e.target.closest("[data-lv]"))askLeave();});
async function start(){
  ME=await PBA.session();draw();if(!ME)return;
  try{
    const r=await rpc("pb_my_helper_shops")||[];
    ROWS=r.map(x=>({slug:x.slug,name:x.name,h:true,is_active:true,perms:Array.isArray(x.perms)?x.perms:["add","edit"]}));
    try{const q=new URLSearchParams(location.search).get("s");const k=ROWS.findIndex(x=>x.slug===q);if(k>=0)SEL=k;}catch(e){}
    if(window.PBPlan)await PBPlan.load(ROWS.map(x=>x.slug));
    try{const o=await rpc("pb_my_businesses")||[];OWN=o.length;}catch(e){OWN=0;}
  }catch(e){
    if(e.status===401||/JWT|expired/i.test(e.message)){await PBA.logout();ME=null;}
    else{ERR="e_net";ROWS=null;}
  }
  draw();
}
PB.mount($("pbLang"));PB.onChange(draw);
start();
</script>
