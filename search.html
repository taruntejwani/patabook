/* ✍️ spelling के रूप: बोलने/लिखने में Shriram, Shri Ram, Shree Ram, Sri Ram — सब एक दुकान तक पहुँचें ("*" = कुछ भी / खाली) */
const HI2EN={"श्री":"shree","श्रीराम":"shree*ram","राम":"ram","कृष्णा":"krishna","कृष्ण":"krishna","गणेश":"ganesh","साई":"sai","शंकर":"shankar","जय":"jai","दुर्गा":"durga","लक्ष्मी":"laxmi","हनुमान":"hanuman","बालाजी":"balaji","महादेव":"mahadev","भवानी":"bhavani","अंबे":"ambe","खोडियार":"khodiyar","पटेल":"patel","शर्मा":"sharma"};
function spell(w){
  const out=[];const add=x=>{if(x&&x!==w&&!out.includes(x))out.push(x);};
  if(HI2EN[w])add(HI2EN[w]);
  if(/^(shree|shri|sri|shreee)$/.test(w))["shree","shri","sri"].forEach(add);
  const m=w.match(/^(shreee|shree|shri|sri)(.{2,})$/);
  if(m)["shree","shri","sri"].forEach(p=>add(p+"*"+m[2]));
  [["ee","i"],["i","ee"],["oo","u"],["u","oo"],["aa","a"],["ph","f"],["f","ph"],["w","v"],["v","w"],["ck","k"],["ram","raam"],["raam","ram"]].forEach(r=>{if(w.includes(r[0]))add(w.replace(r[0],r[1]));});
  return out.slice(0,6);
}
const rxOf=a=>new RegExp(a.replace(/[.+?^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*"),"i");
/* query ko words me todo; har word ke liye alag roop (alias) */
const STOPW=new Set(["shop","shops","store","stores","dukan","dukaan","dukane","dukano","dukaanein","दुकान","दुकानें","दुकाने","शॉप","near","nearby","me","in","at","ka","ki","ke","ko","the","for","and","best","top","list","पास","में","का","की","के"]);
function terms(q,keepEmpty){
  let ws=String(q||"").toLowerCase().replace(/[,()*\\"'%:;]/g," ").split(/\s+/).filter(w=>w.length>=2||/^\d+$/.test(w)).slice(0,6);
  const w2=ws.filter(w=>!STOPW.has(w));if(w2.length||keepEmpty)ws=w2;   /* "shop / store / dukan" जैसे आम शब्द खोज में नहीं गिनते (सिर्फ़ वही लिखा हो तब छोड़कर) */
  ws=ws.slice(0,5);
  return ws.map(w=>{
    const alt=[w];
    (ALIAS[w]||"").split(" ").filter(Boolean).slice(0,3).forEach(a=>alt.includes(a)||alt.push(a));
    if(CATHI[w])alt.push(CATHI[w].toLowerCase());
    if(w.length>4&&/[a-z]s$/.test(w))alt.push(w.slice(0,-1));       /* "plumbers" -> "plumber" */
    if(!/^\d+$/.test(w))spell(w).forEach(a=>alt.includes(a)||alt.length>=8||alt.push(a));   /* Shriram = Shree Ram = Sri Ram */
    return {w,alt,pin:/^\d{6}$/.test(w),num:/^\d+$/.test(w)};
  });
}
function group(t){
  const f=t.num?["address","description"]:["name","category","description","address"];
  const parts=[];t.alt.forEach(a=>f.forEach(c=>parts.push(c+".ilike.*"+a+"*")));
  return "or("+parts.join(",")+")";
}

/* description se jaankari */
const line=(b,k)=>{const m=String(b.description||"").match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
function cityOf(b){const pm=String(b.address||"").match(/([^,]+?)\s*[–—-]\s*\d{6}\s*$/);if(pm&&pm[1].trim())return pm[1].trim();return line(b,"City")||String(b.address||"").split(",").map(s=>s.trim()).filter(Boolean).pop()||"";}
function catOf(b){return line(b,"Subcategory")||b.category||"";}

/* sabse sahi result upar */
function score(b,ts){
  const n=String(b.name||"").toLowerCase(),c=(catOf(b)+" "+(b.category||"")).toLowerCase(),
        p=(cityOf(b)+" "+line(b,"Area")+" "+(b.address||"")).toLowerCase(),d=String(b.description||"").toLowerCase();
  let s=0;
  ts.forEach(t=>{let best=0;t.alt.forEach(a=>{
    const wl=a.includes("*"),rx=wl?rxOf(a):null,has=x=>wl?rx.test(x):x.includes(a),ex=a===t.w?1:0;   /* हूबहू मिलना ऊपर, मिलता-जुलता रूप थोड़ा नीचे */
    if(!wl&&n.startsWith(a))best=Math.max(best,10);else if(has(n))best=Math.max(best,7-(ex?0:0.5));
    if(has(c))best=Math.max(best,6);if(has(p))best=Math.max(best,5);if(has(d))best=Math.max(best,3);
  });s+=best;});
  return s+(b.is_verified?1:0);
}

/* 🔎 ग़लत spelling पर भी खोज: सीधा मिलान कम मिले तो Supabase का pb_search_fuzzy (sql: fuzzy) मिलते-जुलते नाम ढूँढता है */
var FZN=0;
function deva2rom(t){   /* देवनागरी → रोमन (खोज के लिए मोटा रूप): तेजवानी → tejavani/tejwani */
  const V={"अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऑ":"o"},
        M={"ा":"a","ि":"i","ी":"ee","ु":"u","ू":"oo","े":"e","ै":"ai","ो":"o","ौ":"au","ॉ":"o","ं":"n","ँ":"n","ः":"h"},
        C={"क":"k","ख":"kh","ग":"g","घ":"gh","च":"ch","छ":"chh","ज":"j","झ":"jh","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"f","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h","ळ":"l","ड़":"d","ढ़":"dh"};
  let o="",pe=false;const a=Array.from(String(t||"").normalize("NFC"));   /* pe = पिछले अक्षर में साफ़ मात्रा थी (तब बीच का "अ" छोड़ देते हैं: तेजवानी → tejvanee) */
  for(let k=0;k<a.length;k++){const c=a[k],n=a[k+1];
    if(C[c]!==undefined){o+=C[c];
      if(n==="्"){k++;pe=false;}
      else if(n&&M[n]!==undefined){pe=true;}
      else if(n&&(C[n]!==undefined||V[n]!==undefined)){ if(!pe)o+="a"; pe=false; }
      else pe=false;}
    else if(M[c]!==undefined){o+=M[c];pe=true;}
    else if(V[c]!==undefined){o+=V[c];pe=true;}
    else if(c==="़"||c==="्")continue;else{o+=c;pe=false;}}
  return o;
}
var LOOSEMISS="";
async function fuzzyRows(q,city,cid,have,loose){
  try{
    let qq=String(q||"");if(/[\u0A80-\u0AFF]/.test(qq))qq=qq.replace(/[\u0A80-\u0AFF]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x180));   /* ગુજરાતી → देवनागरी (दोनों लिपियों का क्रम एक जैसा है) */
    if(/[\u0900-\u097F]/.test(qq))qq=deva2rom(qq);
    qq=qq.split(/\s+/).filter(w=>w&&!STOPW.has(w.toLowerCase())).join(" ");
    if(qq.replace(/[^a-z0-9]/gi,"").length<3)return [];
    const r=await fetch(SB+"/rest/v1/rpc/pb_search_fuzzy",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},H),
      body:JSON.stringify(loose?{p_q:qq,p_limit:12,p_loose:true}:{p_q:qq,p_city:city||null,p_city_id:cid?String(cid):null,p_limit:20})});
    if(!r.ok)return [];const ids=await r.json();if(!Array.isArray(ids)||!ids.length)return [];
    const seen=new Set((have||[]).map(b=>b.slug)),want=ids.filter(x=>!seen.has(x.slug));if(!want.length)return [];
    const u=new URL(SB+"/rest/v1/businesses");
    u.searchParams.set("select","name,slug,address,description,category,rating,review_count,is_verified,latitude,longitude");
    u.searchParams.set("is_active","eq.true");u.searchParams.set("deleted_at","is.null");
    u.searchParams.set("slug","in.("+want.map(x=>'"'+String(x.slug).replace(/["\\]/g,"")+'"').join(",")+")");
    if(CATSEL)u.searchParams.set("category","eq."+CATSEL);
    const r2=await fetch(u,{headers:H});const rows=await r2.json();if(!r2.ok||!Array.isArray(rows))return [];
    if(loose){const ms=[];ids.forEach(x=>{String(x.missed||"").split(" ").forEach(w=>{if(w&&!ms.includes(w))ms.push(w);});});LOOSEMISS=ms.slice(0,3).join(", ");}
    const sc={};want.forEach(x=>sc[x.slug]=x.score);
    return rows.sort((a,b)=>(sc[b.slug]||0)-(sc[a.slug]||0));
  }catch(e){return [];}
}
/* 📍 जगह (शहर/गाँव) पहचान: खोज में लिखा शहर नीचे वाले शहर-खाने से ऊपर माना जाए ("Gariyadhar shop" → Gariyadhar की दुकानें) */
var PLACES=null;
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
async function placesMap(){
  if(PLACES)return PLACES;
  const m=new Map(),add=x=>{x=String(x||"").trim();if(x.length>=3&&x.length<=40&&!/\d/.test(x)){const k=x.toLowerCase();if(!m.has(k))m.set(k,x);}};
  [].forEach.call(document.querySelectorAll("#cityDL option"),o=>add(o.value));
  Object.keys(window.PB_CITY_IDS||{}).forEach(k=>{if(!m.has(k))add(k.replace(/(^|\s)\S/g,c=>c.toUpperCase()));});
  try{
    let L=null;try{const c=JSON.parse(sessionStorage.getItem("pb-places")||"null");if(c&&Date.now()-c.t<600000)L=c.l;}catch(e){}
    if(!L){const r=await fetch(SB+"/rest/v1/rpc/pb_known_places",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},H),body:"{}"});
      if(r.ok){const d=await r.json();if(Array.isArray(d)){L=d.map(x=>x&&x.place).filter(Boolean);try{sessionStorage.setItem("pb-places",JSON.stringify({t:Date.now(),l:L}));}catch(e){}}}}
    (L||[]).forEach(add);
  }catch(e){}
  PLACES=m;return m;
}
const tokClean=t=>String(t||"").toLowerCase().replace(/[^a-zऀ-ॿ઀-૿]/g,"");
function nearPlace(l,P){if(l.length<5)return null;for(const [pl,pd] of P){if(pl[0]===l[0]&&Math.abs(pl.length-l.length)<=2&&lev(pl,l)<=(l.length>=8?2:1))return pd;}return null;}
async function detectCity(q){
  const toks=String(q||"").split(/[\s,]+/).filter(Boolean);if(!toks.length)return null;
  const P=await placesMap();let hit=null,idx=-1;
  toks.forEach((t,k)=>{if(hit)return;const l=tokClean(t);if(l.length>=4&&P.has(l)){hit=P.get(l);idx=k;}});
  if(!hit)toks.forEach((t,k)=>{if(hit)return;const l=tokClean(t);if(STOPW.has(l))return;const x=nearPlace(l,P);if(x){hit=x;idx=k;}});
  return hit?{city:hit,rest:toks.filter((_,k)=>k!==idx).join(" ")}:null;
}
async function fixCityBox(city){   /* शहर-खाने में ग़लत spelling (Gandhidhan) हो तो सही शहर */
  if(!city)return city;const P=await placesMap(),l=tokClean(city);if(P.has(l))return P.get(l);
  return nearPlace(l,P)||city;
}
/* 💡 कुछ न मिले तो "क्या आपका मतलब ..." (pb_suggest) */
var DYM=[];
async function suggestWords(q,limit){
  try{
    let t=String(q||"");t=t.replace(/[઀-૿]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x180));if(/[ऀ-ॿ]/.test(t))t=deva2rom(t);
    t=t.split(/\s+/).filter(w=>w&&!STOPW.has(w.toLowerCase())).join(" ").slice(0,60);
    if(t.replace(/[^a-z0-9]/gi,"").length<3||t.split(/\s+/).length>4)return [];
    const r=await fetch(SB+"/rest/v1/rpc/pb_suggest",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},H),body:JSON.stringify({p_q:t,p_limit:limit||6})});
    if(!r.ok)return [];const d=await r.json();if(!Array.isArray(d))return [];
    const low=t.toLowerCase();return d.map(x=>x&&x.label).filter(x=>x&&String(x).toLowerCase()!==low).slice(0,limit||6);
  }catch(e){return [];}
}
var WIDE="";
let reqN=0,CITYUSER=false;
async function run(push){

  const hard=!!det;   /* शहर खोज-शब्द में लिखा हो → सिर्फ़ वही शहर; खाने से चुना → उसे ऊपर, बाकी भी */
  if(det){q=det.rest.split(/\s+/).filter(w=>w&&!STOPW.has(w.toLowerCase())).join(" ");city=det.city;$("city").value=det.city;}
  else if(city){try{const fc=await fixCityBox(city);if(fc&&fc!==city){city=fc;$("city").value=fc;}}catch(e){}}
  if(push){const u=new URL(location.href);u.searchParams.set("q",q0);city?u.searchParams.set("city",city):u.searchParams.delete("city");history.replaceState(null,"",u);}
  const ts=terms(q,!!city);
  autoCat(q);
  if(push){const u=new URL(location.href);CATSEL?u.searchParams.set("cat",CATSEL):u.searchParams.delete("cat");WORKSEL?u.searchParams.set("work",WORKSEL):u.searchParams.delete("work");history.replaceState(null,"",u);}
  if(!ts.length&&!city&&!CATSEL){cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("s_empty"))+'</p>';return;}
  const n=++reqN;
  cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("loading"))+'</p>';
  if(JOBQ.test(q))return runJobs(q,city,n);   /* "hiring / job / नौकरी" → नौकरी वाली दुकानें (sql-26) */
  try{
    let rows=await gatherRows(q,city,ts,n);if(rows===null)return;
    WIDE="";
    if(city&&ts.length&&!WORKSEL){   /* चुने शहर में कुछ न मिला → सभी शहरों में; मिला तो बाकी शहरों की भी नीचे (कभी खाली नहीं) */
      const keepFz=FZN,keepLM=LOOSEMISS;
      if(!rows.length){const w=await gatherRows(q,"",ts,n);if(w===null)return;if(w.length){rows=w;WIDE=city;}else LOOSEMISS="";}
      else if(!hard){const w=await gatherRows(q,"",ts,n);if(w===null)return;
        const seen=new Set(rows.map(b=>b.slug));const more=w.filter(b=>b.slug&&!seen.has(b.slug)).slice(0,20);
        FZN=keepFz;LOOSEMISS=keepLM;if(more.length){more.forEach(b=>b._o=1);rows=rows.concat(more);}}
    }
    DYM=[];if(!rows.length&&ts.length){DYM=await suggestWords(q,4);if(n!==reqN)return;}
    render(rows,q,WIDE?"":city);
  }catch(e){if(n===reqN){cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("err"))+'</p><p class="note" style="font-size:11px;opacity:.6">'+esc(String(e&&e.message||e).slice(0,160))+'</p>';}}
}
async function gatherRows(q,city,ts,n){
  const u=new URL(SB+"/rest/v1/businesses");
  u.searchParams.set("select","name,slug,address,description,category,rating,review_count,is_verified,latitude,longitude");   /* phone/whatsapp nahi: sirf login ke baad business page par */
  u.searchParams.set("is_active","eq.true");
  u.searchParams.set("deleted_at","is.null");
  u.searchParams.set("limit","60");
  const gs=ts.map(group);
  const cid=city&&(window.PB_CITY_IDS||{})[city.toLowerCase()];                 /* Approve हुआ शहर: city_id से भी (पते में शहर न लिखा हो तब भी मिले) */
  if(city)gs.push("or("+(cid?"city_id.eq."+cid+",":"")+"address.ilike.*"+city+"*,description.ilike.*"+city+"*)");
  if(CATSEL)u.searchParams.set("category","eq."+CATSEL);
  if(WORKSEL)u.searchParams.append("description","ilike.*Subcategory: "+WORKSEL.replace(/[*,()]/g," ")+"*");
  if(gs.length===1)u.searchParams.set("or",gs[0].slice(3,-1));else if(gs.length>1)u.searchParams.set("and","("+gs.join(",")+")");
  let r=await fetch(u,{headers:H}),data=await r.json().catch(()=>null);
  if(!r.ok&&cid&&city){   /* शहर-id वाली खोज फेल हुई तो सिर्फ़ पते/विवरण में शहर के नाम से दोबारा */
    const u2=new URL(u);const o=u2.searchParams.get("or"),a2=u2.searchParams.get("and");
    const fx=x=>x&&x.split("city_id.eq."+cid+",").join("");
    if(o!=null)u2.searchParams.set("or",fx(o));if(a2!=null)u2.searchParams.set("and",fx(a2));
    r=await fetch(u2,{headers:H});data=await r.json().catch(()=>null);
  }
  if(n!==reqN)return null;
  if(!r.ok||!Array.isArray(data))throw new Error((data&&data.message)||("HTTP "+r.status));
  const rk=b=>{const v=+b.review_count||0,r=+b.rating||0;return (v*r+3*3.5)/(v+3);};   /* star + कितनों ने दी, दोनों; बिना rating = 3.5 */
  let rows=data.map(b=>(b._s=score(b,ts),b)).sort((a,b)=>b._s-a._s||(rk(b)-rk(a))||String(a.name).localeCompare(b.name));
  rows=await premiumFirst(rows);if(n!==reqN)return null;
  FZN=0;LOOSEMISS="";
  if(rows.length<3&&ts.length&&!WORKSEL){const ex=await fuzzyRows(q,city,cid,rows);if(n!==reqN)return null;if(ex.length){FZN=ex.length;rows=rows.concat(ex);}}
  if(!rows.length&&!city&&ts.length&&!WORKSEL){const ex=await fuzzyRows(q,city,cid,rows,true);if(n!==reqN)return null;if(ex.length){FZN=ex.length;rows=ex;}}   /* Google जैसा: सारे शब्द न मिलें तो जितने मिलें उनसे */
  return rows;
}
/* 💼 नौकरी वाली दुकानें — पास वाली पहले (location की इजाज़त पहले से हो तो) */
const JOBQ=/(^|\s)(hiring|hire|vacancy|vacancies|job|jobs|naukri|nokri|नौकरी|नौकरियाँ|नौकरियां|भर्ती|वैकेंसी|जॉब)(\s|$)/i;
function myPos(){return new Promise(res=>{try{if(!navigator.geolocation||!navigator.permissions)return res(null);
  navigator.permissions.query({name:"geolocation"}).then(st=>{if(st.state!=="granted")return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({la:p.coords.latitude,ln:p.coords.longitude}),()=>res(null),{timeout:4000,maximumAge:600000});}).catch(()=>res(null));}catch(e){res(null);}});}
function kmTo(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.ln-a.ln),h=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
async function runJobs(q,city,n){

/* 💎 Premium (sql-23): Premium दुकानें सबसे ऊपर — हर बार अलग क्रम (rotation), ताकि सबको बराबर मौका मिले */
let PREMS={};
async function premiumFirst(rows){
  if(!(window.PB_SITE&&PB_SITE.premium)||!rows||!rows.length||!window.PBPlan)return rows;
  try{await PBPlan.load(rows.map(b=>b.slug).filter(Boolean));}catch(e){return rows;}
  PREMS={};rows.forEach(b=>{if(PBPlan.paid(b.slug))PREMS[b.slug]=PBPlan.tier(b.slug);});
  /* plan में "ऊपर दिखना" ON: Platinum → Gold → Silver, हर समूह के अंदर हर बार अलग क्रम */
  const R={platinum:3,gold:2,silver:1},top=rows.filter(b=>PBPlan.has(b.slug,"top")),o=rows.filter(b=>!PBPlan.has(b.slug,"top"));
  for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]];}
  top.sort((a,b)=>(R[PBPlan.tier(b.slug)]||0)-(R[PBPlan.tier(a.slug)]||0));
  return top.concat(o);
}

(function(){

  function note(t){let d=document.getElementById("locMsg");if(!d){d=document.createElement("div");d.id="locMsg";d.style.cssText="position:fixed;left:12px;right:12px;top:70px;z-index:99;background:#fff4e5;color:#7a3b00;border:1px solid #fedf89;border-radius:12px;padding:10px 12px;font-size:13.5px";document.body.appendChild(d);}d.textContent=t;d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>{d.hidden=true;},7000);d.onclick=()=>{d.hidden=true;};}
