body{font-family:"Noto Sans Devanagari","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f5f8fe;-webkit-font-smoothing:antialiased}

button,select{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;height:60px}
.back{font-size:22px;line-height:1;padding:6px 8px 6px 0;color:var(--navy)}
.brand{display:flex;align-items:center;gap:8px;line-height:1}

.brand .col{display:flex;flex-direction:column}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.5px}
.brand b span{color:var(--blue)}
.brand small{font-size:6.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-top:3px;white-space:nowrap}
.sp{flex:1}
.mapic{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff}.mapic svg{width:21px;height:21px;display:block}

.add{background:var(--blue);color:#fff;font-weight:600;border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}

/* search box : index jaisa */
.sbox{margin:16px 0 6px}
.search{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:6px;box-shadow:0 8px 24px rgba(26,115,232,.12)}
.search .f{display:flex;align-items:center;gap:8px;flex:1 1 100%;padding:8px 12px;color:var(--muted)}
.search input,.search select{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);width:100%;min-width:0}
.gpsb{flex:none;width:30px;height:30px;margin:-3px -4px -3px 0;border-radius:50%;border:0;background:#e8f0fe;color:#1a73e8;display:grid;place-items:center;cursor:pointer;padding:0}.gpsb svg{width:18px;height:18px}.gpsb:active{background:#d2e3fc}.gpsb.busy{opacity:.5}
.pgn{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}.pgn button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:800;font-size:14px;border-radius:999px;padding:9px 18px;cursor:pointer}.pgn button:disabled{opacity:.35;cursor:default}.pgn span{font-weight:700;color:var(--muted);font-size:14px}
.flt{display:flex;gap:8px;margin:10px 0 0}.flt label{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}.flt select{font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 8px;width:100%;min-width:0;text-overflow:ellipsis}.flt select.on{border-color:var(--navy);background:#eef4ff}.flt select:disabled{opacity:.55}.flt .au{font-weight:600;color:#137333}

.hint{font-size:12.5px;color:var(--muted);margin:8px 6px 0;line-height:1.5}

.count{font-size:14px;font-weight:700;margin:16px 0 8px;color:var(--navy)}
.list{display:flex;flex-direction:column;gap:12px;padding-bottom:30px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 2px 10px rgba(11,47,115,.05)}
.info h2{font-size:17px;font-weight:700;line-height:1.3}
.info h2 a:hover{color:var(--blue)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;border-radius:999px;padding:3px 9px;background:#f1f4fa;color:#3c4659}
.tag.city{background:#e8f1ff;color:var(--navy);font-weight:600}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.acts a.call{background:var(--blue);border-color:var(--blue);color:#fff}

.note{color:var(--muted);padding:20px 0;text-align:center}
footer{padding:14px 16px 24px;text-align:center;color:var(--muted);font-size:12px}
@media(min-width:760px){

const CATHI={"ऑटोमोबाइल":"Automobile","खाना":"Food","स्वास्थ्य":"Health","शॉपिंग":"Shopping","शिक्षा":"Education","होम":"Home","प्रोफेशनल":"Professional","होटल":"Hotel"};

/* query ko words me todo; har word ke liye alag roop (alias) */
function terms(q){
  const ws=String(q||"").toLowerCase().replace(/[,()*\\"'%:;]/g," ").split(/\s+/).filter(w=>w.length>=2||/^\d+$/.test(w)).slice(0,5);
  return ws.map(w=>{
    const alt=[w];
    (ALIAS[w]||"").split(" ").filter(Boolean).slice(0,3).forEach(a=>alt.includes(a)||alt.push(a));
    if(CATHI[w])alt.push(CATHI[w].toLowerCase());
    if(w.length>4&&/[a-z]s$/.test(w))alt.push(w.slice(0,-1));       /* "plumbers" -> "plumber" */
    return {w,alt,pin:/^\d{6}$/.test(w),num:/^\d+$/.test(w)};
  });
}
function group(t){
  const f=t.num?["address","description"]:["name","category","description","address"];
  const parts=[];t.alt.forEach(a=>f.forEach(c=>parts.push(c+".ilike.*"+a+"*")));
  return "or("+parts.join(",")+")";
}

/* description se jaankari */
const line=(b,k)=>{const m=String(b.description||"").match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
function cityOf(b){return line(b,"City")||String(b.address||"").split(",").map(s=>s.trim()).filter(Boolean).pop()||"";}
function catOf(b){return line(b,"Subcategory")||b.category||"";}

/* sabse sahi result upar */
function score(b,ts){
  const n=String(b.name||"").toLowerCase(),c=(catOf(b)+" "+(b.category||"")).toLowerCase(),
        p=(cityOf(b)+" "+line(b,"Area")+" "+(b.address||"")).toLowerCase(),d=String(b.description||"").toLowerCase();
  let s=0;
  ts.forEach(t=>{let best=0;t.alt.forEach(a=>{
    if(n.startsWith(a))best=Math.max(best,10);else if(n.includes(a))best=Math.max(best,7);
    if(c.includes(a))best=Math.max(best,6);if(p.includes(a))best=Math.max(best,5);if(d.includes(a))best=Math.max(best,3);
  });s+=best;});
  return s+(b.is_verified?1:0);
}

function drawWork(){const sel=$("fWork");if(!sel)return;const w=WORKS[CATSEL]||[];
  sel.disabled=!CATSEL;
  sel.innerHTML='<option value="">'+esc(FEN()?"All work":"सभी काम")+'</option>'+w.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===WORKSEL?' selected':'')+'>'+esc(x[0])+' ('+x[1]+')</option>').join("");
  sel.className=WORKSEL?"on":"";}
async function loadWorks(cat){if(!cat||WORKS[cat])return;
  try{const u=new URL(SB+"/rest/v1/businesses");u.searchParams.set("select","description");u.searchParams.set("is_active","eq.true");u.searchParams.set("deleted_at","is.null");u.searchParams.set("category","eq."+cat);u.searchParams.set("limit","400");
    const r=await fetch(u,{headers:H});const d=await r.json();if(!r.ok||!Array.isArray(d))return;
    const m={};d.forEach(b=>{const x=String(b.description||"").match(/Subcategory:\s*(.+)/);if(x){const k=x[1].trim();if(k)m[k]=(m[k]||0)+1;}});
    WORKS[cat]=Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));}catch(e){}
  if(CATSEL===cat)drawWork();}
function autoCat(q){if(CATMAN)return;let g="";for(const [k,re] of GUESS){if(re.test(q)){g=k;break;}}
  if(g!==CATSEL){CATSEL=g;WORKSEL="";drawCat(true);drawWork();if(g)loadWorks(g);}else if(g)drawCat(true);}
(function(){const P0=new URLSearchParams(location.search);const c0=P0.get("cat");if(FCATS.includes(c0)){CATSEL=c0;CATMAN=true;WORKSEL=P0.get("work")||"";loadWorks(c0);}
  drawCat(false);drawWork();
  $("fCat").onchange=function(){CATSEL=this.value;CATMAN=true;WORKSEL="";drawCat(false);drawWork();if(CATSEL)loadWorks(CATSEL);run(true);};
  $("fWork").onchange=function(){WORKSEL=this.value;drawWork();run(true);};})();
let reqN=0;
async function run(push){
  const q=$("q").value.trim(),city=$("city").value.replace(/[^\p{L}\p{M}\p{N} .-]/gu," ").replace(/\s+/g," ").trim(),list=$("list"),cnt=$("count");
  if(push){const u=new URL(location.href);u.searchParams.set("q",q);city?u.searchParams.set("city",city):u.searchParams.delete("city");history.replaceState(null,"",u);}
  const ts=terms(q);
  autoCat(q);
  if(push){const u=new URL(location.href);CATSEL?u.searchParams.set("cat",CATSEL):u.searchParams.delete("cat");WORKSEL?u.searchParams.set("work",WORKSEL):u.searchParams.delete("work");history.replaceState(null,"",u);}
  if(!ts.length&&!city&&!CATSEL){cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("s_empty"))+'</p>';return;}
  const n=++reqN;
  cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("loading"))+'</p>';
  if(JOBQ.test(q))return runJobs(q,city,n);   /* "hiring / job / नौकरी" → नौकरी वाली दुकानें (sql-26) */
  const u=new URL(SB+"/rest/v1/businesses");
  u.searchParams.set("select","name,slug,address,description,category,rating,review_count,is_verified,latitude,longitude");   /* phone/whatsapp nahi: sirf login ke baad business page par */
  u.searchParams.set("is_active","eq.true");
  u.searchParams.set("deleted_at","is.null");
  u.searchParams.set("limit","60");
  const gs=ts.map(group);
  const cid=city&&(window.PB_CITY_IDS||{})[city.toLowerCase()];                 /* Approve हुआ शहर: city_id से भी (पते में शहर न लिखा हो तब भी मिले) */
  if(city)gs.push("or("+(cid?"city_id.eq."+cid+",":"")+"address.ilike.*"+city+"*,description.ilike.*"+city+"*)");
  if(CATSEL)u.searchParams.set("category","eq."+CATSEL);
  if(WORKSEL)u.searchParams.append("description","ilike.*Subcategory: "+WORKSEL.replace(/[*,()]/g," ")+"*");
  if(gs.length===1)u.searchParams.set("or",gs[0].slice(3,-1));else if(gs.length>1)u.searchParams.set("and","("+gs.join(",")+")");
  try{
    const r=await fetch(u,{headers:H});const data=await r.json();
    if(n!==reqN)return;
    if(!r.ok)throw new Error(data&&data.message||"x");
    const rk=b=>{const v=+b.review_count||0,r=+b.rating||0;return (v*r+3*3.5)/(v+3);};   /* star + कितनों ने दी, दोनों; बिना rating = 3.5 */
    let rows=data.map(b=>(b._s=score(b,ts),b)).sort((a,b)=>b._s-a._s||(rk(b)-rk(a))||String(a.name).localeCompare(b.name));
    rows=await premiumFirst(rows);if(n!==reqN)return;
    render(rows,q,city);
  }catch(e){if(n===reqN){cnt.textContent="";list.innerHTML='<p class="note">'+esc(T("err"))+'</p>';}}
}
/* 💼 नौकरी वाली दुकानें — पास वाली पहले (location की इजाज़त पहले से हो तो) */
const JOBQ=/(^|\s)(hiring|hire|vacancy|vacancies|job|jobs|naukri|nokri|नौकरी|नौकरियाँ|नौकरियां|भर्ती|वैकेंसी|जॉब)(\s|$)/i;
function myPos(){return new Promise(res=>{try{if(!navigator.geolocation||!navigator.permissions)return res(null);
  navigator.permissions.query({name:"geolocation"}).then(st=>{if(st.state!=="granted")return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({la:p.coords.latitude,ln:p.coords.longitude}),()=>res(null),{timeout:4000,maximumAge:600000});}).catch(()=>res(null));}catch(e){res(null);}});}
function kmTo(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.la-a.la),dn=r(b.ln-a.ln),h=Math.sin(dl/2)**2+Math.cos(r(a.la))*Math.cos(r(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
async function runJobs(q,city,n){
  const list=$("list"),cnt=$("count"),en=PB.lang&&PB.lang()!=="hi";
  let rows=[];
  try{const r=await fetch(SB+"/rest/v1/rpc/pb_vacancy_shops",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:"{}"});rows=r.ok?(await r.json()||[]):[];}catch(e){rows=[];}
  if(n!==reqN)return;
  if(city){const c=city.toLowerCase();rows=rows.filter(b=>String(b.address||"").toLowerCase().includes(c)||String(cityOf(b)||"").toLowerCase().includes(c));}
  const me=await myPos();if(n!==reqN)return;
  rows.forEach(b=>{b._km=me&&+b.latitude&&+b.longitude?kmTo(me,{la:+b.latitude,ln:+b.longitude}):null;});
  if(me)rows.sort((a,b)=>(a._km==null?1e9:a._km)-(b._km==null?1e9:b._km));
  cnt.textContent=rows.length?(en?rows.length+" shops are hiring":rows.length+" दुकानों में नौकरी खाली है")+(city?" · "+city:""):"";
  if(window.PBT)PBT.once(rows.length?"search":"search0",q);
  if(!rows.length){list.innerHTML='<div class="empty"><p>'+esc(en?"No shop is hiring right now"+(city?" in "+city:"")+".":"अभी"+(city?" "+city+" में":"")+" किसी दुकान में नौकरी खाली नहीं है।")+'</p></div>';return;}
  list.innerHTML=rows.map(b=>{const link="business.html?slug="+encodeURIComponent(b.slug||"")+"#hiring",ct=cityOf(b);
    return '<article class="card jobc"><a class="jl" href="'+link+'">'+(window.PBHire?PBHire.tile(52):'💼')+'<div class="jt"><h2>'+esc(b.name)+'</h2>'+
      (b.role?'<p class="jr">💼 '+esc(b.role)+(b.count?' · '+esc(b.count)+(en?" needed":" लोग चाहिए"):'')+'</p>':'<p class="jr">💼 '+esc(en?"Hiring":"नौकरी खाली है")+'</p>')+
      '<p class="jm">'+[b.salary?'💰 '+esc(b.salary):'',b.timing?'🕘 '+esc(b.timing):''].filter(Boolean).join(' · ')+'</p>'+
      '<p class="addr">📍 '+esc(ct||b.address||"")+(b._km!=null?' · '+(b._km<1?Math.round(b._km*1000)+" m":b._km.toFixed(1)+" km")+(en?" away":" दूर"):'')+'</p></div></a>'+
      '<div class="acts"><a class="call" href="'+link+'">'+esc(en?"💼 See job details":"💼 नौकरी की जानकारी देखें")+'</a></div></article>';}).join("");
}
/* 💎 Premium (sql-23): Premium दुकानें सबसे ऊपर — हर बार अलग क्रम (rotation), ताकि सबको बराबर मौका मिले */
let PREMS={};
async function premiumFirst(rows){
  if(!(window.PB_SITE&&PB_SITE.premium)||!rows||!rows.length||!window.PBPlan)return rows;
  try{await PBPlan.load(rows.map(b=>b.slug).filter(Boolean));}catch(e){return rows;}
  PREMS={};rows.forEach(b=>{if(PBPlan.paid(b.slug))PREMS[b.slug]=PBPlan.tier(b.slug);});
  /* plan में "ऊपर दिखना" ON: Platinum → Gold → Silver, हर समूह के अंदर हर बार अलग क्रम */
  const R={platinum:3,gold:2,silver:1},top=rows.filter(b=>PBPlan.has(b.slug,"top")),o=rows.filter(b=>!PBPlan.has(b.slug,"top"));
  for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]];}
  top.sort((a,b)=>(R[PBPlan.tier(b.slug)]||0)-(R[PBPlan.tier(a.slug)]||0));
  return top.concat(o);
}
function premTags(b){const t=PREMS[b.slug];if(!t)return "";const en=PB.lang&&PB.lang()!=="hi",ic={silver:"🥈",gold:"👑",platinum:"💎"}[t]||"💎";return (PBPlan.has(b.slug,"top")?'<span class="tag feat">⭐ Featured</span>':'')+'<span class="tag prem pt-'+t+'"><i>'+ic+'</i>'+esc(PBPlan.name(t,true))+' Member</span>';}
const PGN=6;let PGI=0,PGK="";
function render(rows,q,city,keep){
  const list=$("list"),label=[q,city,CATSEL?catName(CATSEL):"",WORKSEL].filter(Boolean).join(" · ");
  const pk0=label+"|"+CATSEL+"|"+WORKSEL;if(!keep){if(PGK!==pk0)PGI=0;PGK=pk0;}
  const total=rows.length,pages=Math.max(1,Math.ceil(total/PGN));if(PGI>=pages)PGI=pages-1;const allRows=rows;rows=rows.slice(PGI*PGN,PGI*PGN+PGN);
  $("count").textContent=total?T("found",{n:total})+" · "+T("s_for",{q:label}):"";
  if(label&&window.PBT)PBT.once(total?"search":"search0",label);   /* traffic: क्या खोजा, नतीजा मिला या नहीं */
  if(!rows.length){
    list.innerHTML='<div class="empty"><p>'+esc(T("s_none",{q:label}))+'</p><p>'+esc(T("s_tip"))+'</p><p style="margin-top:14px">'+esc(T("addq"))+'</p><a class="btn" href="list.html">'+esc(T("add"))+'</a></div>';
    return;
  }
  list.innerHTML=rows.map(b=>{
    const dir=pbDir(b);
    const link="business.html?slug="+encodeURIComponent(b.slug||""),ct=cityOf(b),cg=catOf(b);
    return '<article class="card'+(PREMS[b.slug]?' isprem':'')+'"><div class="info"><h2><a href="'+link+'">'+esc(b.name)+'</a></h2><div class="tags">'+
      premTags(b)+(cg?'<span class="tag">'+esc(cg)+'</span>':'')+(ct?'<span class="tag city">📍 '+esc(ct)+'</span>':'')+(b.is_verified?'<span class="tag ver">'+esc(T("ver"))+'</span>':'')+
      '</div></div>'+(b.address?'<p class="addr">'+esc(b.address)+'</p>':'')+
      '<div class="acts"><a class="call" href="'+link+'#contact">'+esc("📞 "+T("c_title"))+'</a>'+
      (dir?'<a href="'+esc(dir)+'">'+esc(T("dir"))+'</a>':'')+
      '<a href="'+link+'">'+esc(T("details"))+'</a></div></article>';
  }).join("");
  if(pages>1){const en=PB.lang&&PB.lang()!=="hi";
    list.insertAdjacentHTML("beforeend",'<nav class="pgn" aria-label="Pages"><button type="button" id="pgPrev"'+(PGI<=0?' disabled':'')+'>‹ '+(en?"Previous":"पिछला")+'</button><span>'+(PGI+1)+' / '+pages+'</span><button type="button" id="pgNext"'+(PGI>=pages-1?' disabled':'')+'>'+(en?"Next":"अगला")+' ›</button></nav>');
    const go=d=>{PGI+=d;render(allRows,q,city,true);const c=$("count");if(c)c.scrollIntoView({behavior:"smooth",block:"start"});};
    $("pgPrev").onclick=()=>go(-1);$("pgNext").onclick=()=>go(1);}
}

const P=new URLSearchParams(location.search);
$("q").value=P.get("q")||"";
if(P.get("city"))$("city").value=P.get("city");
/* 📍 शहर: बाहर (home) की तरह — याद रखा शहर अपने-आप, और GPS बटन से अपनी location का शहर */
if(!P.get("city")){try{const c0=localStorage.getItem("pb-city");if(c0)$("city").value=c0;}catch(e){}}
(function(){
  const g=document.getElementById("gpsBtn"),inp=$("city");if(!g||!inp)return;
  const en=()=>PB.lang&&PB.lang()!=="hi";
  const LL={"Gandhidham":[23.0753,70.1337],"Adipur":[23.0717,70.0886],"Anjar":[23.1132,70.0283],"Bhuj":[23.2420,69.6669],"Mundra":[22.8390,69.7210],"Mandvi":[22.8324,69.3532],"Nakhatrana":[23.3474,69.2645],"Bhachau":[23.2964,70.3437],"Rapar":[23.5721,70.6432],"Naliya":[23.2606,68.8269],"Dayapar":[23.6380,68.9010]};
  function done(c){if(!c)return;inp.value=c;try{localStorage.setItem("pb-city",c);localStorage.setItem("pb-city-by","me");}catch(e){}run(true);}
  function note(t){let d=document.getElementById("locMsg");if(!d){d=document.createElement("div");d.id="locMsg";d.style.cssText="position:fixed;left:12px;right:12px;top:70px;z-index:99;background:#fff4e5;color:#7a3b00;border:1px solid #fedf89;border-radius:12px;padding:10px 12px;font-size:13.5px";document.body.appendChild(d);}d.textContent=t;d.hidden=false;clearTimeout(d._t);d._t=setTimeout(()=>{d.hidden=true;},7000);d.onclick=()=>{d.hidden=true;};}
  g.addEventListener("click",e=>{e.preventDefault();
    if(!navigator.geolocation){note(en()?"Location not available":"Location नहीं मिली");return;}
    const old=inp.value,ph=inp.placeholder;inp.value="";inp.placeholder=en()?"Finding your location…":"Location ढूँढ रहे हैं…";g.classList.add("busy");
    const fail=t=>{g.classList.remove("busy");inp.value=old;inp.placeholder=ph;if(t)note(t);};
    navigator.geolocation.getCurrentPosition(p=>{
      g.classList.remove("busy");inp.placeholder=ph;
      const la=p.coords.latitude,ln=p.coords.longitude;let best=null,bd=1e9;
      Object.keys(LL).forEach(c=>{const dy=(LL[c][0]-la)*111,dx=(LL[c][1]-ln)*111*Math.cos(la*Math.PI/180),d=Math.hypot(dx,dy);if(d<bd){bd=d;best=c;}});
      if(best&&bd<35){done(best);return;}
      fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la.toFixed(4)+"&longitude="+ln.toFixed(4)+"&localityLanguage=en")
        .then(r=>r.json()).then(d=>{const c=d.city||d.locality||"";if(c)done(c);else fail(en()?"Could not find your city. Please type it.":"शहर नहीं मिला। कृपया लिखें।");})
        .catch(()=>fail(en()?"Could not find your city. Please type it.":"शहर नहीं मिला। कृपया लिखें।"));
    },err=>{fail(err&&err.code===1?(en()?"Location permission is blocked for this site. Allow it in browser settings.":"इस site के लिए Location की इजाज़त बंद है। Browser की settings में इजाज़त दें।"):(en()?"Could not get your location. Turn on GPS and try again.":"Location नहीं मिली। GPS चालू करके दोबारा दबाएँ।"));},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
})();
$("sform").onsubmit=e=>{e.preventDefault();$("q").blur();run(true);};
$("city").onchange=()=>run(true);
window.PB_CITY_RERUN=()=>{if($("city").value.trim())run(false);};
PB.apply();PB.mount($("pbLang"));
PB.onChange(()=>{PB.apply();drawCat(!CATMAN);drawWork();run(false);});
run(false);
if(!P.get("q"))$("q").focus();
</script>
<script>

  .then(function(r){return r.ok?r.json():[];}).then(function(L){
