<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>पेज नहीं मिला — PataBook</title>
<link rel="icon" href="pin.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#e8f1ff 0%,#fff 60%);color:#12141c;text-align:center;padding:24px;box-sizing:border-box}
.c{max-width:380px}
.big{font-size:52px}
h1{font-size:22px;color:#0b2f73;margin:10px 0 6px}
p{color:#5b6475;line-height:1.55;margin:0 0 20px}
a{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:13px 22px;margin:4px}
a.s{background:#eef2fb;color:#174ea6}
</style>
</head>
<body>
<div class="c" id="cc">
  <div class="big">🔍</div>
  <h1 id="h">यह पेज नहीं मिला</h1>
  <p id="p">हो सकता है यह link पुराना हो या बदल गया हो।</p>
  <a href="/" id="a1">🏠 PataBook होम</a>
  <a class="s" href="/search.html" id="a2">दुकान खोजें</a>
</div>
<script>
try{if(localStorage.getItem('pb-lang')==='en'){document.documentElement.lang='en';document.title='Page not found — PataBook';
h.textContent='This page could not be found';p.textContent='The link may be old or may have changed.';a1.textContent='🏠 PataBook Home';a2.textContent='Search shops';}}catch(e){}
</script>
<script>
/* patabook.in/<दुकान-का-नाम> — दुकानदार का अपना छोटा link: Supabase से दुकान ढूँढकर सीधे उसके पेज पर */
(function(){
  var n=decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,"").toLowerCase();
  if(!/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(n)||/--/.test(n))return;
  var c=document.getElementById("cc");c.style.visibility="hidden";
  var back=function(){c.style.visibility="visible";};
  var t=setTimeout(back,4000);
  fetch("https://kkvbpzysktozghnxplxv.supabase.co/rest/v1/rpc/pb_link_resolve",{method:"POST",headers:{apikey:"sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8","Content-Type":"application/json"},body:JSON.stringify({p_link:n})})
   .then(function(r){return r.ok?r.json():null;}).then(function(slug){
     if(typeof slug==="string"&&slug){clearTimeout(t);location.replace("/business.html?slug="+encodeURIComponent(slug)+location.hash);}else{back();}
   }).catch(back);
})();
</script>
<div>
</div>
</body>
</html>
