function bizDist(){const el=document.getElementById("bDist");if(!el||!B)return;const la=+B.latitude,ln=+B.longitude;

  const R=6371,r=Math.PI/180,dLa=(la-MYPOS[0])*r,dLn=(ln-MYPOS[1])*r,a=Math.sin(dLa/2)**2+Math.cos(MYPOS[0]*r)*Math.cos(la*r)*Math.sin(dLn/2)**2,km=2*R*Math.asin(Math.sqrt(a));

  parts=parts.filter((x,i)=>!parts.some((y,j)=>j!==i&&y.length>x.length&&y.toLowerCase().includes(x.toLowerCase()))&&parts.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i);
  let t=parts.join(", ");const low=()=>t.toLowerCase();
  [line(b,"Area"),city].forEach(x=>{x=String(x||"").trim();if(x&&!low().includes(x.toLowerCase()))t+=(t?", ":"")+x;});
  t=t.split(" ").map(tcase).join(" ");

function openStatus(b){
  const en=PB.lang&&PB.lang()!=="hi",h=line(b,"Hours"),off=line(b,"Closed"),m=h.match(/^(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);if(!m)return null;
  const a=+m[1]*60+ +m[2],z=+m[3]*60+ +m[4],now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"})),cur=now.getHours()*60+now.getMinutes();
  const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],today=DN[now.getDay()];
  const isOpen=today!==off&&(a<=z?cur>=a&&cur<z:cur>=a||cur<z);
  const at=t=>hm12(t),openT=m[1]+":"+m[2],closeT=m[3]+":"+m[4];
  if(isOpen)return {open:true,t:en?"Open now · closes "+at(closeT):"अभी खुला है · "+at(closeT)+" पर बंद होगा"};
  if(today!==off&&cur<a)return {open:false,t:en?"Closed now · opens today "+at(openT):"अभी बंद · आज "+at(openT)+" पर खुलेगा"};
  for(let d=1;d<=7;d++){const dn=DN[(now.getDay()+d)%7];if(dn===off)continue;
    const when=d===1?(en?"tomorrow":"कल"):(en?dn:(DAY_HI[dn]||dn)+" को");
    return {open:false,t:en?"Closed now · opens "+when+" "+at(openT):"अभी बंद · "+when+" "+at(openT)+" पर खुलेगा"};}
  return {open:false,t:en?"Closed now":"अभी बंद"};
}

    '<div style="display:flex;gap:10px"><button type="button" id="repX" style="flex:1;border:1px solid #d0d7e2;background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer">'+esc(L("बंद करें","Cancel"))+'</button>'+

/* पहले बिना लॉगिन वाला नंबर (pb_public_contact: Live दुकान + मालिक का स्विच ON हो तो) */
async function loadContact(){
  contactState={k:"loading"};drawContact();
  try{
    const r0=await fetch(SB+"/rest/v1/rpc/pb_public_numbers",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slug:slug})});
    if(r0.ok){const j=await r0.json();const N=(Array.isArray(j)?j:[]).sort((x,y)=>x.slot-y.slot).map(x=>String(x.phone||"").replace(/\D/g,"").slice(-10)).filter(x=>/^\d{10}$/.test(x));
      contactState=N.length?{k:"ok",phone:N[0],whatsapp:N[0],nums:N}:{k:"off"};drawContact();return;}
    let m0="";try{const j=await r0.json();m0=(j&&(j.message||j.msg))||"";}catch(_){}
    if(/rate limit/i.test(m0)){contactState={k:"busy"};drawContact();return;}
  }catch(e){}
  try{
    const r=await fetch(SB+"/rest/v1/rpc/pb_public_contact",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slug:slug})});
    if(r.ok){const j=await r.json();const c=Array.isArray(j)?j[0]:j;
      contactState=c&&(c.phone||c.whatsapp)?{k:"ok",phone:c.phone,whatsapp:c.whatsapp}:{k:"off"};drawContact();return;}
    let m="";try{const j=await r.json();m=(j&&(j.message||j.msg))||"";}catch(_){}
    if(/rate limit/i.test(m)){contactState={k:"busy"};drawContact();return;}
  }catch(e){}
  /* sql-03 अभी नहीं चला: पुराना तरीका (लॉगिन के बाद नंबर) */
  const s=await PBA.session();
  if(!s){contactState={k:"locked"};drawContact();return;}
  contactState={k:"loading"};drawContact();
  try{const c=await PBA.contact(slug);contactState=c?{k:"ok",phone:c.phone,whatsapp:c.whatsapp}:{k:"setup"};}
  catch(e){
    if(/daily limit/i.test(e.message))contactState={k:"limit"};
    else if(/login required|JWT|expired/i.test(e.message)){await PBA.logout();contactState={k:"locked"};}
    else contactState={k:"setup"};
  }
  drawContact();
}
