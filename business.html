<script>
function pbDir(b){const n=encodeURIComponent(b.name||""),a=encodeURIComponent(b.address||"");if(b.latitude!=null&&b.longitude!=null&&isFinite(+b.latitude)&&isFinite(+b.longitude))return "map.html?to="+(+b.latitude)+","+(+b.longitude)+"&n="+n+"&a="+a;return b.address?"map.html?q="+a+"&n="+n:"";}

const SB="https://kkvbpzysktozghnxplxv.supabase.co";
const KEY="sb_publishable_MnvGh8-r8s_XhrtbqFztFQ_jbCp71x8";
const T=(k,v)=>PB.t(k,v);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const slug=new URLSearchParams(location.search).get("slug")||"";
const line=(b,k)=>{const m=String(b.description||"").match(new RegExp("^"+k+":\\s*(.+)$","mi"));return m?m[1].trim():"";};
let B=null,contactState={k:"loading"};

/* NOTE: phone / whatsapp yahan public API se kabhi nahi maange jaate. Sirf login ke baad pb_contact() se. */
async function load(){
  const app=document.getElementById("app");
  if(!slug){app.innerHTML='<div class="card"><h1>'+esc(T("b_nf"))+'</h1><p class="desc">'+esc(T("b_noslug"))+'</p></div>';return;}
  const u=new URL(SB+"/rest/v1/businesses");
  const COLS="name,slug,address,description,category,website,is_verified,rating,review_count,latitude,longitude";
  u.searchParams.set("select",COLS+",business_code,home_service");
  u.searchParams.set("slug","eq."+slug);u.searchParams.set("limit","1");
  try{
    u.searchParams.set("select",COLS+",business_code,home_service,logo_url");
    let r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
    if(!r.ok){u.searchParams.set("select",COLS+",business_code,home_service");r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});}   /* logo column से पहले */
    if(!r.ok){u.searchParams.set("select",COLS+",business_code");r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});}   /* sql-06 से पहले */
    if(!r.ok){u.searchParams.set("select",COLS);r=await fetch(u,{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});}   /* sql-05 से पहले */
    const rows=await r.json();
    if(!r.ok||!rows.length){app.innerHTML='<div class="card"><h1>'+esc(T("b_nf"))+'</h1><p class="desc">'+esc(T("b_na"))+'</p></div>';return;}
    B=rows[0];document.title=B.name+" — PataBook";try{const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute("content",(B.name+" — "+[B.category,line(B,"City")||""].filter(Boolean).join(", ")+". पता, Call, WhatsApp और रास्ता PataBook पर।").slice(0,300));}catch(_){}
    render();bizDist();loadPrem();loadNear();loadContact();loadVac();loadVacFlag();
    if(location.hash==="#contact"){const c=document.getElementById("contact");if(c)setTimeout(()=>c.scrollIntoView({behavior:"smooth",block:"start"}),150);}

     (/^yes$/i.test(line(b,"Delivery"))?'<span class="tag" style="background:#fff4e5;color:#874d00">🚚 '+((PB.lang&&PB.lang()==="en")?"Home Delivery":"होम डिलीवरी")+'</span>':'')+
     (b.home_service?'<span class="tag" style="background:#e7f8ee;color:#137333">🏠 '+((PB.lang&&PB.lang()==="en")?"Home Service":"Home Service उपलब्ध")+'</span>':'')+(b.rating?'<span class="tag rt">★ '+esc(b.rating)+(b.review_count?' ('+esc(b.review_count)+')':'')+'</span>':'')+
   '</div>'+(ost?'<div class="bst'+(ost.open?' op':'')+'"><i></i>'+esc(ost.t)+'</div>':'')+
   (addr?'<div class="addr"><span class="pn">📍</span><div><b>'+esc(addr)+'</b>'+(sub2?'<small>'+esc(sub2)+'</small>':'')+(lmk?'<span class="lmk">🏁 '+esc(en?"Landmark: ":"पहचान: ")+esc(lmk)+'</span>':'')+'</div></div>'+
     '':'')+
   (PRODP().length?'<a class="profb" href="shop.html?slug='+encodeURIComponent(b.slug)+'"><span>🏪</span>'+esc(en?"Profile":"प्रोफ़ाइल")+'</a><div id="prods"></div>':'')+
   (GALP().length?'<div class="mos n'+(GALP().length>=5?5:GALP().length===4?3:GALP().length)+'" id="galM"></div>':'')+
   staticMap(b,map)+
   '<div class="rows">'+rows.map(r=>'<div class="row"><span>'+esc(r[0])+'</span><b>'+esc(r[1]).replace(/\n/g,'<br>')+'</b></div>').join("")+
     (/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(line(b,"Email"))?'<div class="row"><span>Email</span><b><a href="mailto:'+esc(line(b,"Email"))+'">'+esc(line(b,"Email"))+'</a></b></div>':'')+
     (web?'<div class="row"><span>'+esc(T("b_web"))+'</span><b><a target="_blank" rel="noopener" href="'+esc(web)+'">'+esc(web.replace(/^https?:\/\//,""))+'</a></b></div>':'')+
   '</div>'+(rows.length?'':'<p class="desc">'+esc(T("b_def"))+'</p>')+
   (b.home_service?'<button type="button" disabled style="margin-top:12px;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;background:#e4e8ef;color:#667085;cursor:not-allowed">🏠 '+((PB.lang&&PB.lang()==="en")?"Book Home Service — coming soon":"घर पर सेवा बुक करें — जल्द शुरू होगा")+'</button>':'')+
   (b.business_code?'<p style="margin-top:10px;font-size:11.5px;color:#8a93a3;letter-spacing:.03em">Business ID: '+esc(b.business_code)+'</p>':'')+'</section>'+
   
   '<section class="card" id="gal" hidden><h2>🖼️ '+esc(en?"Photos":"फ़ोटो")+'</h2><div class="gal" id="galBox"></div></section>'+
   '<div id="vacFlag" style="display:none;flex-direction:column;gap:3px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#fff7e6;border:1px solid #ffd591;color:#874d00;font-size:14px"></div>'+
   '<section class="card" id="contact"><h2>📞 '+esc(T("c_title"))+'</h2><div id="cbox"></div>'+(map?'<a class="cdir" href="'+esc(map)+'"><span>🧭</span>'+esc(en?"Directions to the shop":"दुकान का रास्ता देखें")+'</a>':'')+'</section>'+
   '<section class="card" id="vac" hidden><h2>💼 '+((PB.lang&&PB.lang()==="en")?"Hiring now":"नौकरी खाली है")+'</h2><div id="vbox"></div></section>'+
   '<a class="shr" id="waShare" href="'+esc(waLink(b,addr))+'" target="_blank" rel="noopener"><span class="ic">📤</span><span><b>'+esc(en?"Send this shop to friends":"यह दुकान दोस्तों को भेजें")+'</b><small>'+esc(en?"Name, address and link on WhatsApp":"नाम, पता और link WhatsApp पर")+'</small></span><span class="go">'+esc(en?"Send":"भेजें")+'</span></a>'+
   '<p style="text-align:center;margin:-2px 0 12px"><button type="button" id="cardBtn" style="border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:#1a73e8;cursor:pointer">🪪 '+esc(en?"Make a shop card (photo)":"दुकान का कार्ड (फ़ोटो) बनाएँ")+'</button></p>'+
   '<section class="card" id="near" hidden><h2>📍 '+esc(en?"Other shops nearby":"पास की दूसरी दुकानें")+'</h2><div class="near" id="nearBox"></div></section>'+

    PBCard.open({slug:b.slug,name:b.name,category:b.category,sub:sub,owner:line(b,"Owner"),address:b.address,city:city,phone:"",code:b.business_code||"",visitor:true});};

/* शिकायत / Report (Google Play नियम: users गलत/नकली listing की शिकायत कर सकें) — admin पैनल में जाती है */
function openReport(){
  const en=PB.lang&&PB.lang()==="en",L=(h,e)=>en?e:h;
  const R=[["wrong_info",L("गलत जानकारी (नंबर / पता / नाम)","Wrong information (number / address / name)")],
           ["closed",L("दुकान बंद हो गई / मौजूद नहीं","Shop closed / does not exist")],
           ["fake",L("नकली या धोखाधड़ी","Fake or fraud")],
           ["offensive",L("गलत / आपत्तिजनक फोटो या शब्द","Offensive photo or text")],
           ["other",L("कुछ और","Something else")]];
  const old=document.getElementById("repSheet");if(old)old.remove();
  const w=document.createElement("div");w.id="repSheet";
  w.setAttribute("style","position:fixed;inset:0;z-index:9999;background:rgba(10,20,40,.45);display:flex;align-items:flex-end;justify-content:center");
  w.innerHTML='<form style="background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 20px;box-sizing:border-box;max-height:90vh;overflow:auto">'+
    '<h2 style="margin:0 0 4px;font-size:18px;color:#0b2f73">🚩 '+esc(L("शिकायत करें","Report this listing"))+'</h2>'+
    '<p style="margin:0 0 10px;font-size:13px;color:#5b6475">'+esc(B&&B.name||"")+'</p>'+
    R.map((r,i)=>'<label style="display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid #eef1f6;font-size:15px;cursor:pointer"><input type="radio" name="rr" value="'+r[0]+'"'+(i?'':' required')+'>'+esc(r[1])+'</label>').join("")+
    '<textarea id="repNote" maxlength="500" rows="3" placeholder="'+esc(L("कुछ और बताना हो तो लिखें (ज़रूरी नहीं)","Add details (optional)"))+'" style="width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #d0d7e2;border-radius:10px;padding:10px;font:inherit;font-size:14px"></textarea>'+
    '<p id="repMsg" style="min-height:18px;margin:8px 0;font-size:13.5px"></p>'+
    '<div style="display:flex;gap:10px"><button type="button" id="repX" style="flex:1;border:1px solid #d0d7e2;background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer">'+esc(L("बंद करें","Cancel"))+'</button>'+
    '<button type="submit" id="repGo" style="flex:1;border:0;background:#d92d20;color:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer">'+esc(L("शिकायत भेजें","Send report"))+'</button></div></form>';
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.addEventListener("click",e=>{if(e.target===w)close();});
  w.querySelector("#repX").onclick=close;
  w.querySelector("form").onsubmit=async e=>{
    e.preventDefault();
    const sel=w.querySelector('input[name="rr"]:checked'),msg=w.querySelector("#repMsg"),go=w.querySelector("#repGo");
    if(!sel){msg.style.color="#b42318";msg.textContent=L("कारण चुनें","Choose a reason");return;}
    go.disabled=true;msg.style.color="#5b6475";msg.textContent="…";
    try{
      const r=await fetch(SB+"/rest/v1/rpc/pb_report_add",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},
        body:JSON.stringify({p_slug:slug,p_reason:sel.value,p_note:w.querySelector("#repNote").value||null})});
      if(r.ok){msg.style.color="#137333";msg.textContent="✅ "+L("शिकायत मिल गई। हमारी टीम जाँच करेगी, धन्यवाद।","Thanks — our team will review this listing.");go.style.display="none";w.querySelector("#repX").textContent=L("ठीक है","OK");return;}
      let m="";try{const j=await r.json();m=(j&&j.message)||"";}catch(_){}
      if(/too many/i.test(m)){msg.style.color="#b42318";msg.textContent=L("आज बहुत शिकायतें भेजी जा चुकी हैं, कल कोशिश करें।","Too many reports today, please try tomorrow.");go.disabled=false;return;}
      throw new Error(m||r.status);
    }catch(err){
      msg.style.color="#b42318";
      msg.innerHTML=esc(L("अभी नहीं भेज पाए। ईमेल करें: ","Could not send. Please email: "))+'<a href="mailto:patabook.in@gmail.com?subject='+encodeURIComponent("Report: "+(B&&B.name||slug))+'">patabook.in@gmail.com</a>';
      go.disabled=false;
    }
  };
}
/* 💼 मुफ़्त "Vacancy available" switch (sql-13) */
let VACF=null;
async function loadVacFlag(){
  try{const r=await fetch(SB+"/rest/v1/rpc/pb_vacancy_status",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slugs:[slug]})});
    if(!r.ok)return;const j=await r.json();VACF=j&&j[slug]?j[slug]:null;}catch(e){return;}
  drawVacFlag();
}
function drawVacFlag(){
  const el=document.getElementById("vacFlag");if(!el)return;
  if(!VACF){el.style.display="none";return;}
  const en=PB.lang&&PB.lang()==="en";el.style.display="flex";
  el.innerHTML='<b>💼 '+(en?"Vacancy available":"नौकरी खाली है (Vacancy)")+'</b><span>'+(en?"This shop is hiring. Contact the shop for details.":"यह दुकान स्टाफ ढूँढ रही है। जानकारी के लिए दुकान से संपर्क करें।")+'</span>';
}
/* इस दुकान की चालू vacancies (₹499 plan वाली) */
let VAC=null;
async function loadVac(){
  if(!(window.PB_SITE&&(PB_SITE.jobs||PB_SITE.premium)))return;
  try{const r=await fetch(SB+"/rest/v1/rpc/pb_public_jobs",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_city:null,p_q:null,p_slug:slug})});
    VAC=r.ok?await r.json():[];}catch(e){VAC=[];}
  drawVac();
}
function drawVac(){
  const sec=document.getElementById("vac"),box=document.getElementById("vbox");if(!sec||!box)return;
  if(!VAC||!VAC.length){sec.hidden=true;return;}
  const en=PB.lang&&PB.lang()==="en";sec.hidden=false;
  box.innerHTML=VAC.map(j=>'<div style="border:1px solid #e4eaf5;border-radius:12px;padding:10px 12px;margin-top:8px"><b style="color:#0b2f73">'+esc(j.title)+'</b><div style="font-size:13px;color:#5b6475;margin-top:3px;line-height:1.5">'+[j.salary&&("💰 "+esc(j.salary)),j.timing&&("🕘 "+esc(j.timing)),"👥 "+(j.openings||1)].filter(Boolean).join(" · ")+'</div></div>').join("")+
    (window.PB_SITE&&PB_SITE.jobs?'<a href="jobs.html?city=&q='+encodeURIComponent(B.name||"")+'#job-'+VAC[0].id+'" style="display:block;text-align:center;margin-top:10px;font-weight:700;color:#1a73e8;text-decoration:none">'+(en?"Apply / contact on the Jobs page ›":"नौकरी पेज पर देखें / संपर्क करें ›")+'</a>':'');
}
function lockHTML(){
  const go=esc(PBA.loginUrl("business.html?slug="+encodeURIComponent(slug)));
  return '<a class="lock" href="'+go+'">'+esc(T("lock_ph"))+'</a><a class="lock wa" href="'+go+'">'+esc(T("lock_wa"))+'</a>';
}
function drawContact(){
  const el=document.getElementById("cbox");if(!el)return;
  const s=contactState,who=PBA.current();
  const whoLine=who?'<p class="who">'+esc(T("l_in",{e:who.email||""}))+'<button type="button" id="lo">'+esc(T("l_out"))+'</button></p>':'';
  if(s.k==="loading"){el.innerHTML='<p class="cnote">…</p>';return;}
  if(s.k==="locked"){el.innerHTML=lockHTML();return;}
  if(s.k==="busy"){
    const en=PB.lang&&PB.lang()==="en";
    el.innerHTML='<p class="cnote">'+(en?"Too many numbers were viewed from your connection. Please try again in a while.":"आपके इंटरनेट से बहुत ज़्यादा नंबर देखे गए हैं। थोड़ी देर बाद दोबारा कोशिश करें।")+'</p>';
  }else if(s.k==="off"){
    const en=PB.lang&&PB.lang()==="en";
    el.innerHTML='<div class="num" style="filter:grayscale(1);opacity:.6"><div class="l"><small>📱 Mobile</small><b>'+(en?"Not shared":"नंबर बंद है")+'</b></div><a aria-disabled="true" style="pointer-events:none">'+esc(T("call"))+'</a></div>'+
      '<p class="cnote">'+(en?"The shop owner has kept the number private.":"दुकानदार ने अपना नंबर सार्वजनिक नहीं रखा है।")+'</p>';
  }else if(s.k==="ok"){
    const altWa=B?line(B,"WhatsApp").replace(/\D/g,""):"",ph2=B?line(B,"Phone2").replace(/\D/g,""):"";
    const ph=String(s.phone||"").trim(),wa=(/^\d{10}$/.test(altWa)?altWa:String(s.whatsapp||s.phone||"")).replace(/\D/g,""),wa2=wa.length===10?"91"+wa:wa;
    el.innerHTML=(ph?'<div class="num"><div class="l"><small>📱 Mobile</small><b>'+esc(ph)+'</b></div><a href="tel:'+esc(ph)+'">'+esc(T("call"))+'</a></div>':'')+
      (/^\d{10}$/.test(ph2)?'<div class="num"><div class="l"><small>📞 '+((PB.lang&&PB.lang()==="en")?"Another number":"दूसरा नंबर")+'</small><b>'+esc(ph2)+'</b></div><a href="tel:'+esc(ph2)+'">'+esc(T("call"))+'</a></div>':'')+
      (wa2?'<div class="num"><div class="l"><small>💬 WhatsApp</small><b>'+esc(/^\d{10}$/.test(altWa)?altWa:(s.whatsapp||s.phone))+'</b></div><a class="w" target="_blank" rel="noopener" href="https://wa.me/'+wa2+'">WhatsApp</a></div>':'')+
      (!ph&&!wa2?'<p class="cnote">'+esc(T("c_none"))+'</p>':'')+whoLine;
  }else{
    el.innerHTML='<p class="cnote">'+esc(T(s.k==="limit"?"c_limit":"c_setup"))+'</p>'+whoLine;
  }
  const lo=document.getElementById("lo");if(lo)lo.onclick=async()=>{await PBA.logout();contactState={k:"locked"};drawContact();};
}
/* पहले बिना लॉगिन वाला नंबर (pb_public_contact: Live दुकान + मालिक का स्विच ON हो तो) */
async function loadContact(){
  contactState={k:"loading"};drawContact();
  try{
    const r=await fetch(SB+"/rest/v1/rpc/pb_public_contact",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({p_slug:slug})});
    if(r.ok){const j=await r.json();const c=Array.isArray(j)?j[0]:j;
      contactState=c&&(c.phone||c.whatsapp)?{k:"ok",phone:c.phone,whatsapp:c.whatsapp}:{k:"off"};drawContact();return;}
    let m="";try{const j=await r.json();m=(j&&(j.message||j.msg))||"";}catch(_){}
    if(/rate limit/i.test(m)){contactState={k:"busy"};drawContact();return;}
  }catch(e){}
  /* sql-03 अभी नहीं चला: पुराना तरीका (लॉगिन के बाद नंबर) */
  const s=await PBA.session();
  if(!s){contactState={k:"locked"};drawContact();return;}
  contactState={k:"loading"};drawContact();
  try{const c=await PBA.contact(slug);contactState=c?{k:"ok",phone:c.phone,whatsapp:c.whatsapp}:{k:"setup"};}
  catch(e){
    if(/daily limit/i.test(e.message))contactState={k:"limit"};
    else if(/login required|JWT|expired/i.test(e.message)){await PBA.logout();contactState={k:"locked"};}
    else contactState={k:"setup"};
  }
  drawContact();
}
