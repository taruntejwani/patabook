<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dukan jodo · PataBook</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#172033;background:#fff}a{color:#1261d6;text-decoration:none}.wrap{max-width:560px;margin:auto;padding:18px}header{height:66px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;font-size:22px;color:#172033}.logo span{color:#1261d6}.lang{border:1px solid #dce4ef;background:#fff;border-radius:999px;padding:6px 10px;font-weight:700}h1{font-size:28px;margin:8px 0 6px}.lead{color:#687386;margin:0 0 16px}form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:13px;font-weight:700;color:#3c4043}input,select,textarea{border:1px solid #dfe1e5;border-radius:12px;padding:12px;font:inherit;font-weight:500}textarea{min-height:80px}button.send{border:0;background:#1a73e8;color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:16px}.note{color:#687386;font-size:14px}.ok{color:#16834a}</style></head><body><header class="wrap"><a class="logo" href="/">Pata<span>Book</span></a><button class="lang" id="langBtn" type="button">English</button></header><main class="wrap"><h1 data-i="title">Dukan jodo</h1><p class="lead" data-i="lead">Naam, sheher aur phone daalo. Listing review ke baad dikhegi.</p><form id="f"><label data-i="lname">Dukan ka naam<input name="name" required></label><label data-i="lcity">Sheher<select name="city"><option>Gandhidham</option><option>Adipur</option><option>Anjar</option><option>Bhuj</option><option>Mundra</option><option>Mandvi</option><option>Nakhatrana</option></select></label><label data-i="lcat">Category<select name="category"><option>Automobile</option><option>Food</option><option>Health</option><option>Shopping</option><option>Education</option><option>Home</option><option>Professional</option><option>Hotel</option></select></label><label data-i="lphone">Phone<input name="phone" inputmode="tel" required></label><label data-i="lwa">WhatsApp<input name="whatsapp" inputmode="tel"></label><label data-i="laddr">Pata<textarea name="address"></textarea></label><button class="send" type="submit" data-i="send">Bhejo</button></form><p class="note" id="msg"></p></main><script src="config.js"></script><script>
const T={hi:{title:"Dukan jodo",lead:"Naam, sheher aur phone daalo. Listing review ke baad dikhegi.",lname:"Dukan ka naam",lcity:"Sheher",lcat:"Category",lphone:"Phone",lwa:"WhatsApp",laddr:"Pata",send:"Bhejo",ok:"Mil gaya. Review ke baad PataBook pe dikhegi.",fail:"Abhi save nahi hua",need:"config.js me anon key daalo.",btn:"English"},en:{title:"List your shop",lead:"Add name, city and phone. It shows after review.",lname:"Shop name",lcity:"City",lcat:"Category",lphone:"Phone",lwa:"WhatsApp",laddr:"Address",send:"Submit",ok:"Received. It will show on PataBook after review.",fail:"Could not save yet",need:"Add the anon key in config.js.",btn:"हिन्दी"}};
let lang=localStorage.getItem("pb-lang")||"hi";
function t(k){return T[lang][k];}
function apply(){document.documentElement.lang=lang==="en"?"en":"hi";document.querySelector("[data-i=title]").textContent=t("title");document.querySelector("[data-i=lead]").textContent=t("lead");document.querySelector("[data-i=send]").textContent=t("send");document.getElementById("langBtn").textContent=t("btn");["lname","lcity","lcat","lphone","lwa","laddr"].forEach(k=>{document.querySelector("[data-i="+k+"]").childNodes[0].textContent=t(k);});}
document.getElementById("langBtn").onclick=()=>{lang=lang==="hi"?"en":"hi";localStorage.setItem("pb-lang",lang);apply();};
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();
  const msg=document.getElementById("msg");
  const c=window.PATABOOK_SUPABASE||{};
  if(!c.url||!c.anonKey){msg.textContent=t("need");return;}
  const fd=new FormData(e.target);
  const body={name:fd.get("name"),slug:slug(fd.get("name")),city:fd.get("city"),category:fd.get("category"),phone:fd.get("phone"),whatsapp:fd.get("whatsapp")||fd.get("phone"),address:fd.get("address"),is_active:false};
  msg.textContent="...";
  try{
    const res=await fetch(c.url.replace(/\/$/,"")+"/rest/v1/businesses",{method:"POST",headers:{apikey:c.anonKey,Authorization:"Bearer "+c.anonKey,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!res.ok){const j=await res.json().catch(()=>({}));msg.textContent=j.message||t("fail");return;}
    msg.className="note ok";msg.textContent=t("ok");e.target.reset();
  }catch(err){msg.textContent=t("fail");}
};
apply();
</script></body></html>
